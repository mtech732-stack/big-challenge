<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحدي الكبير</title>
<link rel="icon" href="design/logo/icon-48.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<style>
  /* شاشة الرقم السري وطبقة الرصيد بالرموز نفسها. كل المقاسات بوحدة rem، و1rem = 32 على شاشة عرضها 1920،
     فأصغر نص 32 على أساس 1920×1080 كما في design/system.md (القسم 9). واللعبة كلها في إطار شاشة الجمهور (الوثيقة 1.13). */
  html { font-size: calc(100vw / 60); }
  body { font-size: 1rem; line-height: 1.5; }
  p, h1, h2, ol { margin: 0; }
  button { min-height: 2rem; padding: 0 1.25rem; background: var(--ink); color: var(--card); white-space: nowrap; }
  button.big { min-height: 2.5rem; padding: 0 2rem; }
  button.alt { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 3px var(--ink); }
  /* لوحة: بطاقة بيضاء مستقيمة بظل صلب */
  .panel { background: var(--card); color: var(--ink); padding: 0.75rem 1.5rem; box-shadow: 0.375rem 0.375rem 0 var(--stage-3); display: grid; gap: 0.75rem; }
  .panel h2 { font-size: 1.25rem; font-weight: 800; line-height: 1.2; }
  .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .grow { margin-inline-start: auto; }
  .alert { color: var(--team-1); font-weight: 700; }
  /* تعديل الرصيد: يُفتح من الرأس في أي وقت */
  .scores { position: fixed; z-index: 7; top: 50%; left: 50%; translate: -50% -50%; width: 36rem; box-shadow: 0.375rem 0.375rem 0 var(--stage-3), 0 0 0 100vmax rgba(5,14,46,.6); }
  .scores .line { display: grid; grid-template-columns: 1fr auto 3rem auto; gap: 0.75rem; align-items: center; }
  .scores .tn { font-weight: 800; }
  .scores .line button { font-size: 1.5rem; }
  .scores .val { font-size: 1.5rem; font-weight: 900; text-align: center; direction: ltr; }

  /* بعد الرقم السري: الصفحة كلها للعبة (والشاشة المشتركة فوقها) */
  #app { min-height: 100vh; }

  /* الرقم السري: بطاقة بيضاء مستقيمة بظل صلب */
  #gate { min-height: 100vh; display: grid; place-items: center; }
  #gate form { background: var(--card); color: var(--ink); padding: 1.5rem; width: min(18rem, 100%); display: grid; gap: 0.75rem; text-align: center; box-shadow: 0.375rem 0.375rem 0 var(--stage-3); }
  #gate h1 { font-size: 1.25rem; }
  #pin { font: inherit; font-size: 1.25rem; text-align: center; letter-spacing: 0.375rem; padding: 0.25rem; border: 3px solid var(--ink); border-radius: 0; direction: ltr; width: 100%; }
  /* تطبيق آبل: لا شاشة رقم أصلاً (الوثيقة 1.17، 4.3)، فلا تومض قبل فتح اللعبة */
  html.native-app #gate { display: none; }
  #gate .alert { margin: 0; color: var(--team-1); background: var(--card); padding: 0.25rem 0.5rem; border: 2px solid var(--team-1); }

  /* الشاشة المشتركة (design/shared.md 2): لوحة الجمهور 1920×1080 تملأ النافذة، وأزرارها فيها. لا شريط تحتها */
  #single { position: fixed; inset: 0; z-index: 6; overflow: clip; background: #050E2E; }
  .frame { position: absolute; top: 50%; left: 50%; width: 1920px; height: 1080px; transform: translate(-50%, -50%) scale(var(--scale, 1)); }
  .frame iframe { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; border: 0; display: block; }
  /* design/app.md 3.3 (التطبيق، وفي الموقع منذ 106): الإطار بنسبة الشاشة لا 16:9، فتملأ نافذة الجمهور الأشرطة، واللوحة 1920×1080 في وسطها. والتكبير كما هو */
  #single { background: linear-gradient(135deg, #1A4BD1 0%, #1238A8 55%, #0E2C86 100%); }
  .frame, .frame iframe { width: var(--frame-w, 1920px); height: var(--frame-h, 1080px); }
  /* ش8-أ/82 (المعاين، v95): وسط الإطار على نصف ارتفاع الصفحة عند آخر حساب (--fit-h)، لا على 50% منها. فإذا أنقصت لوحة المفاتيح
     الصفحة والحجم ثابت في الكتابة (80) بقي الإطار مكانه، ولم يرتفع نصف لوحة المفاتيح فتخرج الخانة العليا من أعلى الشاشة */
  .native-app .frame { top: calc(var(--fit-h, 100vh) / 2); }
  body.one { overflow: hidden; }

</style>
<script>
  // ش8-أ/79 (design/app.md 2.1): شاشة الإطلاق في التطبيق لا تختفي وحدها (launchAutoHide: false)، فتُخفى بعد أول رسم صحيح
  // لشاشة الجمهور (audience.html يستدعي __hideSplash)، أو بعد 8 ثوانٍ مهما حدث، ولو رمى ما بعدها خطأ. مرة واحدة. ولا شيء في الموقع.
  // كانت المهلة 3 ثوانٍ، وفي محاكي iPhone 16 Pro (v94) جاء أول رسم عند 4.6 ثانية، فأخفتها المهلة وظهر المسرح فارغاً بينهما.
  window.__hideSplash = (() => { let done = false; return () => { if (done) return; done = true;
    try { window.Capacitor?.Plugins?.SplashScreen?.hide?.({ fadeOutDuration: 200 }); } catch {} }; })();
  setTimeout(window.__hideSplash, 8000);
</script>
<script>if (window.Capacitor?.isNativePlatform?.() === true) { document.documentElement.classList.add('native-app');
  // design/app.md 5.3: لا تكبير بنقرتين ولا بإصبعين في التطبيق.
  const v = document.querySelector('meta[name="viewport"]'); if (v) v.content += ', maximum-scale=1, user-scalable=no'; }</script>
</head>
<body>
<section id="gate">
  <form id="pin-form" autocomplete="off">
    <h1>التحدي الكبير</h1>
    <p>أدخل الرقم السري</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="الرقم السري" autofocus>
    <button id="enter" type="submit">دخول</button>
    <p id="pin-error" class="alert" hidden></p>
  </form>
</section>

<!-- بعد الرقم السري: طبقة الرصيد وحدها، واللعبة في الشاشة المشتركة تحتها -->
<main id="app" hidden>
  <!-- تعديل الرصيد: طبقة فوق الخطوة، تُفتح من «الرصيد» أو من رقم الفريق في الشاشة المشتركة، ويُتراجع عنها -->
  <section class="panel scores" id="scores" hidden>
    <h2>تعديل الرصيد</h2>
    <div class="line"><span class="tn t1" id="sn1"></span><button class="alt" data-team="1" data-d="-1">−</button><span class="val" id="sv1">0</span><button class="alt" data-team="1" data-d="1">+</button></div>
    <div class="line"><span class="tn t2" id="sn2"></span><button class="alt" data-team="2" data-d="-1">−</button><span class="val" id="sv2">0</span><button class="alt" data-team="2" data-d="1">+</button></div>
    <div class="row"><button class="alt" id="closeScores">تم</button><button class="alt" id="undoScore">تراجع</button><span>لا ينزل الرصيد تحت الصفر.</span></div>
  </section>
</main>

<!-- الشاشة المشتركة (design/shared.md): شاشة الجمهور نفسها بأزرارها، من الإعداد حتى النهاية (الوثيقة 1.13: لا نافذة مقدّم) -->
<div id="single" hidden>
  <div class="frame" id="frame"></div>
</div>

<script type="module">
  import './js/offline.js';
  import { createLink } from './js/frame-link.js';
  import { fetchPinRecord, checkPin, watchPin, isNativeApp } from './js/pin.js';
  import { loadPacks, loadWheel } from './js/content.js';
  import WHEEL, { spinMs, CHALLENGE_POINTS as WHEEL_POINTS } from './js/wheel.js';
  import TIEBREAK from './js/tiebreak.js';
  import { answersText, fits } from './js/qr.js';
  import { HIT_MS as RANK_HIT_MS } from './js/modes/ranking.js';
  import { FAIL_POINTS as AUCTION_FAIL } from './js/modes/auction.js';
  import { matchModes, pickableModes, MODES as BUILT, DRAFTS } from './js/modes/index.js';
  import * as M from './js/match.js';
  import * as P from './js/play.js';
  import * as R from './js/round.js';
  import { prepare as voxPrepare, matchMany, matchOne, split as voxSplit } from './js/voice-match.js';

  const $ = id => document.getElementById(id);
  const SAVE_KEY = 'big-challenge.match';
  // ش8-أ/73 (المالك 9 نوفمبر 2026): المباراة المحفوظة تُستأنف ما لم يمضِ على آخر فعل فيها أكثر من STALE_MS، وإلا فُتحت اللعبة
  // على شاشة البداية بمباراة جديدة. وقت آخر حفظ في مفتاح وحده (SAVED_AT_KEY)، فلا يتغير شكل المباراة المحفوظة.
  const STALE_MS = 60 * 60 * 1000;   // ساعة
  const SAVED_AT_KEY = 'big-challenge.savedAt';
  const SEEN_KEY = 'big-challenge.seen';   // ذاكرة الأسئلة المستعملة على هذا الجهاز (docs/decisions.md)
  const MUTE_KEY = 'big-challenge.muted';
  const DRAW_MS = 2690; // مدة حركة القرعة على شاشة الجمهور (design/start.md، القسم 6)
  const query = new URLSearchParams(location.search);
  let link = null, watcher = null, packs = [], wheel = null, match = null, drawing = 0, pin = '', faceError = '';
  const NATIVE = isNativeApp();
  // المساعد الصوتي في المزاد (حاله، وتفصيله في «المساعد الصوتي» أدناه).
  const VOX_KEY = 'big-challenge.voice';
  const cap = globalThis.Capacitor;
  const vox = { ok: false, on: false, dl: null, tip: '', key: '', text: '', base: '', sel: new Set(), emitted: new Set(), items: null,
    live: false, starting: false, sent: 0, later: 0, sid: '', sids: 0, keyOf: {},
    // زر الميكروفون (design/app.md 7.6): listen ما يريده المقدّم، وused بعد أول ضغطة في الموضوع (فتظهر الصفوف)،
    // وfail سبب التعذّر، وwhy إظهاره لحظةً، وheard: وصل صوت في الجلسة الجارية، وbeat مؤقت تنبيه «لا يصل صوت».
    listen: false, used: false, fail: '', why: 0, heard: false, since: 0, beat: 0 };
  const voxCall = (method, opts = {}) => cap.nativePromise('Voice', method, opts);
  let muted = false;
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch {}

  // ===== الرقم السري: لا يبدأ شيء قبله، ولا تُنشأ قناة التزامن قبله =====
  const showError = text => { $('pin-error').textContent = text; $('pin-error').hidden = false; };
  $('pin-form').onsubmit = async event => {
    event.preventDefault();
    $('enter').disabled = true;
    $('pin-error').hidden = true;
    const value = $('pin').value;
    // الخانة فارغة: لا يُتحقق من شيء (ملاحظة المعاين 8).
    if (!value.trim()) { showError('أدخل الرقم'); $('enter').disabled = false; $('pin').focus(); return; }
    const { record, bad } = await fetchPinRecord();
    if (bad) {
      showError('ملف الرقم السري فيه خطأ. أعد لصقه من صفحة التغيير.');
    } else if (!record) {
      showError('تعذّر التحقق: لا اتصال بالإنترنت. اتصل ثم أعد المحاولة.');
    } else if (await checkPin(value, record)) {
      await unlock(value);
    } else {
      showError('الرقم غير صحيح');
      $('pin').select();
    }
    $('enter').disabled = false;
  };
  async function unlock(value) {
    pin = value;
    $('pin').value = '';
    if (!packs.length) [packs, wheel] = await Promise.all([loadPacks(), loadWheel()]);
    const saved = restore();
    match = fitMethod(fitSaved(saved));
    const reset = match.step !== saved.step;
    $('gate').hidden = true;
    $('app').hidden = false;
    if (!link) startLink();
    link.send('unlock');
    link.send('view', view());
    watcher?.stop();
    // في تطبيق آبل لا تحقق مستمر، فلا يُغلق أبداً بتغيّر الرقم.
    watcher = NATIVE ? null : watchPin(pin, lock);
    render(reset ? { text: 'عادت المباراة إلى البداية.' } : undefined);
  }

  // تغيّر الرقم في المستودع: تُغلق اللعبة فوراً في النافذتين، ويُطلب الرقم الجديد.
  function lock() {
    watcher?.stop();
    link?.send('lock');
    $('app').hidden = true;
    $('gate').hidden = false;
    render();
    showError('تغيّر الرقم السري. أدخل الرقم الجديد.');
    $('pin').focus();
  }

  // التحقق من الرقم الآن (يُستدعى أيضاً عند «ابدأ القرعة»، أي عند بدء كل مباراة جديدة).
  window.verifyPinNow = () => watcher?.checkNow();

  // ===== حفظ المباراة: إن أُعيد تحميل المتصفح عادت من حيث توقفت (docs/decisions.md) =====
  // ومباراة تركت أكثر من ساعة (stale) لا تُستأنف: مباراة جديدة بطريقتها في شاشة البداية. وذاكرة الأسئلة لا تُمسّ، فما ظهر فيها لا يعود.
  // ومباراة محفوظة قبل v87 بلا وقت تُستأنف كما كانت، ووقتها من أول حفظ بعدها.
  function savedAt() { try { return Number(localStorage.getItem(SAVED_AT_KEY)) || 0; } catch { return 0; } }
  const stale = (now = Date.now()) => { const at = savedAt(); return at > 0 && now - at > STALE_MS; };
  // ش8-أ/87 (المالك 10 نوفمبر 2026): «اذا اغلق التطبيق غلقا تاما فتعيد اما اذا كان غلقا و يظل باقي في الخلفية فيبقى». في التطبيق وحده:
  // sessionStorage يبقى ما دام التطبيق حياً (ولو في الخلفية) ويُمسح بإغلاقه التام. فإن غاب علَمه عند التحميل فهذا تشغيل بعد
  // إغلاق تام: بداية جديدة بلا اسمين، وذاكرة الأسئلة لا تُمسّ. وإلا فالقاعدة كما هي (الساعة). والموقع على حاله.
  const ALIVE_KEY = 'big-challenge.alive';
  const cold = (() => { if (!NATIVE) return false; try { const was = sessionStorage.getItem(ALIVE_KEY); sessionStorage.setItem(ALIVE_KEY, '1'); return !was; } catch { return false; } })();
  function restore() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch {}
    if (M.isMatch(saved) && ((saved.step !== 'setup' && stale()) || (cold && (saved.step !== 'setup' || saved.teams?.[1] || saved.teams?.[2])))) {
      const fresh = M.newMatch({ pack: packs.some(p => p.id === saved.pack) ? saved.pack : packs[0]?.id ?? null, method: saved.method });
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(fresh)); localStorage.setItem(SAVED_AT_KEY, String(Date.now())); } catch {}
      return fresh;
    }
    if (M.isMatch(saved) && (!saved.pack || packs.some(p => p.id === saved.pack))) return saved.pack ? saved : { ...saved, pack: packs[0]?.id ?? null };
    return M.newMatch({ pack: packs[0]?.id ?? null });
  }
  // ش8-أ/75: وقت آخر فعل لا يجدّده إلا فعل المقدّم (نقرة أو أمر، byHand). والحفظ من المؤقتات (انتهاء عدّاد، وقت القائمة، العجلة،
  // دور الترتيب) يحفظ الحالة ويُبقي الوقت كما هو: فإن انطلقت متأخرة في الخلفية قبل visibilitychange لم تبدُ فعلاً جديداً.
  let byHand = false;
  const hand = fn => function (...a) { byHand = true; try { return fn.apply(this, a); } finally { byHand = false; } };
  const save = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(match)); if (byHand) localStorage.setItem(SAVED_AT_KEY, String(Date.now())); } catch {} };
  // والتطبيق أو الصفحة يعودان من الخلفية دون إعادة تحميل (visibilitychange، ويطلقه WKWebView في تطبيق آبل عند العودة):
  // القاعدة نفسها، فإن تُركت المباراة أكثر من ساعة صارت اللعبة على شاشة البداية بمباراة جديدة، بلا سؤال.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !match || match.step === 'setup' || !$('gate').hidden || !stale()) return;
    clearTimeout(drawing); drawing = 0;
    update(M.newMatch({ pack: match.pack, method: match.method }));
  });

  // الحزمة تُختار تلقائياً ولا تظهر (الوثيقة 1.1، 4.5): الحزمة الأولى في الفهرس.
  const pack = () => packs.find(p => p.id === match.pack);
  // الأنماط التي يختار منها الفريقان: المبنية وحدها، ولها ملف أسئلة في الحزمة، وما لم تستثنه (ملاحظة تدقيق ش1، البند 6).
  // و«?preview» في الرابط يضيف إليها معاينة ما لم يُبنَ بعد، للتجربة أثناء البناء وحدها، لا في مباراة تُلعب.
  const PREVIEW = query.has('preview');
  // والنمط الذي تُبنى مراحله الآن (DRAFTS) يُلعب في رابط المعاينة وحده حتى تكتمل شريحته.
  const MODES = PREVIEW ? [...BUILT, ...DRAFTS] : BUILT;
  // شريط البونص (ش6، اكتملت بتدقيقها): يُلعب في الرابطين إن وصلت تحدياته وخاناته (content/wheel.json).
  // units: ما يديره مشغّل الجولة في المباراة: الأنماط، ومعها الشريط.
  // والجولة الفاصلة (ش7) تبدأ من النتيجة النهائية عند التعادل، وليست نمطاً.
  const units = () => [...MODES, ...(wheel ? [WHEEL] : []), TIEBREAK];
  const modesOf = p => (!p ? [] : PREVIEW ? matchModes({ modes: MODES, pack: p, files: p.files }) : pickableModes({ modes: MODES, pack: p, files: p.files }));
  const modes = () => modesOf(pack());
  const modeName = id => (pack() ? matchModes({ modes: MODES, pack: pack(), files: pack().files }) : []).find(m => m.id === id)?.name ?? id;
  // عدد أنماط أكبر مما في الحزمة لا يُختار: يصير 2 في الإعداد، فلا تعلق المباراة في اختيار الأنماط.
  // مباراة محفوظة بدأت في رابط المعاينة ثم فُتح الرابط العادي، ولم تبدأ مواجهتها: إن كان فيها نمط لا يُختار هنا،
  // أو عدد أنماطها أكبر مما في الحزمة، عادت إلى الإعداد بالاسمين، كي لا يقف الاختيار (تقرير المعاين ش3).
  // وإن بلغت المواجهة فلا تعلق: الجولة التي لم يُبنَ نمطها يُتخطى بزر «تخطَّ».
  // ومباراة محفوظة في خطوة القرعة قبل 1.11 تُقرأ في خطوة الاختيار، والقرعة فيها (M.fromDraw).
  function fitSaved(m) {
    m = M.fromDraw(m);
    if (PREVIEW || m.step !== 'pick') return m;
    const available = modesOf(packs.find(p => p.id === m.pack));
    const bad = m.picks.some(p => !available.some(x => x.id === p.mode)) || M.METHODS[m.method].rounds > available.length;
    return bad ? { ...M.newMatch({ pack: m.pack, method: 'short' }), teams: m.teams } : m;
  }
  const fitMethod = m => (m?.step === 'setup' && M.METHODS[m.method].rounds > modesOf(packs.find(p => p.id === m.pack)).length ? { ...m, method: 'short' } : m);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  // الرقم بإشارته، والمدى والوقت بشرطته أو نقطتيه («2025–2026»، «0:15»)، معزولة يساراً فلا تنقلب (تقرير المعاين ش5، 32).
  const num = s => esc(s).replace(/([+−]?\d+(?:[:–]\d+)?)/g, '<span class="ltr">$1</span>');

  // ما تعرضه شاشة الجمهور: حالة المباراة وأسماء الأنماط، ومن الجولة ما تعيده audience() وحدها.
  // الجولة نفسها (وفيها الإجابات) لا تُرسل أبداً.
  const view = (moments = []) => {
    const { history, round, ...pub } = match;
    return { match: pub, modes: modes().map(({ id, name }) => ({ id, name })), play: playView(), muted, moments };
  };
  const roundMode = () => match.round && P.modeOf(units(), match.round.mode);
  // باركود الإجابات (7.1، design/s8.md 2): في سؤال المزاد وقائمة الترتيب. يظهر تلقائياً في بدايته (قبل المزايدة، وقبل «ابدأ»)،
  // ويخفيه المقدّم بضغطة، ولا يعود إلا بطلبه («الباركود»). والحال في المباراة (match.qr: مفتاح السؤال وظاهر أو لا)، فيبقى بعد إعادة التحميل،
  // ولا يدخل التراجع. key: الجولة والسؤال · open: السؤال جارٍ (يُعاد فيه بطلب) · auto: بدايته.
  function qrQuestion() {
    const mode = match.step === 'play' && roundMode();
    if (!mode || (mode.id !== 'auction' && mode.id !== 'ranking')) return null;
    const st = match.round.state, a = mode.audience(st);
    if (a.screen !== 'topic' && a.screen !== 'list') return null;
    const auto = mode.id === 'auction' ? st.phase === 'bid' : st.phase === 'read';
    const key = `${match.round.n}:${(st.topics ?? st.lists)[st.index]?.id}`;
    // وإن زاد النص عمّا يسعه الرمز (قائمة كبيرة جداً) فلا باركود لهذا السؤال، ويمضي كأنه أُخفي (design/auction.md 7.10 قيد القرار).
    if (!qrFits(key, () => answersText(mode.id, mode.presenter(st)))) return null;
    // وفي المزاد يُخفى عند «كشف القائمة»، فالقائمة صارت على الشاشة (design/s8c.md 1).
    return { key, mode, st, auto, open: !['revealed', 'decided', 'listend', 'mark'].includes(st.phase) };
  }
  const qrFit = new Map();
  function qrFits(key, text) {
    if (!qrFit.has(key)) qrFit.set(key, fits(text()));
    return qrFit.get(key);
  }
  function qrShown() {
    const q = qrQuestion();
    if (!q) return null;
    const on = match.qr?.key === q.key ? match.qr.on && q.open : q.auto;
    return on ? q : null;
  }
  const setQr = on => { const q = qrQuestion(); if (q) update({ ...match, qr: { key: q.key, on } }); };
  function playView() {
    const mode = match.step === 'play' && roundMode();
    if (!mode) return null;
    const a = mode.audience(match.round.state);
    return {
      n: match.round.n, total: M.rounds(match), modeName: mode.id === WHEEL.id || mode.id === TIEBREAK.id ? mode.name : modeName(mode.id), modeId: mode.id, a, scores: match.round.scores, wheel: mode.id === WHEEL.id,
      // العدّاد الجاري ووقت بدئه بساعة الجهاز، فتعدّه نافذة الجمهور صحيحاً ولو أُعيد تحميلها.
      timer: match.round.timer ? { ...match.round.timer, at: match.timerAt } : null,
      next: P.nextText(match, modeName),
      fresh: a.screen === 'intro' && match.played === 1,
      // نص الإجابات للباركود ما دام ظاهراً، يرسمه العرض رمزاً لا نصاً.
      qr: (q => (q ? answersText(q.mode.id, q.mode.presenter(q.st)) : null))(qrShown()),
      // المساعد الصوتي في الوفاء (design/app.md 7): النص المسموع وما حدده المقدّم منه. ولا شيء منه في الموقع.
      ...(voxShown() ? { vox: voxView() } : {}),
    };
  }
  function update(next, anim) {
    next = fitMethod(next);
    if (next === match && !anim) return;
    if (next.step !== match.step) faceError = '';
    match = next;
    save();
    if (anim) link?.send('anim', { name: anim, view: view() });
    else link?.send('view', view());
    render();
  }

  // بعد كل فعل في الجولة: يُحفظ وقت بدء العدّاد إن بدأ، وتُرسل الحالة ومعها لحظاتها الانفعالية.
  // free: نقرة لا تأتي بعدها أزرار مكانها (عنصر من قائمة المزاد يمتلئ ولا يُنقر ثانية)، فلا تُمهل ما بعدها
  // ما لم تتغير الحالة نفسها (آخر عنصر يُنهي الموضوع).
  function roundUpdate(next, free) {
    // الجولة الفاصلة تنتهي إلى النتيجة النهائية بخانتها (final.tb، بحركة دخول المسار)، أو يعيدها التراجع إليها قبل أول سؤال:
    // خطوة جديدة لا فعل في جولة. وأسئلتها التي ظهرت تدخل ذاكرة الأسئلة عند انتهائها.
    if (next.step === 'final' && match.step === 'play') {
      if (next.final.tb) remember(TIEBREAK, pack().files[TIEBREAK.contentKey], TIEBREAK.used(match.round.state));
      hold();
      return update(next, next.final.tb ? 'fin' : undefined);
    }
    if (next === match || (next.round === match.round)) return;
    const events = next.round?.events ?? [];
    if (events.length === 0 && next.round?.state === match.round?.state && next.scores === match.scores) { match = next; return; }
    const changed = next.round?.state !== match.round?.state && !(free && next.round?.state.phase === match.round?.state.phase);
    match = events.some(e => e.type === 'timer') ? { ...next, timerAt: Date.now() } : next;
    save();
    link?.send('view', view(events.filter(e => e.type === 'moment')));
    if (changed) hold();
    render();
  }
  // النقرة المزدوجة أو المتأخرة (تقرير المعاين ش2، التعثّر 1): بعد كل تغيّر في حالة السؤال يأتي زر آخر مكان المنقور،
  // فتُهمل نقرات أزرار الجولة 0.7 ثانية، وتظهر معطّلة حتى يراها المقدّم. ومنها تغيّرها بانتهاء الوقت.
  const HOLD_MS = 700;
  let heldUntil = 0, holdTimer = 0;
  const held = () => performance.now() < heldUntil;
  function hold() {
    heldUntil = performance.now() + HOLD_MS;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(render, HOLD_MS + 20);
  }
  const roundAct = (action, free = false) => { if (free || !held()) roundUpdate(P.act(match, units(), action), free); };

  // وقت القائمة في الترتيب: حين ينقضي ترسل هذه الصفحة «انتهى وقت القائمة» (الوحدة تتحقق من وقته). ووقتها على شاشة الجمهور.
  let timeupFor = 0;
  function listClock() {
    const st = match?.step === 'play' && match.round?.mode === 'ranking' ? match.round.state : null;
    const a = st && roundMode().audience(st);
    if (a?.listEnds && Date.now() >= a.listEnds && timeupFor !== a.listEnds && $('gate').hidden) { timeupFor = a.listEnds; roundUpdate(P.act(match, MODES, 'timeup')); }
  }
  setInterval(listClock, 250);
  // دوران العجلة: حين تنتهي حركته على شاشة الجمهور (ووقفة 1.2 ثانية بعدها) ترسل النافذة التي تحكم «land»، فتظهر الخانة.
  // والوقت من ساعة الجهاز (at)، والوحدة لا تقبله قبل وقته.
  let landFor = 0;
  function wheelClock() {
    const st = $('gate').hidden && match?.step === 'play' && match.round?.mode === WHEEL.id ? match.round.state : null;
    if (st?.phase === 'spin' && landFor !== st.at && Date.now() >= st.at + spinMs(st.landed)) { landFor = st.at; roundUpdate(P.act(match, units(), 'land')); }
  }
  setInterval(wheelClock, 100);
  // الترتيب: بعد لحظة الإصابة (1.2 ثانية) ترسل النافذة التي تحكم «turn»، فينتقل الدور إلى الخصم بعدّاده (design/s8.md 3.2).
  let turnFor = -1;
  function rankTurn() {
    const st = $('gate').hidden && match?.step === 'play' && match.round?.mode === 'ranking' ? match.round.state : null;
    if (st?.phase === 'hit' && turnFor !== st.at && Date.now() >= st.at + RANK_HIT_MS) { turnFor = st.at; roundUpdate(P.act(match, units(), 'turn')); }
  }
  setInterval(rankTurn, 100);

  // ذاكرة الأسئلة: ما ظهر لا يتكرر حتى يُستنفد البنك.
  const seen = () => { try { return JSON.parse(localStorage.getItem(SEEN_KEY)) ?? []; } catch { return []; } };
  // وما أخذته الجولة يدخلها، ودورة جديدة لبنكها إن لم يبقَ منه ما يكفي جولة (ش8-أ/69، js/round.js). والجولة الفاصلة مرة في المباراة.
  const remember = (unit, file, taken) => { try { localStorage.setItem(SEEN_KEY, JSON.stringify(R.remember(seen(), unit, file, taken))); } catch {} };
  function startNext() {
    if (held()) return;
    const content = { ...pack().files, [WHEEL.contentKey]: wheel };
    const next = P.startNext(match, { modes: units(), content, seen: seen() });
    if (next === match) return;
    // وما أخذه بنكها في المباراة كلها (ش8-أ/71).
    try { localStorage.setItem(SEEN_KEY, JSON.stringify(P.remember(seen(), next, { modes: units(), content }))); } catch {}
    roundUpdate(next);
  }
  // نقرتان على «تخطَّ…» لا تتخطيان عنصرين.
  const skipNext = () => { if (held()) return; const next = P.skipNext(match, units()); if (next !== match) hold(); update(next); };
  // ما لم يُبنَ بعد يُتخطى في التجربة، ويُذكر موعده (القسم 11 من الوثيقة). text: نص الزر بلا ترميز.
  const LATER = { 'last-two': 3, auction: 4, ranking: 5 };
  function nextButton() {
    const kind = P.nextKind(match, units()), item = P.upcoming(match);
    const make = (text, rest) => ({ text, label: num(text), ...rest });
    if (kind === 'final') return make('إلى النتيجة النهائية', { act: 'toFinal' });
    if (kind === 'start') return make(item.kind === 'wheel' ? 'شريط البونص' : `ابدأ الجولة ${item.n}`, { act: 'startNext' });
    // لا يُتخطى الشريط إلا إن لم تصل تحدياته (content/wheel.json)، كي لا تعلق المباراة.
    if (item.kind === 'wheel') return make('تخطَّ شريط البونص', { act: 'skipNext', hint: 'لم تصل تحديات شريط البونص، فيُتخطى.' });
    return make(`تخطَّ الجولة ${item.n}`, { act: 'skipNext',
      hint: `«${esc(modeName(item.mode))}» يُبنى في الشريحة <span class="ltr">${LATER[item.mode] ?? ''}</span>، فتُتخطى جولته الآن في التجربة.` });
  }

  // ===== البداية على الشاشة المشتركة (design/shared.md 4) =====
  async function goDraw() {
    if (match.step !== 'setup') return;
    const errors = M.setupErrors(match, modes());
    if (errors.length) return render(errors[0]);
    // التحقق من الرقم السري عند بدء كل مباراة جديدة (4.3): إن تأكد تغيّره أُغلقت اللعبة.
    const result = await watcher?.checkNow();
    if (result === 'changed') return;
    // ش8-أ/76: ما بعد await يجري بعد أن ينزل byHand (finally في hand)، فيُعاد رفعه للحفظ: «اختيار الأنماط» فعل المقدّم.
    hand(() => update(M.toDraw(match)))();
  }

  // «قرعة البداية» في صفحة الاختيار (design/s8b.md 3).
  function startDraw() {
    if (match.step !== 'pick' || match.winner || drawing) return;
    update(M.draw(match), 'draw');
    // النتيجة محسومة ومحفوظة، وتظهر أزرارها حين تقف حركتها أمام الجمهور.
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    drawing = reduced ? 0 : setTimeout(() => { drawing = 0; render(); }, DRAW_MS);
    render();
  }

  // «ابدأ المباراة» من المواجهة: أول جولة (الوثيقة 1.13: نافذة واحدة وحدها).
  function begin() {
    if (held()) return;
    const nb = nextButton();
    if (nb.act !== 'startNext') return actions[nb.act]?.();
    startNext();
  }

  // sure: أكّدها المقدّم بلوحة اللعبة (design/app.md 5.5، وفي الموقع أيضاً منذ 106، 8.2)، فلا confirm. وبلا تأكيد confirm كما كان.
  function newMatch(sure) {
    if (match.step !== 'setup' && !sure && !confirm('تبدأ مباراة جديدة ويُمحى ما سبق. أتتابع؟')) return;
    clearTimeout(drawing); drawing = 0;
    update(M.newMatch({ pack: match.pack, method: match.method }));
  }

  // ===== العرض =====
  // الشاشة المشتركة ظاهرة ما دامت اللعبة مفتوحة (بعد الرقم السري)، من الإعداد حتى النهاية.
  const shared = () => !$('app').hidden;
  function render(error) {
    if (!match) return;
    for (const k of [1, 2]) {
      $('sn' + k).textContent = match.teams[k] || (k === 1 ? 'الفريق الأول' : 'الفريق الثاني');
      $('sv' + k).textContent = match.scores[k];
    }
    $('undoScore').disabled = match.step === 'play' ? !match.round?.history.length : !match.history.length;
    renderStage(error);
    voxSync();
  }

  // زرّا الفريقين في المزايدة (design/auction.md 3.0): لا يأتي زر آخر مكانهما، فلا يُمهل ما بعدهما.
  const raise = team => roundAct('raise:' + team, true);

  // ===== الشاشة المشتركة: شاشة الجمهور في هذه النافذة، وأزرارها (design/shared.md 3 و4) =====
  function renderStage(error) {
    const on = shared();
    $('single').hidden = !on;
    document.body.classList.toggle('one', on);
    let frame = $('frame').querySelector('iframe');
    if (on && !frame) {
      frame = document.createElement('iframe');
      frame.src = 'audience.html?embed';
      frame.title = 'شاشة الجمهور';
      $('frame').append(frame);
    }
    if (!on && frame) { frame.remove(); link?.lost(); }
    fitStage();
    if (on) sendCtl(error);
  }
  // ش8-أ/80 (محاكي iPhone 16 Pro، v94): لوحة المفاتيح في التطبيق تُنقص ارتفاع الصفحة، وكل حرف يرسم (render ← fitStage)، فكان المسرح
  // يُحسب على الارتفاع المنقوص فيصغُر وينحشر، ثم لا يُعاد بعد إغلاقها. فما دامت خانة اسم مركّزة في شاشة الجمهور يبقى الحجم كما هو،
  // ويُعاد حسابه حين يزول التركيز (audience.html يستدعي __refit عند blur، ثم بعد 0.4 و1 ثانية حتى تنغلق لوحة المفاتيح).

  // ش8-أ/84 (محاكي iPhone 16 Pro، v96): وبعد «تم» يزول التركيز ولوحة المفاتيح لم تنغلق بعد، فكان أول رسم أو إعادة يحسب المسرح على
  // الصفحة المنقوصة فيظهر بربع حجمه أعلى الشاشة لحظةً. فما دامت الصفحة أقصر بوضوح من آخر حساب (لوحة المفاتيح ظاهرة) لا يُعاد
  // الحساب أيضاً، إلا في الإعادة الأخيرة بعد ثانية (last). وانغلاق لوحة المفاتيح نفسه يُطلق resize فيُعاد به.

    if (NATIVE && force !== true && (typing() || innerHeight < fitH * 0.85)) return;
    const root = document.documentElement.style, k = Math.min(innerWidth / 1920, innerHeight / 1080);
    root.setProperty('--scale', k);
    // الإطار يغطي الشاشة كلها بالتكبير نفسه (أعرض: 1080 × vw/vh · أطول: 1920 × vh/vw)، في الموقع والتطبيق (106).
    root.setProperty('--frame-w', Math.ceil(innerWidth / k) + 'px'); root.setProperty('--frame-h', Math.ceil(innerHeight / k) + 'px');

  };

  document.addEventListener('fullscreenchange', () => render());

  // الأزرار التي تظهر على الشاشة المشتركة الآن، بمواضعها: card في البطاقة · near بجانب العدّاد · a وb صفوف الزاويتين.
  // لا شيء منها يحمل الإجابة: نصوص الانتقال والحكم وحدها.
  let lastError = null;
  function controls(error) {
    if (!shared()) return null;
    if (error !== undefined) lastError = error;
    if (match.step !== 'setup') lastError = null;
    const step = match.step, wait = held();
    const c = { card: [], near: [], a: [], b: [], c: [] };
    // «ملء الشاشة» في الموقع وحده (design/app.md 8.3): في التطبيق بلا معنى. وهو أيقونة 96 في كل شاشة، ومنها البداية (ش8-أ/106).
    const fs = NATIVE || document.fullscreenElement ? [] : [{ cmd: 'fullscreen', label: 'ملء الشاشة', kind: 'alt', icon: true }];
    const fresh = { cmd: 'new', label: 'مباراة جديدة', kind: 'alt' };
    if (step === 'setup') {
      c.names = true;
      c.count = { value: match.method, four: modes().length >= M.METHODS.full.rounds };
      c.card = [{ cmd: 'draw', label: 'اختيار الأنماط' }];
      c.error = lastError?.text ?? '';
      c.b = [fs];
    }
    // صفحة الاختيار والقرعة فيها (design/s8b.md 3): «قرعة البداية» وحده قبلها، ثم «إلى المواجهة» في مكانه معطّلاً حتى يكتمل الاختيار،
    // و«تراجع» بجانبه بعد أول اختيار (القرعة لا تُعاد بالتراجع). ولا نقر على البطاقات أثناء حركة القرعة.
    if (step === 'pick') {
      const done = M.picksDone(match);
      if (!match.winner) c.card = [{ cmd: 'draw', label: 'قرعة البداية' }];
      else {
        c.pick = !done && !drawing;
        if (match.picks.length) c.card.push({ cmd: 'undoPick', label: 'تراجع', kind: 'alt' });
        c.card.push({ cmd: 'toFace', label: 'إلى المواجهة', off: !done || !!drawing });
      }
      c.b = [[fresh], fs];
    }
    if (step === 'face') {
      const nb = nextButton();
      c.card = nb.act === 'startNext'
        ? [{ cmd: 'begin', label: 'ابدأ المباراة' }]
        : [{ cmd: 'next', label: nb.text, off: !!nb.off }];
      c.card.push({ cmd: 'replay', label: 'أعد العرض', kind: 'alt' });
      c.error = faceError;
      c.b = [[fresh], fs];
    }
    // أزرار الزاوية في الجولة والنهاية (design/s8b.md 7): أيقونتا «تراجع» و«⋯» وحدهما، وما سواهما في لوحة «⋯» (c.more) تفتحها الشاشة نفسها:
    // الصوت · ملء الشاشة · (الباركود) · الرصيد، ثم «مباراة جديدة» في سطرها. ولا «المقدّم»: النافذة الواحدة وحدها (الوثيقة 1.13). undoOff: null بلا «تراجع» (مقدمة الجولة).
    const corner = undoOff => {
      // ش8-أ/106: «ملء الشاشة» (الموقع وحده) أيقونةً في صف الزاوية بعد «تراجع»، لا في لوحة «⋯». فاللوحة صفاً واحداً بأيقوناتها الأربع
      // (مع «ملء الشاشة») كانت تنتهي عند 658 ونزولها إلى 328، فتمسّ صف الشارات في الجولة (أزرار العدّاد من 605 على 310): check.js −18.
      // وبهذا لوحة «⋯» في الموقع كالتطبيق، وصف الزاوية 229–565.
      c.a = [[...fs.map(b => ({ ...b, icon: true })), ...(undoOff === null ? [] : [{ cmd: 'undo', label: 'تراجع', kind: 'alt', icon: true, off: undoOff }]), { cmd: 'more', label: 'المزيد', kind: 'alt opt' }]];
      c.b = []; c.c = [];
      c.more = [{ cmd: 'mute', label: muted ? 'مكتوم' : 'الصوت', icon: true },
        { cmd: 'scores', label: 'الرصيد', icon: true }, ...voxIcon(), { ...fresh, kind: '', icon: true }];
    };
    const mode = step === 'play' && roundMode();
    if (mode) {
      const st = match.round.state, acts = mode.actions(st), screen = mode.audience(st).screen;
      const act = (id, label, kind) => acts.some(a => a.id === id) ? [{ cmd: 'act:' + id, label: label ?? acts.find(a => a.id === id).label, kind, off: wait }] : [];
      if (screen === 'intro') c.card = act('show');

      const st = voxFulfil();
      if (!st || !vox.ok || !vox.on || st.over || !match.round.timer) return;
      // متعذّر: الضغطة تُظهر السبب 3 ثوانٍ، والتالية تحاول من جديد.
      if (vox.fail) {
        if (!vox.why) { vox.why = setTimeout(() => { vox.why = 0; vox.fail = ''; render(); }, 3000); render(); }
        return;
      }
      vox.listen = !vox.listen;
      if (vox.listen) vox.used = true;
      render();
      link?.send('view', view());
      voxSend(true);
      return;
    }
    const st = voxFulfil();
    if (!st || !voxShown()) return;
    const marked = new Set((st.said ?? []).filter(x => Array.isArray(x.w)).flatMap(x => x.w));
    if (arg.startsWith('w:')) {
      const k = Number(arg.slice(2));
      if (!Number.isInteger(k) || k < 0 || k >= voxSplit(vox.text).length || marked.has(k)) return;
      vox.sel.has(k) ? vox.sel.delete(k) : vox.sel.add(k);
      voxSend(true); render(); return;
    }
    if (arg === 'ok' && vox.sel.size) {
      const ws = voxSplit(vox.text), ks = [...vox.sel].sort((a, b) => a - b), phrase = ks.map(k => ws[k]).join(' ');
      const lit = new Set((st.said ?? []).filter(x => Array.isArray(x.w)).map(x => x.i));
      const m = matchOne(phrase, vox.items);
      vox.sel = new Set();
      // يطابق عنصراً لم يُذكر: يضيء. وإلا فإجابة اعتمدها المقدّم بنصها، ولو شابهت ما أضاء: «اعتمد» حكمه، فلا يمضي بلا أثر
      // (كان يمضي بلا شيء إن شابهت الكلمات عنصراً أضاء، فيظن المقدّم أن «اعتمد» لا يعمل).
      if (m && !lit.has(m.i)) { vox.emitted.add(m.i); roundAct(`say:${m.i}:${ks.join(',')}`, true); }
      else roundAct(`say::${ks.join(',')}:${phrase}`, true);
      voxSend(true);
    }
  }

  // نقرات الشاشة المشتركة: تصل من شاشة الجمهور التي في هذه النافذة وحدها.
  addEventListener('message', hand(e => {
    const frame = $('frame').querySelector('iframe');
    if (!frame || e.source !== frame.contentWindow || e.origin !== location.origin || !match) return;
    if (e.data?.bc === 'need-ctl') return sendCtl();
    if (e.data?.bc !== 'cmd' || !shared()) return;
    // والقيمة قد تحمل «:» («act:mark:7»)، فهي كل ما بعد الأول.
    const [cmd, ...rest] = String(e.data.cmd).split(':'), arg = rest.join(':');
    if (cmd === 'teams' && match.step === 'setup') update(M.setTeams(match, String(e.data.a ?? ''), String(e.data.b ?? '')));
    if (cmd === 'count' && match.step === 'setup' && M.METHODS[arg]?.rounds <= modes().length) update(M.setMethod(match, arg));
    if (cmd === 'draw') match.step === 'setup' ? goDraw() : startDraw();
    if (cmd === 'pick' && !drawing) update(M.pick(match, arg, modes()));
    if (cmd === 'back' && !drawing) update(M.backToSetup(match));
    if (cmd === 'begin') begin();
    // عدّ المزاد (ش8-أ/54، المالك في لعب حقيقي): «عُدّ · +1» لا يأتي بعده زر آخر مكانه، فكل ضغطة تُحسب فوراً بلا مهلة 0.7 ثانية،
    // كزرّي المزايدة. ولا يحكم العدّ بعد الوثيقة 1.14، فالحكم بعد «كشف القائمة».
    // وكذلك حذف ما أضاء من المساعد الصوتي (unsay، design/app.md 7.2): لا يأتي بعده زر مكانه.
    // «كشف القائمة» في الوفاء بالمساعد (ملاحظة المدقّق 96): الكلمة الأخيرة كانت تنتظر ما بعدها (94)، والكشف يوقف السماع قبل أن يصل
    // النص الأخير، فيضيع آخر ما قيل. فيُحسم ما سُمع أولاً، ثم يُكشف. وما أضاء لا يضيء ثانية (emitted).
    if (cmd === 'act' && arg === 'reveal' && voxShown()) voxHeard(null, true);
    if (cmd === 'act') roundAct(arg, roundMode()?.id === 'auction' && (arg === 'count' || arg.startsWith('unsay:')));
    if (cmd === 'raise') raise(Number(arg));
    if (cmd === 'next') actions[nextButton().act]?.();
    if (cmd === 'mute') toggleMute();
    if (cmd === 'new') newMatch(arg === 'sure');
    if (cmd === 'qr') setQr(arg === 'show');
    if (cmd === 'vox') voxCmd(arg);
    if (cmd === 'fullscreen') document.documentElement.requestFullscreen?.().catch(() => {});
    if (['toPick', 'undoPick', 'toFace', 'replay', 'undo', 'scores', 'announce', 'tiebreak'].includes(cmd)) actions[cmd]();
  }));

  // تطبيق آبل: تُفتح اللعبة مباشرة بلا رقم (الوثيقة 1.17، 4.3).
  if (NATIVE) unlock('');
  voxInit();

  function startLink() {
    link = createLink('presenter', (type, data) => {
      // انتهى عدّاد في نافذة الجمهور: يُطبَّق إن طابق رقمه العدّاد الجاري، وإلا أُهمل (عقد الوحدة 5).
      if (type === 'timeout' && match && $('gate').hidden) roundUpdate(P.act(match, units(), 'timeout', data.id));
      if (type === 'need-view') $('gate').hidden && match ? link.send('view', view()) : link.send('lock');
    });
  }

  $('closeScores').onclick = () => { $('scores').hidden = true; };
  // أثناء الجولة يُعدَّل الرصيد عبر مشغّل الجولة، فيُتراجع عنه كأي حكم (عقد الوحدة 5).
  $('scores').onclick = hand(e => {
    const b = e.target.closest('[data-team]');
    if (!b) return;
    const team = +b.dataset.team;
    if (match.step === 'play') roundUpdate(P.setScore(match, team, match.scores[team] + +b.dataset.d));
    else update(M.adjustScore(match, team, +b.dataset.d));
  });
  // «تراجع» في طبقة الرصيد لا تقع عليه نقرة من زر آخر، فلا يُمهل.
  $('undoScore').onclick = hand(() => (match.step === 'play' ? roundUpdate(P.undo(match, units())) : update(M.undoScore(match))));

</script>
</body>
</html>
