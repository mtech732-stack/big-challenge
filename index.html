<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحدي الكبير</title>
<link rel="icon" href="data:,">
<style>
  :root { --stage: #1A4BD1; --stage-2: #1238A8; --stage-3: #0E2C86; }
  * { box-sizing: border-box; font-style: normal; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Noto Kufi Arabic", "Segoe UI", Tahoma, sans-serif;
    background: linear-gradient(135deg, var(--stage) 0%, var(--stage-2) 55%, var(--stage-3) 100%);
    color: #fff; display: grid; place-items: center; text-align: center;
  }
  h1 { font-size: clamp(40px, 7vw, 96px); margin: 0 0 24px; font-weight: 800; }
  p { font-size: clamp(18px, 2.2vw, 32px); margin: 0; }
  .build { opacity: .75; margin-top: 24px; }
</style>
</head>
<body>
  <main>
    <h1 id="title">التحدي الكبير</h1>
    <p>الصفحة الأولى · الشريحة 0</p>
    <p class="build" id="build">الإصدار <span dir="ltr">0.1</span> · <span dir="ltr">2026-10-23</span></p>
  </main>
</body>
</html>
