<!doctype html><html><head><style>
html,body{margin:0;overflow:hidden}
#w{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:linear-gradient(135deg,#1A4BD1 0%,#1238A8 55%,#0E2C86 100%)}
#c{position:absolute;width:1920px;height:1080px}
.f,.e{position:absolute;left:-2000px;width:5920px;transform:rotate(-6deg)}
.f1{top:-1214px;height:1800px;background:linear-gradient(0deg,#661220 0%,#7A1622 22%,#8E1A28 60%)}
.f2{top:586px;height:1800px;background:linear-gradient(180deg,#0E2C86 0%,#1238A8 22%,#1A4BD1 60%)}
.e{top:584px;height:4px;background:rgba(255,255,255,.7);box-shadow:0 4px 12px rgba(14,44,134,.6);transform-origin:2960px 2px}
.f1,.f2{transform-origin:2960px 900px}
.rays{position:absolute;left:299px;top:-122px;width:1322px;height:1322px;border-radius:50%;background:repeating-conic-gradient(from 8deg,rgba(255,255,255,.13) 0 7deg,rgba(255,255,255,0) 7deg 20deg);-webkit-mask:radial-gradient(closest-side,#000 30%,transparent 100%)}
.halo{position:absolute;left:550px;top:129px;width:820px;height:820px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.34),rgba(255,255,255,.1) 55%,rgba(255,255,255,0))}
.logo{position:absolute;left:650px;top:224px;width:620px;height:630px}
</style></head><body><div id="w"><div id="c"><i class="f f1"></i><i class="f f2"></i><i class="e"></i><div class="rays"></div><div class="halo"></div><img class="logo" src="../logo.svg"></div></div>
<script>
const p=new URLSearchParams(location.search),W=+p.get('w'),H=+p.get('h');
// اللوحة 1920×1080 تُكبَّر لتملأ الشاشة كما في اللعبة (أصغر النسبتين)، والمسرح يمتد حولها
const s=Math.min(W/1920,H/1080),uw=W/s,uh=H/s,w=document.getElementById('w'),c=document.getElementById('c');
w.style.width=uw+'px';w.style.height=uh+'px';w.style.transform=`scale(${s})`;
c.style.left=(uw-1920)/2+'px';c.style.top=(uh-1080)/2+'px';
</script></body></html>
