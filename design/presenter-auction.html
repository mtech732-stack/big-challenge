<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحدي الكبير · ش4 · المزاد · نافذة المقدّم</title>
<link rel="icon" href="data:,">
<!-- الصفحة المرجعية لنافذة المقدّم في المزاد (design/auction.md 5). الأنماط الأساسية منسوخة من index.html المبني كما هي،
     ويضاف إليها قسم المزاد وحده (آخر هذه الأنماط). الحالة من الرابط: ?s=bid · وبلا ?s قائمة الحالات. -->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>
  /* نافذة المقدّم بالرموز نفسها. كل المقاسات بوحدة rem، و1rem = 32 على شاشة عرضها 1920،
     فأصغر نص 32 على أساس 1920×1080 كما في design/system.md (القسم 9). والقياسات من design/letter.md (القسم 4) وdesign/shared.md (القسم 6). */
  html { font-size: calc(100vw / 60); }
  body { font-size: 1rem; line-height: 1.5; }
  p, h1, h2, ol { margin: 0; }
  button { min-height: 2rem; padding: 0 1.25rem; background: var(--ink); color: var(--card); white-space: nowrap; }
  button.big { min-height: 2.5rem; padding: 0 2rem; }
  button.alt { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 3px var(--ink); }
  button.on-stage { background: var(--card); color: var(--ink); }
  button.on-stage.alt { background: transparent; color: var(--card); box-shadow: inset 0 0 0 3px var(--card); }

  main { max-width: 52rem; margin: 0 auto; padding: 0.75rem 0; display: grid; gap: 0.75rem; }

  /* الرأس: اسم اللعبة، وشارة الجولة ومسار أسئلتها، والصوت والرصيد */
  .top { display: flex; align-items: center; gap: 0.75rem; min-height: 2rem; }
  .top h1 { font-size: 1.25rem; font-weight: 900; margin-inline-end: auto; white-space: nowrap; }

  /* لوحة: بطاقة بيضاء مستقيمة بظل صلب */
  .panel { background: var(--card); color: var(--ink); padding: 0.75rem 1.5rem; box-shadow: 0.375rem 0.375rem 0 var(--stage-3); display: grid; gap: 0.75rem; }
  .panel h2 { font-size: 1.25rem; font-weight: 800; line-height: 1.2; }
  .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .grow { margin-inline-start: auto; }
  .alert { color: var(--team-1); font-weight: 700; }
  .mark { display: inline-block; width: 0.75rem; height: 0.75rem; transform: skewX(calc(-1 * var(--lean))); vertical-align: middle; }
  .mark.t1 { background: var(--team-1); }
  .mark.t2 { background: var(--team-2-ink); }
  .tn.t1 { color: var(--team-1); }
  .tn.t2 { color: var(--team-2-ink); }

  /* الشاشة: الحالة، والتنبيه في سطرين حتى تتصل نافذة الجمهور */
  .status { font-weight: 700; display: flex; align-items: center; gap: 0.375rem; }
  .status::before { content: ""; width: 0.5rem; height: 0.5rem; background: var(--team-1); }
  .status[data-on="true"]::before { background: #1F9D55; }
  .notice { border-inline-start: 0.25rem solid var(--ink); padding-inline-start: 0.75rem; }
  .notice p { white-space: nowrap; }

  /* تعديل الرصيد: يُفتح من الرأس في أي وقت */
  .scores { position: fixed; z-index: 7; top: 50%; left: 50%; translate: -50% -50%; width: 36rem; box-shadow: 0.375rem 0.375rem 0 var(--stage-3), 0 0 0 100vmax rgba(5,14,46,.6); }
  .scores .line { display: grid; grid-template-columns: 1fr auto 3rem auto; gap: 0.75rem; align-items: center; }
  .scores .tn { font-weight: 800; }
  .scores .line button { font-size: 1.5rem; }
  .scores .val { font-size: 1.5rem; font-weight: 900; text-align: center; direction: ltr; }

  /* الجولة (design/letter.md، القسم 4): الرأس بشارة الجولة ومسار أسئلتها، والسؤال والإجابة، والدور والحكم */
  .chip { position: relative; min-height: 2rem; padding: 0 1rem; display: flex; align-items: center; font-weight: 700; white-space: nowrap; color: var(--ink); }
  .chip i { position: absolute; inset: 0; background: var(--card); transform: skewX(calc(-1 * var(--lean))); }
  .chip span { position: relative; }
  .pips { display: flex; gap: 0.375rem; margin-inline-end: auto; align-items: center; }
  .pip { width: 1.25rem; height: 1.25rem; transform: skewX(calc(-1 * var(--lean))); box-shadow: inset 0 0 0 3px var(--c); }
  .pip.t1 { --c: var(--team-1); }
  .pip.t2 { --c: var(--team-2); }
  .pip.now { height: 2rem; }
  .pip.won1 { background: var(--team-1); box-shadow: none; }
  .pip.won2 { background: var(--team-2); box-shadow: none; }
  .pip.none { background: var(--stage-3); box-shadow: none; }
  .lost { display: flex; gap: 0.75rem; margin-inline-end: auto; }
  .lost .warn { background: var(--card); color: var(--team-1); box-shadow: inset 0 0 0 3px var(--team-1); display: flex; align-items: center; gap: 0.375rem; }
  .lost .warn::before { content: ""; width: 0.5rem; height: 0.5rem; background: var(--team-1); }
  .top.playing h1 { margin-inline-end: 0; }
  .q { grid-template-columns: auto 1fr; align-items: center; gap: 0.5rem 1.25rem; }
  .q .letter { min-width: 3.5rem; height: 3.5rem; padding: 0 0.5rem; white-space: nowrap; background: var(--ink); color: var(--hl); display: flex; align-items: center; justify-content: center;
    font-size: 2.25rem; font-weight: 800; line-height: 1; }
  .q .prompt { font-size: 1rem; font-weight: 700; line-height: 1.4; }
  .q .meta { font-weight: 700; }
  .answer { grid-column: 1 / -1; border-inline-start: 0.5rem solid var(--ink); padding-inline-start: 1rem; }
  .answer .label { font-weight: 700; }
  .answer .word { font-size: 2rem; font-weight: 900; line-height: 1.2; }
  .who { font-size: 1.25rem; font-weight: 800; line-height: 1.3; display: flex; align-items: center; gap: 0.5rem; padding-inline-start: 0.25rem; }
  .state { font-weight: 700; }
  .judge { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0.75rem; }
  .judge button { min-height: 3rem; font-size: 1.25rem; }
  .judge .no { background: var(--card); color: var(--team-1); box-shadow: inset 0 0 0 3px var(--team-1); }
  .done { font-size: 1.25rem; font-weight: 800; }
  button.held { opacity: .45; cursor: default; pointer-events: none; }
  .sum { display: grid; grid-template-columns: 1fr auto auto; gap: 0.25rem 1.5rem; align-items: center; padding-inline-start: 0.25rem; }
  .sum .tn { font-weight: 800; }
  .sum .pts { font-size: 1.5rem; font-weight: 900; direction: ltr; text-align: end; }

  /*  (design/system.md 9.1): ثلاثة صفوف تملأ الارتفاع: الرأس · السؤال والإجابة (يأخذ ما بقي، ومحتواه في وسطه) ·
     الدور والحكم في الأسفل دائماً، بأزرار 5rem في الموضع نفسه لكل سؤال. و12 عموداً بفاصل 0.75rem لصف ما بعد الحكم */
  #app { min-height: 100vh; box-sizing: border-box; grid-template-rows: auto 1fr auto; align-content: stretch; }
  #app > .panel.q { align-content: center; }
  #app .q .prompt { font-size: 1.25rem; }
  #app .answer .word { font-size: 2.5rem; }
  #app .judge button, #app #after .big { min-height: 5rem; font-size: 1.5rem; }
  #app #after { display: grid; grid-template-columns: repeat(12, 1fr); gap: 0.75rem; }
  #app #after .done { grid-column: span 6; }
  #app #after .big { grid-column: span 6; margin: 0; }
  #app .q .letter { min-width: 5rem; height: 5rem; font-size: 3.25rem; }


  /* ===== المزاد (design/auction.md 5، 4.0): الموضوع والعدّ، والبحث، والقائمة المرجعية الكبيرة تُمرَّر، والمزايدة ===== */
  /* 4.0: النافذة بارتفاع الشاشة لا أكثر، فلوحة الموضوع تأخذ ما بقي والقائمة وحدها تُمرَّر داخلها (40–200 عنصراً) */
  #app.fit { height: 100vh; }
  #app.fit > .auc { min-height: 0; }
  .auc { grid-template-columns: 1fr auto; grid-template-rows: auto auto auto minmax(0, 1fr); align-content: stretch; gap: 0.5rem 1.25rem; }
  .auc .head { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
  .auc .topic { font-size: 1.25rem; font-weight: 800; line-height: 1.3; min-width: 0; }
  /* علامة الموضوع المفتوح (4.0): القائمة عون لا حصر، فلا سقف للمزايدة بطولها ولا إغلاق آلي. شارة مائلة بإطار الحبر */
  .auc .open { position: relative; flex: none; min-height: 1.5rem; padding: 0 0.75rem; display: flex; align-items: center; font-weight: 700; white-space: nowrap; color: var(--ink); }
  .auc .open i { position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--ink); transform: skewX(calc(-1 * var(--lean))); }
  .auc .open span { position: relative; }
  .auc .tally { display: flex; align-items: baseline; gap: 0.5rem; font-weight: 800; white-space: nowrap; }
  .auc .tally b { font-size: 2.5rem; font-weight: 900; line-height: 1; direction: ltr; }
  .auc .tally.t1 b { color: var(--team-1); }
  .auc .tally.t2 b { color: var(--team-2-ink); }
  /* في المزايدة: طول القائمة المرجعية للمقدّم وحده، مكان العدّ */
  .auc .size { font-weight: 700; white-space: nowrap; }
  /* البحث (4.0): حقل بعرض ثمانية أعمدة من 12 يرشّح القائمة أثناء الكتابة، وبجانبه «من خارج القائمة · +1» (أربعة) في الوفاء وحده */
  .find { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 0.75rem; }
  .find input { grid-column: span 8; min-width: 0; height: 2.5rem; box-sizing: border-box; padding: 0 1rem; border: 0; border-radius: 0; background: var(--card); color: var(--ink);
    box-shadow: inset 0 0 0 3px var(--ink); font: inherit; font-size: 1rem; font-weight: 700; }
  .find input::placeholder { color: var(--ink); opacity: .6; font-weight: 400; }
  .find input:focus { outline: none; box-shadow: inset 0 0 0 5px var(--ink); }
  .find.wide input { grid-column: 1 / -1; }
  /* زر الإجابة من خارج القائمة: +1 لصاحب الدور، فبإطار لونه ونصه */
  .find .out { grid-column: span 4; min-height: 2.5rem; margin: 0; padding: 0 0.75rem; background: var(--card); color: var(--c); box-shadow: inset 0 0 0 3px var(--c); }
  .find .out.t1 { --c: var(--team-1); }
  .find .out.t2 { --c: var(--team-2-ink); }
  /* ما احتُسب من خارج القائمة: سطر تحت البحث، بنصه إن كُتب، وكلٌّ بلون من قاله. ولا يظهر السطر قبل أولها */
  .outs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem 0.75rem; font-weight: 700; }
  .outs .it { position: relative; min-height: 1.5rem; padding: 0 0.625rem; display: flex; align-items: center; color: var(--card); white-space: nowrap; }
  .outs .it i { position: absolute; inset: 0; transform: skewX(calc(-1 * var(--lean))); }
  .outs .it span { position: relative; }
  .outs .it.t1 i { background: var(--team-1); }
  .outs .it.t2 i { background: var(--team-2-ink); }
  /* القائمة المرجعية: تُمرَّر رأسياً داخل لوحتها. كل عنصر زر بعرض عمودين من 12 (ستة في الصف) بارتفاع 2rem، الاسم ثم صيغه */
  .ref { grid-column: 1 / -1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; align-content: start;
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-flow: dense; gap: 0.375rem 0.75rem; padding: 0.125rem; }
  .ref button { min-width: 0; overflow: hidden; min-height: 2rem; padding: 0 0.5rem; background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 3px var(--ink);
    display: flex; align-items: center; justify-content: center; gap: 0.25rem; font-size: 1rem; line-height: 1.1; white-space: nowrap; text-align: center; }
  .ref button small { font-size: 1rem; font-weight: 400; }
  .ref button.wide { grid-column: span 2; }
  .ref button.wider { grid-column: span 3; }
  .ref button[hidden] { display: none; }
  /* ما ذُكر: ممتلئ بلون من ذكره، ولا يُنقر ثانية */
  .ref button.t1, .ref button.t2 { color: var(--card); box-shadow: none; pointer-events: none; }
  .ref button.t1 { background: var(--team-1); }
  .ref button.t2 { background: var(--team-2-ink); }
  /* المطابقة الأولى أثناء البحث: يحتسبها Enter، فتُبرَز بالأصفر (والأسهم تنقل الإبراز) */
  .ref button.hit { background: var(--hl); box-shadow: inset 0 0 0 3px var(--ink); }
  /* لا مطابقة: سطر واحد مكان القائمة، وEnter أو الزر يحتسبها من خارج القائمة بنصها */
  .ref .none { grid-column: 1 / -1; padding: 0.25rem 0; font-weight: 700; }
  /* في المزايدة وبعد الحكم: القائمة للاطلاع والبحث، لا تُنقر */
  .ref.view button { pointer-events: none; }
  /* أزرار المزايدة: زر كل فريق بلونه (5 أعمدة) يُظهر رقمه، و«ابدأ» بينهما (عمودان). والعدّ: «توقّف · لم يفِ» */
  #app .bidrow { display: grid; grid-template-columns: repeat(12, 1fr); gap: 0.75rem; }
  #app .bidrow button { min-height: 5rem; font-size: 1.5rem; margin: 0; }
  #app .bidrow .bidt { grid-column: span 5; color: var(--card); font-size: 2.5rem; font-weight: 900; box-shadow: none; }
  #app .bidrow .bidt.t1 { background: var(--team-1); }
  #app .bidrow .bidt.t2 { background: var(--team-2-ink); }
  #app .bidrow .go2 { grid-column: span 2; }
  #app .bidrow .no { grid-column: span 3; background: var(--card); color: var(--team-1); box-shadow: inset 0 0 0 3px var(--team-1); }
  #app .bidrow .half { grid-column: span 6; }
  .menu { padding: 1rem; line-height: 1.8; }
  .menu a { color: var(--hl); }
</style>
</head>
<body>
<main id="app" class="fit">
  <header class="top playing">
    <h1>التحدي الكبير</h1>
    <span class="chip"><i></i><span>المزاد · الموضوع <span class="ltr">2</span> من <span class="ltr">3</span></span></span>
    <span class="pips" id="pips"></span>
    <button class="on-stage alt">الصوت</button>
    <button class="on-stage alt">الرصيد</button>
  </header>
  <section class="panel auc" id="mid">
    <div class="head"><p class="topic" id="topic"></p><p class="open" id="open" hidden><i></i><span>مفتوح</span></p></div>
    <p class="tally" id="tally"><b id="tn"></b><span>من <span class="ltr" id="tof"></span></span></p>
    <p class="size" id="size"></p>
    <div class="find" id="find"><input id="q" type="search" enterkeyhint="done" autocomplete="off" spellcheck="false" placeholder="ابحث، أو اكتب ما قيل" aria-label="بحث في القائمة"><button class="out" id="out">من خارج القائمة · <span class="ltr">+1</span></button></div>
    <div class="outs" id="outs"></div>
    <div class="ref" id="ref"></div>
  </section>
  <section class="panel" id="low">
    <div class="row"><p class="who" id="who"></p><p class="state grow" id="state"></p><button class="alt">تراجع</button><button class="alt">مباراة جديدة</button></div>
    <div class="bidrow" id="ctl"></div>
  </section>
</main>
<script>
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const num = s => esc(s).replace(/(\+?\d+(?::\d+)?)/g, '<span class="ltr">$1</span>');
  const LONG = q.has('long');
  const NAMES = LONG ? { 1: 'فريق النخبة الذهبي', 2: 'نجوم المستقبل معاً' } : { 1: 'الصقور', 2: 'النجوم' };
  const tn = t => `<span class="mark t${t}"></span> <b class="tn t${t}">${esc(NAMES[t])}</b>`;
  // القائمة المرجعية بصيغها البديلة (content-format 4.3: items[].name و alts). 4.0: موضوع مفتوح، والقائمة 40–200 عون لا حصر
  const CARS = [['تويوتا'], ['نيسان'], ['هوندا'], ['لكزس'], ['مازدا'], ['ميتسوبيشي', 'متسوبيشي'], ['سوزوكي'], ['سوبارو'], ['إنفينيتي', 'انفنتي'], ['هيونداي', 'هونداي'],
    ['كيا'], ['جينيسيس', 'جنسس'], ['مرسيدس', 'بنز'], ['بي إم دبليو', 'بي ام'], ['أودي'], ['فولكس فاجن'], ['بورشه'], ['أوبل'], ['فورد'], ['شيفروليه', 'شفر'],
    ['جي إم سي', 'جمس'], ['كاديلاك'], ['دودج'], ['جيب'], ['كرايسلر'], ['لينكولن'], ['تسلا'], ['فيراري'], ['لامبورغيني', 'لمبرجيني'], ['مازيراتي'],
    ['ألفا روميو'], ['فيات'], ['رولز رويس'], ['بنتلي'], ['جاكوار', 'جاغوار'], ['لاند روفر', 'رنج روفر'], ['ميني'], ['أستون مارتن'], ['ماكلارين'], ['بيجو'],
    ['رينو'], ['سيتروين'], ['فولفو'], ['سكودا'], ['سيات'], ['بوغاتي'], ['شانجان'], ['جيلي'], ['إم جي'], ['هافال'], ['شيري'], ['بي واي دي']];
  // أطول قائمة: دول العالم (195)، بأطول أسمائها
  const WORLD = ('السعودية الكويت الإمارات قطر البحرين عُمان اليمن العراق سوريا الأردن لبنان فلسطين مصر السودان ليبيا تونس الجزائر المغرب موريتانيا الصومال جيبوتي '
    + 'جزر_القمر تركيا إيران باكستان أفغانستان الهند بنغلاديش سريلانكا نيبال بوتان المالديف الصين اليابان كوريا_الجنوبية كوريا_الشمالية منغوليا تايوان '
    + 'إندونيسيا ماليزيا سنغافورة بروناي الفلبين تايلاند فيتنام لاوس كمبوديا ميانمار تيمور_الشرقية كازاخستان أوزبكستان تركمانستان قيرغيزستان طاجيكستان '
    + 'أذربيجان أرمينيا جورجيا روسيا أوكرانيا بيلاروسيا مولدوفا رومانيا بلغاريا اليونان ألبانيا مقدونيا_الشمالية صربيا الجبل_الأسود البوسنة_والهرسك كرواتيا '
    + 'سلوفينيا المجر سلوفاكيا التشيك بولندا ليتوانيا لاتفيا إستونيا فنلندا السويد النرويج الدنمارك آيسلندا أيرلندا بريطانيا هولندا بلجيكا لوكسمبورغ '
    + 'فرنسا ألمانيا سويسرا النمسا ليختنشتاين إيطاليا مالطا سان_مارينو الفاتيكان موناكو أندورا إسبانيا البرتغال قبرص كندا الولايات_المتحدة المكسيك '
    + 'غواتيمالا بليز هندوراس السلفادور نيكاراغوا كوستاريكا بنما كوبا جامايكا هايتي الدومينيكان جزر_البهاما باربادوس ترينيداد_وتوباغو غرينادا '
    + 'سانت_لوسيا دومينيكا أنتيغوا_وباربودا سانت_كيتس_ونيفيس سانت_فنسنت_والغرينادين كولومبيا فنزويلا غيانا سورينام الإكوادور بيرو البرازيل بوليفيا '
    + 'باراغواي تشيلي الأرجنتين الأوروغواي أستراليا نيوزيلندا بابوا_غينيا_الجديدة فيجي جزر_سليمان فانواتو ساموا تونغا كيريباتي توفالو ناورو بالاو '
    + 'ميكرونيزيا جزر_مارشال إثيوبيا إريتريا كينيا أوغندا تنزانيا رواندا بوروندي نيجيريا غانا السنغال مالي النيجر تشاد الكاميرون الغابون الكونغو '
    + 'الكونغو_الديمقراطية أنغولا زامبيا زيمبابوي موزمبيق ملاوي مدغشقر موريشيوس سيشل ناميبيا بوتسوانا جنوب_أفريقيا ليسوتو إسواتيني غينيا غينيا_بيساو '
    + 'غينيا_الاستوائية سيراليون ليبيريا ساحل_العاج بوركينا_فاسو توغو بنين غامبيا الرأس_الأخضر جنوب_السودان أفريقيا_الوسطى ساو_تومي_وبرينسيب')
    .split(' ').map(x => [x.replace(/_/g, ' ')]);
  const B = (label, cls = '') => `<button class="${cls}">${num(label)}</button>`;
  const run = i => [1, i];
  const STATES = {
    // المزايدة (الوثيقة 5.5): زر كل فريق بلونه يُظهر رقمه، و«ابدأ» بينهما. والقائمة للاطلاع، ويبحث فيها المقدّم
    bid:      { t: 'المزايدة: الأول 17 والثاني 23', turn: 0, bids: [17, 23], done: 'المزايدة · الأعلى 23', ctl: [B('17', 'bidt t1'), B('ابدأ', 'alt go2'), B('23', 'bidt t2')] },
    bidfind:  { t: 'المزايدة: يبحث المقدّم «فو»', turn: 0, bids: [17, 23], find: 'فو', done: 'المزايدة · الأعلى 23', ctl: [B('17', 'bidt t1'), B('ابدأ', 'alt go2'), B('23', 'bidt t2')] },
    // الوفاء: الحقل جاهز للكتابة، وكل عنصر زر يُنقر
    run:      { t: 'الوفاء: ذُكر 7 من 23، والحقل فارغ', turn: 1, of: 23, said: [0, 1, 2, 3, 12, 13, 18].map(run), who: 1, state: '0:41 · بقي 16', ctl: [B('توقّف · لم يفِ', 'no half')] },
    find:     { t: 'الوفاء: كُتب «هون» فطابق اثنين، والأول مُبرَز', turn: 1, of: 23, said: [0, 1, 2, 3, 12, 13, 18].map(run), find: 'هون', who: 1, state: '0:34 · بقي 16', ctl: [B('توقّف · لم يفِ', 'no half')] },
    nofind:   { t: 'الوفاء: كُتب «ليفان» ولا مطابقة', turn: 1, of: 23, said: [0, 1, 2, 3, 12, 13, 18].map(run), find: 'ليفان', who: 1, state: '0:27 · بقي 16', ctl: [B('توقّف · لم يفِ', 'no half')] },
    out:      { t: 'الوفاء: احتُسب اثنان من خارج القائمة', turn: 1, of: 23, said: [0, 1, 2, 3, 12, 13, 18].map(run), outs: [[1, 'ليفان'], [1, 'جاك'], [1, '']], who: 1, state: '0:20 · بقي 13', ctl: [B('توقّف · لم يفِ', 'no half')] },
    decided:  { t: 'بعد الحكم: لم يفِ الأول', turn: 0, of: 23, said: [0, 1, 2, 3, 12, 13, 18, 5, 9].map(run), outs: [[1, 'ليفان']], done: 'لم يفِ · ذُكر 10 من 23', ctl: [B('الموضوع التالي · 3 من 3', 'half')] },
    long:     { t: 'أطول قائمة (195) أثناء العدّ، والقائمة تُمرَّر', turn: 1, of: 40, said: [...Array(21).keys()].map(i => [1, i * 3]), list: WORLD, who: 1, state: '0:45 · بقي 19', ctl: [B('توقّف · لم يفِ', 'no half')] },
  };
  // المطابقة (4.0): بلا تشكيل ولا همزات ولا «ال» في أول الكلمة، وبالتاء المربوطة هاءً والألف المقصورة ياءً، في الاسم وصيغه
  const norm = s => s.normalize('NFKD').replace(/[ً-ٰٟـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/(^|\s)ال/g, '$1').trim();
  const id = q.get('s'), st = STATES[id];
  if (!st) {
    document.body.innerHTML = '<div class="menu"><h1>ش4 · المزاد · نافذة المقدّم</h1>' + Object.entries(STATES).map(([k, s]) =>
      `<p>${esc(s.t)}: <a href="?s=${k}">مثال</a> · <a href="?s=${k}&long=1">أطول اسمين</a></p>`).join('') + '</div>';
  } else {
    const list = st.list ?? CARS;
    const fulfil = !!st.who;
    $('topic').textContent = st.list === WORLD ? 'دول العالم' : 'ماركات السيارات';
    $('open').hidden = false;
    $('pips').innerHTML = [1, 2, 1].map((t, i) => `<span class="pip t${t}${i === 1 ? ' now' : ''}${i === 0 ? ' won1' : ''}"></span>`).join('');
    const outs = st.outs ?? [];
    const total = (st.said?.length ?? 0) + outs.length;
    $('tally').hidden = !st.said;
    if (st.said) { $('tn').textContent = total; $('tof').textContent = st.of; $('tally').className = `tally t${st.who ?? 1}`; }
    $('size').hidden = !st.bids; $('size').innerHTML = `في المرجع <span class="ltr">${list.length}</span>`;
    // البحث: في المزايدة وبعد الحكم للاطلاع (الحقل بعرضه)، وفي الوفاء مع زر «من خارج القائمة» بلون صاحب الدور
    $('find').classList.toggle('wide', !fulfil);
    $('out').hidden = !fulfil; $('out').className = `out t${st.who ?? 1}`;
    $('q').value = st.find ?? '';
    // ما احتُسب من خارج القائمة: بنصه، أو «بلا نص» إن لم يُكتب
    $('outs').hidden = !outs.length;
    $('outs').innerHTML = outs.length ? 'من خارج القائمة: ' + outs.map(([t, x]) => `<span class="it t${t}"><i></i><span>${x ? esc(x) : 'بلا نص'}</span></span>`).join('') : '';
    const by = new Map((st.said ?? []).map(([t, i]) => [i, t]));
    $('ref').className = 'ref' + (fulfil ? '' : ' view');
    const f = norm(st.find ?? '');
    const match = ([n, ...alts]) => !f || [n, ...alts].some(x => norm(x).includes(f));
    let hit = -1;
    $('ref').innerHTML = list.map((it, i) => {
      const [n, ...alts] = it, show = match(it), said = by.has(i);
      if (f && show && !said && hit < 0 && fulfil) hit = i;
      return `<button${show ? '' : ' hidden'} class="${said ? 't' + by.get(i) : ''}${hit === i ? ' hit' : ''}">${esc(n)}${alts.length && st.bids === undefined ? ` <small>· ${esc(alts.join(' · '))}</small>` : ''}</button>`;
    }).join('') + (f && !list.some(match) ? `<p class="none">${num(fulfil ? `لا يطابق شيئاً في القائمة · Enter أو «من خارج القائمة» يحتسبه بنصه` : 'لا يطابق شيئاً في القائمة')}</p>` : '');
    $('who').innerHTML = st.who ? `دور ${tn(st.who)}` : `<span class="done">${num(st.done)}</span>`;
    $('state').innerHTML = st.who ? num(st.state) : '';
    $('ctl').innerHTML = st.ctl.join('');
    // العنصر الذي لا يتسع اسمه (بصيغه) في خانة يأخذ خانتين، فإن لم يتسع فثلاثاً. والفراغات تُملأ بما بعده (dense)
    document.fonts.ready.then(() => {
      for (const b of $('ref').querySelectorAll('button:not([hidden])')) for (const cls of ['wide', 'wider']) if (b.scrollWidth > b.clientWidth + 1) { b.classList.remove('wide'); b.classList.add(cls); }
      // في الوفاء الحقل جاهز للكتابة دائماً (لوحة المفاتيح)، وفي «أطول قائمة» تُرى القائمة ممرَّرة إلى منتصفها
      if (fulfil) $('q').focus();
      if (id === 'long') $('ref').scrollTop = $('ref').scrollHeight / 6;
      window.__ready = true;
    });
  }
</script>
</body>
</html>
