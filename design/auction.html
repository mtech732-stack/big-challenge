<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحدي الكبير · ش4 · المزاد · شاشة الجمهور</title>
<link rel="icon" href="data:,">
<!-- الصفحة المرجعية لتصميم المزاد (design/auction.md) فوق CSS اللعبة المبنية بالإصدار 1.3، فما يُرى هنا هو ما سيُبنى.
     الحالة من الرابط: ?s=bid&w=1&long=1 (s: الحالة · w=1 النافذة الواحدة · long=1 أطول اسمين ورقمان من ثلاث خانات · check=1 فحص التداخل).
     وبلا ?s: قائمة الحالات. -->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/stage.css">
<link rel="stylesheet" href="../css/start.css">
<link rel="stylesheet" href="../css/letter.css">
<link rel="stylesheet" href="../css/shared.css">
<link rel="stylesheet" href="auction.css">
<style>
  /* §15.2 (ش4): حدّ دور الأول 1170 (كان 1140). هنا حتى ينقله المهندس إلى css/stage.css */
  .turn-1 .stagebg .f, .turn-1 .stagebg .e { translate: 0 584px; }
  .menu { position: fixed; inset: 0; z-index: 20; overflow: auto; background: #050E2E; color: #fff; padding: 32px 48px; font-size: 20px; line-height: 1.6; }
  .menu h1 { font-size: 32px; margin: 0 0 16px; }
  .menu a { color: #FFC300; }
  .menu table { border-collapse: collapse; }
  .menu td { padding: 4px 16px 4px 0; vertical-align: top; }
  .check-layer { inset: 0; pointer-events: none; z-index: 10; position: absolute; }
  .check-out { position: fixed; z-index: 21; bottom: 0; left: 0; right: 0; background: #050E2E; color: #fff; font-size: 16px; padding: 8px 16px; white-space: pre-wrap; direction: rtl; }
</style>
</head>
<body>
<div class="screen">
  <div class="canvas" id="canvas">
    <div class="stagebg" id="stagebg"><div class="f f1"></div><div class="f f2"></div><div class="e" id="edge"></div>
      <div class="beam"></div><div class="beam w"></div><div class="beam"></div><div class="beam w"></div></div>
    <div class="particles" id="particles"></div>
    <!-- الشعار كما في audience.html (ش8): الصورة، وأيقونتها في النافذة الواحدة -->
    <div class="logo" data-hud="الشعار" aria-label="التحدي الكبير"><img class="full" src="logo/logo.svg" width="323" height="328" alt=""><img class="icon" src="logo/icon.svg" width="62" height="64" alt=""></div>

    <section class="team t1" id="p1" data-hud="لوحة الفريق الأول">
      <div class="shape"></div><svg class="ring" preserveAspectRatio="none"><polygon pathLength="100"/></svg>
      <div class="row" data-fit="لوحة الفريق الأول"><span class="name" id="n1"></span><span class="score" id="s1"></span><span class="cnt" id="c1"></span></div>
    </section>

    <div class="badge mode" data-hud="شارة النمط"><i></i><span>المزاد</span></div>
    <div class="badge plain" id="b1" data-hud="الشارة الأولى"><i></i><span></span></div>

    <div class="card-wrap" id="cardWrap" data-hud="البطاقة">
      <div class="plate"></div>
      <div class="card">
        <!-- المزاد: الموضوع والعدّ، ثم المزايدة أو ما ذُكر (design/auction.md 2) -->
        <div class="scr auc" data-s="auc" id="auc">
          <div class="ahead">
            <p class="topic" id="topic" data-fit="الموضوع"></p>
            <p class="tally" id="tally" data-fit="العدّ"><b class="n" id="tn"></b><span class="of">من <b class="ltr" id="tof"></b></span></p>
            <div class="ctl" id="aucCtl"></div>
          </div>
          <div class="bids" id="bids"></div>
          <div class="items" id="items"></div>
        </div>
        <div class="scr intro" data-s="intro">
          <p class="rule" id="rule"></p>
          <div class="crow"><p class="head" id="starter" data-fit="سطر البدء"></p><div class="ctl" id="introCtl"></div></div>
        </div>
        <div class="scr end" data-s="end">
          <div class="cols">
            <div class="col"><p class="who t1" data-fit="اسم الفريق الأول"><i></i><span id="e1"></span></p><p class="pts tn t1" id="r1"></p></div>
            <div class="col"><p class="who t2" data-fit="اسم الفريق الثاني"><i></i><span id="e2"></span></p><p class="pts tn t2" id="r2"></p></div>
          </div>
          <div class="crow"><div class="ctl" id="endCtl"></div></div>
        </div>
      </div>
    </div>

    <section class="team t2" id="p2" data-hud="لوحة الفريق الثاني">
      <div class="shape"></div><svg class="ring" preserveAspectRatio="none"><polygon pathLength="100"/></svg>
      <div class="row" data-fit="لوحة الفريق الثاني"><span class="name" id="n2"></span><span class="score" id="s2"></span><span class="cnt" id="c2"></span></div>
    </section>

    <div class="box" id="box" data-hud="مربع الإعلان" hidden><i></i>
      <p class="chip" id="verdict"><i></i><span id="vtext"></span></p>
      <p class="line" id="line" data-fit="سطر الإعلان"></p>
    </div>

    <div class="ctl-near" id="near" data-hud="أزرار المزاد"></div>
    <div class="ctl-corner a" id="cornerA" data-hud="أزرار الزاوية العليا"></div>
    <div class="ctl-corner b" id="cornerB" data-hud="أزرار الزاوية السفلى"></div>
    <div class="ctl-corner c" id="cornerC" data-hud="أزرار الصف الثالث"></div>
    <div class="shine" id="shine"></div>
    <div class="danger"></div>
  </div>
</div>
<script src="check.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const canvas = $('canvas');
  const fit = () => document.documentElement.style.setProperty('--scale', Math.min(innerWidth / 1920, innerHeight / 1080));
  addEventListener('resize', fit); fit();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const num = s => esc(s).replace(/(\+?\d+)/g, '<span class="ltr">$1</span>');

  // ===== المحتوى المثال، وأطول محتوى =====
  const LONG = q.has('long');
  const NAMES = LONG ? { 1: 'فريق النخبة الذهبي', 2: 'نجوم المستقبل معاً' } : { 1: 'الصقور', 2: 'النجوم' };
  const SCORES = LONG ? { 1: 188, 2: 176 } : { 1: 14, 2: 9 };
  // الموضوع: سطر واحد (حد 32 حرفاً، design/auction.md 3). الأطول المختبَر 32 حرفاً بجوار العدّ «40 من 40»
  const TOPIC = 'أشياء تجدها في حقيبة طالب المدرسة';
  // التصوّر المفتوح (4.0، ملاحظات المالك 30 أكتوبر، البند 5): موضوع مرح يُعدّ منه بسهولة، والمزايدة الواقعية 15–40.
  // والقائمة المرجعية (40–200) عون للمقدّم لا حصر، فلا يرى الجمهور منها إلا ما قيل، ولا عددها أبداً.
  const CARS = ['تويوتا', 'نيسان', 'هوندا', 'لكزس', 'مازدا', 'ميتسوبيشي', 'سوزوكي', 'سوبارو', 'إنفينيتي', 'هيونداي', 'كيا', 'جينيسيس', 'مرسيدس',
    'بي إم دبليو', 'أودي', 'فولكس فاجن', 'بورشه', 'أوبل', 'فورد', 'شيفروليه', 'جي إم سي', 'كاديلاك', 'دودج', 'جيب', 'كرايسلر', 'لينكولن',
    'تسلا', 'فيراري', 'لامبورغيني', 'مازيراتي', 'ألفا روميو', 'فيات', 'رولز رويس', 'بنتلي', 'جاكوار', 'لاند روفر', 'ميني', 'أستون مارتن',
    'ماكلارين', 'بيجو', 'رينو', 'سيتروين', 'فولفو', 'سكودا', 'سيات', 'بوغاتي', 'شانجان', 'جيلي', 'إم جي', 'هافال', 'شيري', 'بي واي دي'];
  const SHORT = ['تويوتا', 'نيسان'];

  // ===== الحالات (design/auction.md 2) =====
  // turn: صاحب الدور (الحدّ يكتسح له) · run: العدّاد يعمل (ثوانٍ) · bids: [فريق، رقم] · said: [فريق، عنصر] · box: مربع الإعلان
  const STATES = {
    intro:    { t: 'افتتاح الجولة', screen: 'intro', turn: 0, badge: 'الجولة 3 من 4' },
    // المزايدة (الوثيقة 5.5): bids رقما الفريقين [الأول، الثاني]، والحدّ في المنتصف حتى «ابدأ»
    // 4.0: لا «في القائمة N» أبداً. ورقمان من خانتين كما في المزايدة الواقعية (15–40)
    open:     { t: 'المزايدة: ظهور الموضوع، ولا رقم بعد', turn: 0, bids: [0, 0] },
    bid:      { t: 'المزايدة: الأول 17 والثاني 23', turn: 0, bids: [17, 23] },
    bidlong:  { t: 'المزايدة: رقمان كبيران (40 و36)', turn: 0, bids: [40, 36] },
    // run: الثواني الباقية، وtotal: وقت الوفاء كله (الوثيقة 1.12: 45 ثانية ثابتة. والعدّاد يتسع لثلاث خانات، جُرّب بـ 125 في 4.0)
    run:      { t: 'الوفاء: العدّاد يعمل، ذُكر 7 من 23', turn: 1, of: 23, run: 38, total: 45, said: CARS.slice(0, 7).map(x => [1, x]) },
    runfull:  { t: 'الوفاء: أطول ما ذُكر (يسقط أقدمه)، وأول الوقت 45', turn: 1, of: 40, run: 45, total: 45, said: CARS.slice(0, 34).map(x => [1, x]) },
    // بعد الحكم (4.0): ما قيل وحده، لا القائمة (قد تبلغ 200). وما قيل من خارج القائمة يظهر كغيره
    won:      { t: 'بعد الحكم: وفى الأول (23)', turn: 1, of: 23, said: CARS.slice(0, 21).concat(['شيري', 'ليفان']).map(x => [1, x]), verdict: { team: 1, points: 23 }, reveal: true },
    failed:   { t: 'بعد الحكم: لم يفِ الأول، فللثاني نقطتان', turn: 2, of: 23, said: CARS.slice(0, 16).map(x => [1, x]), verdict: { team: 2, points: 2 }, reveal: true },
    wonlong:  { t: 'بعد الحكم: وفى الأول بـ 40 (لا يتسع كله)', turn: 1, of: 40, said: CARS.slice(0, 40).map(x => [1, x]), verdict: { team: 1, points: 40 }, reveal: true },
    wonshort: { t: 'بعد الحكم: وفى الأول بقليل (2)', turn: 1, of: 2, said: SHORT.map(x => [1, x]), verdict: { team: 1, points: 2 }, reveal: true },
    fail2short:{ t: 'بعد الحكم: لم يفِ الثاني بقليل (2 من 15)', turn: 1, of: 15, said: SHORT.map(x => [2, x]), verdict: { team: 1, points: 2 }, reveal: true },
    end:      { t: 'نهاية الجولة', screen: 'end', turn: 0, badge: 'انتهت الجولة 3', totals: { 1: 12, 2: 9 } },
  };

  // أزرار النافذة الواحدة (design/auction.md 4): بجانب ما تتحكم فيه، في صف الشارات. والزاويتان كما في 1.3
  const SINGLE = q.get('w') === '1';
  const B = (label, kind = '') => `<button class="cbtn${kind ? ' ' + kind : ''}">${num(label)}</button>`;
  function single(id, st) {
    if (!SINGLE) return;
    $('cornerA').innerHTML = `<div class="ctl">${B('تراجع', 'alt')}${B('الصوت', 'alt')}</div>`;
    $('cornerB').innerHTML = `<div class="ctl">${B('المقدّم', 'alt')}${B('ملء الشاشة', 'alt')}</div>`;
    $('cornerC').innerHTML = `<div class="ctl">${B('الرصيد', 'alt')}${B('مباراة جديدة', 'alt')}</div>`;
    canvas.classList.add('has-a');
    // المزايدة (الوثيقة 5.5): زر كل فريق بلونه يُظهر رقمه (أول نقرة: رقم الخصم + 1، ثم +1)، و«ابدأ» بينهما يرسي على الأعلى ويبدأ الوفاء
    const tb = (t, n) => B(n ? String(n) : 'زايد', 'bidt t' + t);
    const bidRow = st.bids && [tb(1, st.bids[0]), B('ابدأ', st.bids[0] || st.bids[1] ? '' : 'off'), tb(2, st.bids[1])];
    const near = {
      open: bidRow, bid: bidRow, bidlong: bidRow,
      run: [B('صحيح · +1'), B('توقّف', 'no')],
      runfull: [B('صحيح · +1'), B('توقّف', 'no')],
    }[id] ?? [];
    $('near').innerHTML = near.join('');
    // بعد الحكم: «الموضوع التالي» في البطاقة بجوار الموضوع، لا في صف الشارات (design/auction.md 4: يبقى المسرح للحقل)
    $('aucCtl').innerHTML = st.reveal ? B(id === 'wonlong' ? 'إنهاء الجولة' : 'الموضوع التالي') : '';
    if (id === 'intro') $('introCtl').innerHTML = B('اعرض الموضوع 1');
    if (id === 'end') $('endCtl').innerHTML = B('إلى عجلة البونص');
  }

  function render(id) {
    const st = STATES[id];
    $('n1').textContent = NAMES[1]; $('n2').textContent = NAMES[2];
    for (const k of [1, 2]) { $('s' + k).textContent = SCORES[k]; $('s' + k).classList.toggle('three', String(SCORES[k]).length >= 3); }
    document.querySelectorAll('.card .scr').forEach(s => s.classList.toggle('show', s.dataset.s === (st.screen ?? 'auc')));
    $('b1').querySelector('span').innerHTML = num(st.badge ?? 'الموضوع 2 من 3');
    canvas.classList.toggle('turn-1', st.turn === 1); canvas.classList.toggle('turn-2', st.turn === 2);
    $('p1').classList.toggle('on', st.turn === 1); $('p2').classList.toggle('on', st.turn === 2);
    canvas.classList.toggle('running', !!st.run);
    if (st.run) { $('c1').textContent = $('c2').textContent = st.run; }
    if (st.screen === 'intro') {
      $('rule').textContent = 'زايدوا على ما تقدرون على ذكره، ثم أوفوا';
      $('starter').textContent = 'ثلاثة مواضيع';
    }
    if (st.screen === 'end') {
      $('e1').textContent = NAMES[1]; $('e2').textContent = NAMES[2];
      $('r1').textContent = '+' + st.totals[1]; $('r2').textContent = '+' + st.totals[2];
      box({ next: 'التالي: عجلة البونص' });
    }
    if (!st.screen) {
      $('topic').textContent = LONG ? TOPIC : 'ماركات السيارات';
      // المزايدة: رقما الفريقين وحدهما، كلٌّ بلونه، والأعلى أكبرهما. ومن لم يزايد بعد لا شارة له
      const [b1, b2] = st.bids ?? [0, 0];
      $('bids').innerHTML = [[1, b1], [2, b2]].filter(([, n]) => n).map(([t, n]) => `<span class="bid t${t}${n === Math.max(b1, b2) ? ' top' : ''}"><i></i><span>${n}</span></span>`).join('');
      // العدّ والعناصر
      const said = st.said;
      $('tally').hidden = !said;
      if (said) {
        $('tn').textContent = said.length; $('tof').textContent = st.of;
        const last = said.length ? said[said.length - 1][0] : st.turn;
        $('tally').className = `tally t${last}`;
      }
      const auc = $('auc'); auc.classList.toggle('reveal', !!st.reveal);
      // النافذة الواحدة: لا قائمة مع المقدّم (في هاتفه بالباركود)، فيعدّ بـ «صحيح · +1» دون أسماء، فلا عناصر قبل الحكم ولا بعده.
      // وبعد الحكم (4.0) يبقى ما قيل وحده، لا القائمة: أوله، وفي آخره «و N غيرها» إن لم يتسع
      const named = SINGLE ? [] : (said ?? []);
      $('items').innerHTML = named.map(([t, x]) => `<span class="it t${t}"><i></i><span>${esc(x)}</span></span>`).join('');
      // بعد الحكم: ما قيل بشارات المزايدة الكبيرة إن اتسع كله في صفين، وإلا فبالحجم المعتاد (1.5)
      if (st.reveal) { auc.classList.add('big'); if (!fitsAll($('items'))) auc.classList.remove('big'); }
      fitItems($('items'), !!st.reveal);
      if (st.verdict) box({ verdict: st.verdict, line: `ذُكر ${said.length} من ${st.of}` });
    }
    single(id, st);
    placeBadges(); placeNear(); fitRings();
  }

  // (overflow: clip لا يُحسب في scrollWidth، فالقياس بحدود العناصر)
  const rect = el => el.getBoundingClientRect();
  // ما ذُكر: أثناء العدّ يبقى الأحدث (يسقط الأقدم). وبعد الحكم يبقى أوله، وفي آخره «و N غيرها» (4.0: ما قيل وحده)
  const fitsAll = box => !box.lastElementChild || rect(box.lastElementChild).bottom <= rect(box).bottom + 1;
  function fitItems(box, reveal) {
    const all = [...box.children];
    const fits = () => !box.lastElementChild || rect(box.lastElementChild).bottom <= rect(box).bottom + 1;
    if (fits()) return;
    if (!reveal) { while (!fits() && box.firstElementChild) box.firstElementChild.remove(); return; }
    const more = document.createElement('span'); more.className = 'it more'; box.append(more);
    let hidden = 0;
    // يُحذف من غير المذكور أولاً (من آخره)، كي يبقى كل ما ذُكر
    while (!fits() && all.length) {
      all.pop().remove(); hidden++;
      more.innerHTML = `<span>و <span class="ltr">${hidden}</span> غيرها</span>`;
    }
  }
  function box({ verdict, line, next }) {
    $('box').hidden = false;
    $('verdict').hidden = !verdict;
    if (verdict) {
      $('verdict').className = `chip${verdict.team ? ' t' + verdict.team : ''}`;
      $('vtext').innerHTML = verdict.team ? `${esc(NAMES[verdict.team])} · ${num('+' + verdict.points)}` : 'لا نقاط';
    }
    $('line').innerHTML = num(line ?? next);
    // حكم المزاد بلا مربع (1.5): الشارة والسطر على الطرف، كـ «نهاية الجولة» في ش3 (§15.4). فالقائمة القصيرة لا ترفع الأبيض فوق 35
    $('box').classList.toggle('bare', !!next || !!verdict);
    const p2 = $('p2'), w = Math.min(659, 1794 - (p2.offsetLeft + p2.offsetWidth + 17 + 24 + 17));
    $('box').style.left = (1794 - w) + 'px'; $('box').style.width = w + 'px';
    $('box').classList.toggle('wrap', $('line').scrollWidth > $('box').clientWidth - 96);
  }
  function placeBadges() {
    const lean = Math.tan(14 * Math.PI / 180) * 64; let right = 104;
    for (const el of [document.querySelector('.badge.mode'), $('b1')]) { el.style.right = right + 'px'; right += el.offsetWidth + 24 + lean; }
  }
  function placeNear() {
    const near = $('near'); if (!near.children.length) return;
    // بحدود الشارة الفعلية لا offsetLeft (يُقرَّب، فيصير الفراغ 23 بكسر الميل)
    // والقياس بمقاس 1920 ولو صُغّرت الشاشة (1366): حدود الشارة مقسومة على المقياس، وإلا ضاق الفراغ إلى 6 (4.0)
    const cr = canvas.getBoundingClientRect(), k = cr.width / 1920;
    near.style.left = Math.floor(Math.min(...[...document.querySelectorAll('.badge')].map(b => (b.getBoundingClientRect().left - cr.left) / k)) - 32 - near.offsetWidth) + 'px';
  }
  function fitRings() {
    for (const team of [$('p1'), $('p2')]) {
      const svg = team.querySelector('.ring'), w = team.offsetWidth, h = team.offsetHeight, o = Math.tan(14 * Math.PI / 180) * h / 2;
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      svg.querySelector('polygon').setAttribute('points', `${o},0 ${w + o},0 ${w - o},${h} ${-o},${h}`);
      // إطار الوقت متآكل بقدر ما مضى (للصورة الثابتة)
      const st = STATES[q.get('s')];
      svg.querySelector('polygon').style.strokeDashoffset = st?.run ? 100 * (1 - st.run / (st.total ?? 60)) : 0;
    }
  }

  // ===== الصفحة =====
  (function particles() {
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 22; i++) {
      const s = document.createElement('span');
      s.style.left = Math.round(rnd() * 1900) + 'px'; s.style.top = Math.round(500 + rnd() * 600) + 'px';
      s.style.animationDuration = (14 + rnd() * 10).toFixed(1) + 's'; s.style.animationDelay = (-rnd() * 20).toFixed(1) + 's';
      const k = 6 + Math.round(rnd() * 8); s.style.width = s.style.height = k + 'px';
      $('particles').appendChild(s);
    }
  })();

  const id = q.get('s');
  if (!STATES[id]) {
    const m = document.createElement('div'); m.className = 'menu';
    m.innerHTML = '<h1>ش4 · المزاد · شاشة الجمهور</h1><table>' + Object.entries(STATES).map(([k, s]) =>
      `<tr><td>${esc(s.t)}</td><td><a href="?s=${k}">نافذتان</a></td><td><a href="?s=${k}&w=1">نافذة واحدة</a></td><td><a href="?s=${k}&long=1">أطول محتوى</a></td><td><a href="?s=${k}&w=1&long=1&check=1">الأطول بنافذة واحدة مع الفحص</a></td></tr>`).join('') +
      '</table><p>التفصيل في design/auction.md. ونافذة المقدّم حُذفت بالوثيقة 1.13.</p>';
    document.body.append(m);
  } else {
    // الخطان (العربي والأرقام اللاتينية) قبل القياس: خط الأرقام لا يُحمَّل إلا عند أول رقم، فتتحرك الشارات بعده
    Promise.all(['700 32px Kufi', '900 104px Kufi'].map(f => document.fonts.load(f, 'المزاد 0123456789+'))).then(() => document.fonts.ready).then(() => {
      render(id);
      // بعد تحميل الخط يُعاد القياس (عرض الخط البديل غير عرضه)
      requestAnimationFrame(() => {
        render(id);
        window.__ready = true;
        if (q.has('check')) {
          const layer = document.createElement('div'); layer.className = 'check-layer'; canvas.append(layer);
          const r = layoutCheck({ canvas, layer, grid: true });
          window.__check = r;
          const out = document.createElement('div'); out.className = 'check-out';
          out.textContent = (r.ok ? 'سليم' : 'مشكلات: ' + r.problems.join(' · ')) + ` · أدنى فراغ ${Math.round(r.minGap)}`;
          document.body.append(out);
        }
      });
    });
  }
</script>
</body>
</html>
