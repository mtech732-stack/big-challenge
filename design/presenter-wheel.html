<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحدي الكبير · ش6 · شريط البونص · نافذة المقدّم</title>
<link rel="icon" href="data:,">
<!-- الصفحة المرجعية لنافذة المقدّم في شريط البونص (design/wheel.md 5). الأنماط الأساسية منسوخة من index.html المبني كما هي،
     ويضاف إليها قسم العجلة وحده (آخر هذه الأنماط). الحالة من الرابط: ?s=run · وبلا ?s قائمة الحالات. -->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<style>
  /* نافذة المقدّم بالرموز نفسها. كل المقاسات بوحدة rem، و1rem = 32 على شاشة عرضها 1920،
     فأصغر نص 32 على أساس 1920×1080 كما في design/system.md (القسم 9). والقياسات من design/letter.md (القسم 4) وdesign/shared.md (القسم 6). */
  html { font-size: calc(100vw / 60); }
  body { font-size: 1rem; line-height: 1.5; }
  p, h1, h2, ol { margin: 0; }
  button { min-height: 2rem; padding: 0 1.25rem; background: var(--ink); color: var(--card); white-space: nowrap; }
  button.big { min-height: 2.5rem; padding: 0 2rem; }
  button.alt { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 3px var(--ink); }
  button.on-stage { background: var(--card); color: var(--ink); }
  button.on-stage.alt { background: transparent; color: var(--card); box-shadow: inset 0 0 0 3px var(--card); }

  main { max-width: 52rem; margin: 0 auto; padding: 0.75rem 0; display: grid; gap: 0.75rem; }

  /* الرأس: اسم اللعبة، وشارة الجولة ومسار أسئلتها، والصوت والرصيد */
  .top { display: flex; align-items: center; gap: 0.75rem; min-height: 2rem; }
  .top h1 { font-size: 1.25rem; font-weight: 900; margin-inline-end: auto; white-space: nowrap; }

  /* لوحة: بطاقة بيضاء مستقيمة بظل صلب */
  .panel { background: var(--card); color: var(--ink); padding: 0.75rem 1.5rem; box-shadow: 0.375rem 0.375rem 0 var(--stage-3); display: grid; gap: 0.75rem; }
  .panel h2 { font-size: 1.25rem; font-weight: 800; line-height: 1.2; }
  .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .grow { margin-inline-start: auto; }
  .alert { color: var(--team-1); font-weight: 700; }
  .mark { display: inline-block; width: 0.75rem; height: 0.75rem; transform: skewX(calc(-1 * var(--lean))); vertical-align: middle; }
  .mark.t1 { background: var(--team-1); }
  .mark.t2 { background: var(--team-2-ink); }
  .tn.t1 { color: var(--team-1); }
  .tn.t2 { color: var(--team-2-ink); }

  /* الشاشة: الحالة، والتنبيه في سطرين حتى تتصل نافذة الجمهور */
  .status { font-weight: 700; display: flex; align-items: center; gap: 0.375rem; }
  .status::before { content: ""; width: 0.5rem; height: 0.5rem; background: var(--team-1); }
  .status[data-on="true"]::before { background: #1F9D55; }
  .notice { border-inline-start: 0.25rem solid var(--ink); padding-inline-start: 0.75rem; }
  .notice p { white-space: nowrap; }

  /* تعديل الرصيد: يُفتح من الرأس في أي وقت */
  .scores { position: fixed; z-index: 7; top: 50%; left: 50%; translate: -50% -50%; width: 36rem; box-shadow: 0.375rem 0.375rem 0 var(--stage-3), 0 0 0 100vmax rgba(5,14,46,.6); }
  .scores .line { display: grid; grid-template-columns: 1fr auto 3rem auto; gap: 0.75rem; align-items: center; }
  .scores .tn { font-weight: 800; }
  .scores .line button { font-size: 1.5rem; }
  .scores .val { font-size: 1.5rem; font-weight: 900; text-align: center; direction: ltr; }

  /* الجولة (design/letter.md، القسم 4): الرأس بشارة الجولة ومسار أسئلتها، والسؤال والإجابة، والدور والحكم */
  .chip { position: relative; min-height: 2rem; padding: 0 1rem; display: flex; align-items: center; font-weight: 700; white-space: nowrap; color: var(--ink); }
  .chip i { position: absolute; inset: 0; background: var(--card); transform: skewX(calc(-1 * var(--lean))); }
  .chip span { position: relative; }
  .pips { display: flex; gap: 0.375rem; margin-inline-end: auto; align-items: center; }
  .pip { width: 1.25rem; height: 1.25rem; transform: skewX(calc(-1 * var(--lean))); box-shadow: inset 0 0 0 3px var(--c); }
  .pip.t1 { --c: var(--team-1); }
  .pip.t2 { --c: var(--team-2); }
  .pip.now { height: 2rem; }
  .pip.won1 { background: var(--team-1); box-shadow: none; }
  .pip.won2 { background: var(--team-2); box-shadow: none; }
  .pip.none { background: var(--stage-3); box-shadow: none; }
  .lost { display: flex; gap: 0.75rem; margin-inline-end: auto; }
  .lost .warn { background: var(--card); color: var(--team-1); box-shadow: inset 0 0 0 3px var(--team-1); display: flex; align-items: center; gap: 0.375rem; }
  .lost .warn::before { content: ""; width: 0.5rem; height: 0.5rem; background: var(--team-1); }
  .top.playing h1 { margin-inline-end: 0; }
  .q { grid-template-columns: auto 1fr; align-items: center; gap: 0.5rem 1.25rem; }
  .q .letter { min-width: 3.5rem; height: 3.5rem; padding: 0 0.5rem; white-space: nowrap; background: var(--ink); color: var(--hl); display: flex; align-items: center; justify-content: center;
    font-size: 2.25rem; font-weight: 800; line-height: 1; }
  .q .prompt { font-size: 1rem; font-weight: 700; line-height: 1.4; }
  .q .meta { font-weight: 700; }
  .answer { grid-column: 1 / -1; border-inline-start: 0.5rem solid var(--ink); padding-inline-start: 1rem; }
  .answer .label { font-weight: 700; }
  .answer .word { font-size: 2rem; font-weight: 900; line-height: 1.2; }
  .who { font-size: 1.25rem; font-weight: 800; line-height: 1.3; display: flex; align-items: center; gap: 0.5rem; padding-inline-start: 0.25rem; }
  .state { font-weight: 700; }
  .judge { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0.75rem; }
  .judge button { min-height: 3rem; font-size: 1.25rem; }
  .judge .no { background: var(--card); color: var(--team-1); box-shadow: inset 0 0 0 3px var(--team-1); }
  .done { font-size: 1.25rem; font-weight: 800; }
  button.held { opacity: .45; cursor: default; pointer-events: none; }
  .sum { display: grid; grid-template-columns: 1fr auto auto; gap: 0.25rem 1.5rem; align-items: center; padding-inline-start: 0.25rem; }
  .sum .tn { font-weight: 800; }
  .sum .pts { font-size: 1.5rem; font-weight: 900; direction: ltr; text-align: end; }

  /*  (design/system.md 9.1): ثلاثة صفوف تملأ الارتفاع: الرأس · السؤال والإجابة (يأخذ ما بقي، ومحتواه في وسطه) ·
     الدور والحكم في الأسفل دائماً، بأزرار 5rem في الموضع نفسه لكل سؤال. و12 عموداً بفاصل 0.75rem لصف ما بعد الحكم */
  #app { min-height: 100vh; box-sizing: border-box; grid-template-rows: auto 1fr auto; align-content: stretch; }
  #app > .panel.q { align-content: center; }
  #app .q .prompt { font-size: 1.25rem; }
  #app .answer .word { font-size: 2.5rem; }
  #app .judge button, #app #after .big { min-height: 5rem; font-size: 1.5rem; }
  #app #after { display: grid; grid-template-columns: repeat(12, 1fr); gap: 0.75rem; }
  #app #after .done { grid-column: span 6; }
  #app #after .big { grid-column: span 6; margin: 0; }
  #app .q .letter { min-width: 5rem; height: 5rem; font-size: 3.25rem; }


  /* ===== شريط البونص (design/wheel.md 5): الخانات العشر بنصوصها الكاملة، ثم الخانة التي وقفت عليها، والحكم ===== */
  .whl { grid-template-columns: 1fr; align-content: center; gap: 0.5rem; }
  .whl h2 { font-size: 1.25rem; }
  /* الخانات كما على التلفاز، من اليمين: عموداً 1–5 ثم 6–10. كل خانة صف: نوعها في شارة مائلة، ثم نصها الكامل */
  .slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(5, auto); grid-auto-flow: column; gap: 0.375rem 0.75rem; }
  .slots p { min-height: 2.5rem; padding: 0.125rem 0.5rem; display: flex; align-items: center; gap: 0.5rem; box-shadow: inset 0 0 0 3px var(--ink); font-weight: 700; line-height: 1.2; }
  .slots p.luck { box-shadow: none; border: 3px dashed var(--ink); }
  .slots p b { flex: none; min-width: 5.5rem; font-weight: 900; }
  /* النص سطر واحد يُختصر بـ «…» إن طال، فتتسع الخانات العشر بأطول التحديات (85 حرفاً) دون تمرير. ونصه كاملاً بعد الوقوف */
  .slots p span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* المؤشر: الخانة المضاءة بلون من يدير العجلة، كما على التلفاز */
  .slots p.t1, .slots p.t2 { color: var(--card); box-shadow: none; border: 0; }
  .slots p.t1 { background: var(--team-1); }
  .slots p.t2 { background: var(--team-2-ink); }
  /* بعد الوقوف: الخانة في مربعها بلون من أدارها، والنص بمقاس السؤال في نافذة المقدّم */
  .whl.got { grid-template-columns: auto 1fr; align-items: center; gap: 0.5rem 1.25rem; }
  .whl .slotbox { width: 5rem; height: 5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--card); line-height: 1; }
  .whl .slotbox.t1 { background: var(--team-1); }
  .whl .slotbox.t2 { background: var(--team-2-ink); }
  .whl .slotbox > span { font-size: 1rem; font-weight: 800; }
  .whl .slotbox > b { font-size: 1.75rem; font-weight: 900; direction: ltr; }
  .whl .text { font-size: 1.25rem; font-weight: 700; line-height: 1.4; }
  .whl .rule { grid-column: 1 / -1; font-weight: 700; border-inline-start: 0.5rem solid var(--ink); padding-inline-start: 1rem; }
  /* الوقت في الرأس طوال التحدي، فلا يقرأ المقدّم من التلفاز */
  .clock { display: flex; align-items: baseline; gap: 0.375rem; font-weight: 800; white-space: nowrap; }
  .clock b { font-size: 1.5rem; font-weight: 900; line-height: 1; direction: ltr; }
  #app .ctlrow { display: grid; grid-template-columns: repeat(12, 1fr); gap: 0.75rem; }
  #app .ctlrow button { min-height: 5rem; font-size: 1.5rem; margin: 0; grid-column: span 6; }
  #app .ctlrow .full { grid-column: span 12; }
  #app .ctlrow .no { background: var(--card); color: var(--team-1); box-shadow: inset 0 0 0 3px var(--team-1); }
  .menu { padding: 1rem; line-height: 1.8; }
  .menu a { color: var(--hl); }
</style>
</head>
<body>
<main id="app">
  <header class="top playing">
    <h1>التحدي الكبير</h1>
    <span class="chip"><i></i><span>شريط البونص · الدورة <span class="ltr" id="ln">1</span> من <span class="ltr">2</span></span></span>
    <span class="pips" id="pips"></span>
    <p class="clock" id="clock"><span>الوقت</span><b id="cv"></b></p>
    <button class="on-stage alt">الصوت</button>
    <button class="on-stage alt">الرصيد</button>
  </header>
  <section class="panel whl" id="mid"></section>
  <section class="panel" id="low">
    <div class="row"><p class="who" id="who"></p><p class="state grow" id="state"></p><button class="alt">تراجع عن آخر حكم</button><button class="alt">مباراة جديدة</button></div>
    <div class="ctlrow" id="ctl"></div>
  </section>
</main>
<script>
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const num = s => esc(s).replace(/([+−-]?\d+(?:[:–]\d+)?)/g, '<span class="ltr">$1</span>');
  const LONG = q.has('long');
  const NAMES = LONG ? { 1: 'فريق النخبة الذهبي', 2: 'نجوم المستقبل معاً' } : { 1: 'الصقور', 2: 'النجوم' };
  const tn = t => `<span class="mark t${t}"></span> <b class="tn t${t}">${esc(NAMES[t])}</b>`;
  // التحديات وخانات الحظ كما في design/wheel.html (أمثلة للتصميم)، وأطولها 84 حرفاً
  const CH = ['قلّدوا أصوات ثلاثة حيوانات، ويخمّن الخصم أسماءها', 'مثّلوا مهنة بلا كلام حتى يعرفها فريقكم', 'اذكروا عشر فواكه قبل أن ينتهي الوقت',
    'رتّبوا أنفسكم بحسب الطول دون أن تتكلموا', 'ارسموا في الهواء شيئاً يخمّنه فريقكم', 'اذكروا خمسة أشياء زرقاء في القاعة', 'قولوا اسم كل لاعب في فريقكم بالعكس'];
  if (LONG) CH.forEach((_, i) => { CH[i] = 'يمثّل أحدكم فيلماً كرتونياً مشهوراً بلا كلام، ويخمّن فريقه اسمه قبل انتهاء الوقت كله'; });
  const LUCK = { 'lose-3': { w: 'خسارة −3', label: 'خسارة 3 نقاط' }, 'steal-3': { w: 'خصم 3', label: 'خصم 3 نقاط' }, 'gift-3': { w: 'هدية +3', label: 'هدية: +3 نقاط' } };
  const SLOTS = [['c', 0], ['l', 'lose-3'], ['c', 1], ['c', 2], ['l', 'gift-3'], ['c', 3], ['c', 4], ['l', 'steal-3'], ['c', 5], ['c', 6]];
  const B = (label, cls = '') => `<button class="${cls}">${num(label)}</button>`;
  const judge = [B('نجح · +5'), B('لم ينجح', 'no')];
  // by: من يدير العجلة · lit: الخانة المضاءة · got: الخانة التي وقفت عليها (يعرض نصها) · done: سطر الحكم · ctl: أزرار لوحة الدور
  const STATES = {
    ready:   { t: 'قبل الدوران (يديرها الثاني، الأقل نقاطاً)', by: 2, n: 1, state: 'الأقل نقاطاً يبدأ', ctl: [B('أطلق الشريط', 'full')] },
    spin:    { t: 'الدوران', by: 2, n: 1, lit: 6, state: 'يجري المؤشر', ctl: [B('أطلق الشريط', 'full held')] },
    challenge:{ t: 'وقفت على تحدٍّ: قبل «ابدأ»', by: 2, n: 1, got: 3, state: 'لم يبدأ الوقت', ctl: [B('ابدأ التحدي · دقيقتان', 'full')] },
    run:     { t: 'التحدي: الوقت يجري', by: 2, n: 1, got: 3, clock: '1:42', state: 'يؤدّي الفريق التحدي', ctl: judge },
    timeup:  { t: 'التحدي: انتهى الوقت', by: 2, n: 1, got: 3, clock: '0:00', state: 'انتهى الوقت · احكم', ctl: judge },
    won:     { t: 'بعد الحكم: نجح', n: 1, by: 2, got: 3, done: `${NAMES[2]} · +5 · نجح التحدي`, ctl: [B('التالي · دور ' + NAMES[1], 'full')] },
    steal:   { t: 'خانة حظ: خصم 3 (تُطبَّق فور الوقوف)', n: 1, by: 2, got: 7, done: `${NAMES[2]} +3 · ${NAMES[1]} −3`, ctl: [B('التالي · دور ' + NAMES[1], 'full')] },
    last:    { t: 'بعد الدورة 2', n: 2, by: 1, got: 1, done: `${NAMES[1]} · −3 · خسارة 3 نقاط`, ctl: [B('الجولة 3 · المزاد', 'full')] },
  };
  const id = q.get('s'), st = STATES[id];
  if (!st) {
    document.body.innerHTML = '<div class="menu"><h1>ش6 · شريط البونص · نافذة المقدّم</h1>' + Object.entries(STATES).map(([k, s]) =>
      `<p>${esc(s.t)}: <a href="?s=${k}">مثال</a> · <a href="?s=${k}&long=1">أطول محتوى</a></p>`).join('') + '</div>';
  } else {
    $('ln').textContent = st.n;
    $('clock').hidden = !st.clock; $('cv').textContent = st.clock ?? '';
    // مسار الدورتين بلون من يديرهما: الأقل نقاطاً أولاً
    $('pips').innerHTML = [2, 1].map((t, i) => `<span class="pip t${t}${i === st.n - 1 ? ' now' : ''}"></span>`).join('');
    const text = ([k, v]) => k === 'c' ? CH[v] : LUCK[v].label;
    if (st.got === undefined) {
      $('mid').innerHTML = '<h2>الخانات العشر</h2><div class="slots">' + SLOTS.map(([k, v], i) =>
        `<p class="${[k === 'l' && 'luck', i === st.lit && 't' + st.by].filter(Boolean).join(' ')}"><b>${num(k === 'c' ? 'تحدٍّ +5' : LUCK[v].w)}</b><span>${num(text([k, v]))}</span></p>`).join('') + '</div>';
    } else {
      const [k, v] = SLOTS[st.got];
      $('mid').classList.add('got');
      $('mid').innerHTML = `<div class="slotbox t${st.by}"><span>${k === 'c' ? 'تحدٍّ' : LUCK[v].w.split(' ')[0]}</span><b>${num(k === 'c' ? '+5' : LUCK[v].w.split(' ')[1])}</b></div>` +
        `<p class="text">${num(text([k, v]))}</p>` +
        `<p class="rule">${k === 'c' ? 'دقيقتان حداً أقصى · النجاح <span class="ltr">+5</span>، ولا خصم عند الإخفاق' : 'خانة حظ: تُطبَّق فور الوقوف، والرصيد لا ينزل تحت <span class="ltr">0</span>'}</p>`;
    }
    $('who').innerHTML = st.done ? `<span class="done">${num(st.done)}</span>` : `دور ${tn(st.by)}`;
    $('state').innerHTML = st.done ? '' : num(st.state);
    $('ctl').innerHTML = st.ctl.join('');
    document.fonts.ready.then(() => { window.__ready = true; });
  }
</script>
</body>
</html>
