<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحدي الكبير · آخر حرفين · نافذة المقدّم</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="tokens.css">
<style>
  /* الصفحة المرجعية لنافذة المقدّم أثناء جولة «آخر حرفين» (ش3). هي صفحة ش2 (design/presenter-letter.html)
     بحالاتها العشر، وما تغيّر: مربع الحرفين، وسطر القبول، ونصوص الجولة. الوحدة كما في index.html:
     1rem = 32 على شاشة عرضها 1920. ملاحظات القياس في design/last-two.md، القسم 3. */
  [hidden] { display: none !important; }
  html { font-size: calc(100vw / 60); }
  html, body { margin: 0; }
  body { font-family: var(--font); font-size: 1rem; line-height: 1.5; color: var(--on-stage); min-height: 100vh;
    background: linear-gradient(135deg, var(--stage-1) 0%, var(--stage-2) 55%, var(--stage-3) 100%); }
  .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  p, h1, h2, ol { margin: 0; }
  button { font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 0; min-height: 2rem; padding: 0 1.25rem; background: var(--ink); color: var(--card); white-space: nowrap; }
  button.big { min-height: 2.5rem; padding: 0 2rem; }
  button.alt { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 3px var(--ink); }
  button.on-stage { background: var(--card); color: var(--ink); }
  button.on-stage.alt { background: transparent; color: var(--card); box-shadow: inset 0 0 0 3px var(--card); }
  button:disabled { opacity: .45; cursor: default; }

  main { max-width: 52rem; margin: 0 auto; padding: 0.75rem 0 calc(0.75rem + var(--tools, 112px)); display: grid; gap: 0.75rem; }

  /* الرأس: اسم اللعبة، والجولة ونمطها، ومسار أسئلتها الستة، وزر الرصيد */
  .top { display: flex; align-items: center; gap: 0.75rem; min-height: 2rem; }
  .top h1 { font-size: 1.25rem; font-weight: 900; white-space: nowrap; }
  .chip { position: relative; min-height: 2rem; padding: 0 1rem; display: flex; align-items: center; font-weight: 700; white-space: nowrap; color: var(--ink); }
  .chip i { position: absolute; inset: 0; background: var(--card); transform: skewX(calc(-1 * var(--lean))); }
  .chip span { position: relative; }
  .pips { display: flex; gap: 0.375rem; margin-inline-end: auto; align-items: center; }
  .pip { width: 1.25rem; height: 1.25rem; transform: skewX(calc(-1 * var(--lean))); box-shadow: inset 0 0 0 3px var(--c); }
  .pip.t1 { --c: var(--team-1); }
  .pip.t2 { --c: var(--team-2); }
  .pip.now { height: 2rem; }
  .pip.won1 { background: var(--team-1); box-shadow: none; }
  .pip.won2 { background: var(--team-2); box-shadow: none; }
  .pip.none { background: var(--stage-3); box-shadow: none; }

  /* لوحة: بطاقة بيضاء مستقيمة بظل صلب */
  .panel { background: var(--card); color: var(--ink); padding: 0.75rem 1.5rem; box-shadow: 0.375rem 0.375rem 0 var(--stage-3); display: grid; gap: 0.75rem; }
  .panel h2 { font-size: 1.25rem; font-weight: 800; line-height: 1.2; }
  .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .grow { margin-inline-start: auto; }
  .mark { display: inline-block; width: 0.75rem; height: 0.75rem; transform: skewX(calc(-1 * var(--lean))); vertical-align: middle; }
  .mark.t1 { background: var(--team-1); }
  .mark.t2 { background: var(--team-2-ink); }
  .tn.t1 { color: var(--team-1); }
  .tn.t2 { color: var(--team-2-ink); }
  .lost { display: flex; gap: 0.75rem; margin-inline-end: auto; }
  .lost .warn { background: var(--card); color: var(--team-1); box-shadow: inset 0 0 0 3px var(--team-1); display: flex; align-items: center; gap: 0.375rem; }
  .lost .warn::before { content: ""; width: 0.5rem; height: 0.5rem; background: var(--team-1); }

  /* السؤال: كما يراه الجمهور، مصغّراً */
  .q { grid-template-columns: auto 1fr; align-items: center; gap: 0.5rem 1.25rem; }
  /* مربع الحرفين: يتسع بعرضهما (3.5rem حداً أدنى)، والتطويل قبلهما كما على شاشة الجمهور */
  .q .letter { min-width: 3.5rem; height: 3.5rem; padding: 0 0.5rem; white-space: nowrap; background: var(--ink); color: var(--hl); display: flex; align-items: center; justify-content: center;
    font-size: 2.25rem; font-weight: 800; line-height: 1; }
  .q .prompt { font-size: 1rem; font-weight: 700; line-height: 1.4; }
  .q .meta { font-weight: 700; }

  /* الإجابة: للمقدّم وحده. أكبر نص في النافذة لأنها ما يُقرأ في لحظة */
  .answer { grid-column: 1 / -1; border-inline-start: 0.5rem solid var(--ink); padding-inline-start: 1rem; }
  .answer .label { font-weight: 700; }
  .answer .word { font-size: 2rem; font-weight: 900; line-height: 1.2; }

  /* الدور والحكم */
  .who { font-size: 1.25rem; font-weight: 800; line-height: 1.3; display: flex; align-items: center; gap: 0.5rem; padding-inline-start: 0.25rem; }
  .state { font-weight: 700; }
  .judge { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0.75rem; }
  .judge button { min-height: 3rem; font-size: 1.25rem; }
  .judge .no { background: var(--card); color: var(--team-1); box-shadow: inset 0 0 0 3px var(--team-1); }
  .done { font-size: 1.25rem; font-weight: 800; }

  /* نهاية الجولة */
  .sum { display: grid; grid-template-columns: 1fr auto auto; gap: 0.25rem 1.5rem; align-items: center; padding-inline-start: 0.25rem; }
  .sum .tn { font-weight: 800; }
  .sum .pts { font-size: 1.5rem; font-weight: 900; direction: ltr; text-align: end; }

  /* تعديل الرصيد (design/start.md 4.6) */
  .scores { position: fixed; z-index: 4; top: 50%; left: 50%; translate: -50% -50%; width: 36rem; box-shadow: 0.375rem 0.375rem 0 var(--stage-3), 0 0 0 100vmax rgba(5,14,46,.6); }
  .scores .line { display: grid; grid-template-columns: 1fr auto 3rem auto; gap: 0.75rem; align-items: center; }
  .scores .tn { font-weight: 800; }
  .scores .val { font-size: 1.5rem; font-weight: 900; text-align: center; direction: ltr; }

  /* أدوات المعاينة: خارج التصميم، بالبكسل */
  .tools { position: fixed; left: 0; right: 0; bottom: 0; height: var(--tools, 112px); padding: 6px 16px; box-sizing: border-box; display: flex; gap: 6px; align-items: center; align-content: center; flex-wrap: wrap; background: #050E2E; font-size: 16px; line-height: 1.2; z-index: 5; }
  .tools button { font-size: 16px; min-height: 0; padding: 5px 12px; background: #fff; color: var(--ink); font-weight: 400; }
  .tools button[aria-pressed="true"] { background: var(--hl); }
  .tools output { margin-inline-start: auto; font-size: 16px; }
  .tools output.bad { color: #ff6b81; font-weight: 700; }
  .clean .tools { display: none; }
  .clean main { padding-bottom: 0.75rem; }
</style>
</head>
<body>
<main id="main">
  <header class="top">
    <h1>التحدي الكبير</h1>
    <span class="chip"><i></i><span id="roundChip"></span></span>
    <span class="pips" id="pips" aria-label="أسئلة الجولة"></span>
    <!-- إن انقطعت نافذة الجمهور أثناء الجولة: يحلّ هذا محل مسار الأسئلة في الرأس -->
    <span class="lost" id="lost"><button class="warn">افتح نافذة الجمهور</button><button class="on-stage alt">نافذة واحدة</button></span>
    <button class="on-stage alt" id="openScores">الرصيد</button>
  </header>

  <!-- افتتاح الجولة -->
  <section class="panel" data-part="intro">
    <h2 id="introHead"></h2>
    <p id="introWho"></p>
    <p><span class="ltr">6</span> أسئلة، لكل فريق <span class="ltr">3</span> بالتناوب: سهل ثم متوسط ثم صعب. <span class="ltr">20</span> ثانية للسؤال، والسرقة في <span class="ltr">5</span> ثوانٍ.</p>
    <div class="row"><button class="big" id="showQ">اعرض السؤال <span class="ltr">1</span></button></div>
  </section>

  <!-- السؤال، وتحته الإجابة النموذجية (لا تظهر إلا هنا) -->
  <section class="panel q" data-part="q">
    <div class="letter" id="letter"></div>
    <div>
      <p class="prompt" id="prompt"></p>
      <p class="meta" id="meta"></p>
    </div>
    <div class="answer">
      <p class="label">الإجابة النموذجية</p>
      <p class="word" id="answer"></p>
      <p id="alts"></p>
      <p id="rule"></p>
    </div>
  </section>

  <!-- الدور والحكم -->
  <section class="panel" data-part="q">
    <div class="row">
      <p class="who" id="who"></p>
      <p class="state grow" id="state"></p>
      <button class="alt" id="undo">تراجع عن آخر حكم</button>
    </div>
    <div class="judge" id="judge">
      <button class="alt" id="start">ابدأ العدّاد</button>
      <button id="yes"></button>
      <button class="no">خاطئة</button>
    </div>
    <div class="row" id="after">
      <p class="done" id="done"></p>
      <button class="big grow" id="next"></button>
    </div>
  </section>

  <!-- نهاية الجولة -->
  <section class="panel" data-part="end">
    <h2 id="endHead"></h2>
    <div class="sum" id="sum"></div>
    <p>شاشة الجمهور تعرض حصيلة الجولة الآن.</p>
    <div class="row">
      <button class="alt">تراجع عن آخر حكم</button>
      <button class="big grow" id="endNext"></button>
    </div>
  </section>

  <section class="panel scores" id="scores" hidden>
    <h2>تعديل الرصيد</h2>
    <div class="line"><span class="tn t1" id="sn1"></span><button class="alt">−</button><span class="val" id="sv1"></span><button class="alt">+</button></div>
    <div class="line"><span class="tn t2" id="sn2"></span><button class="alt">−</button><span class="val" id="sv2"></span><button class="alt">+</button></div>
    <div class="row"><button class="alt" id="closeScores">تم</button><span>لا ينزل الرصيد تحت الصفر.</span></div>
  </section>
</main>

<nav class="tools" aria-label="أدوات المعاينة">
  <button data-go="intro">افتتاح الجولة</button>
  <button data-go="ready">قبل «ابدأ»</button>
  <button data-go="run">العدّاد يعدّ</button>
  <button data-go="right">صحيحة</button>
  <button data-go="steal">السرقة · خاطئة</button>
  <button data-go="stealT">السرقة · انتهى الوقت</button>
  <button data-go="stealRight">سرقة صحيحة</button>
  <button data-go="stealNone">لا نقاط</button>
  <button data-go="end">نهاية الجولة</button>
  <button data-go="scores">الرصيد</button>
  <button id="turn">صاحب الدور: الأول</button>
  <button id="round">الجولة: الأولى</button>
  <button id="long" aria-pressed="true">أطول محتوى</button>
  <button id="conn" aria-pressed="false">انقطعت نافذة الجمهور</button>
  <button id="all">فحص كل الحالات</button>
  <output id="report"></output>
</nav>

<script>
  const $ = id => document.getElementById(id);
  const num = s => String(s).replace(/(\+?\d+)/g, '<span class="ltr">$1</span>');
  const SETS = {
    normal: { names: ['الصقور', 'النجوم'], s: [12, 9], ending: 'ان', level: 'متوسط · نقطتان', pts: 2, qn: 3,
      q: 'لا يتكلم، لكنه يفضح ما أكلتَه في العيد', answer: 'ميزان', alts: [], round: [6, 3] },
    // أطول محتوى: سؤال 87 حرفاً، وإجابة 19، وبدائل 49 مجتمعة، وأعرض حرفين في الخط «سش».
    long: { names: ['فريق النخبة الذهبي', 'نجوم المستقبل معاً'], s: [188, 176], ending: 'سش', level: 'متوسط · نقطتان', pts: 2, qn: 6,
      q: 'كتاب لا تقرؤه من أوله إلى آخره، بل تفتحه حين تجهل معنى كلمة، وأشهره المحيط للفيروزآبادي',
      answer: 'قاموس المحيط الأنفس', alts: ['قاموس', 'القاموس', 'قاموس المعاني المأنوس', 'معجم مدروس'], round: [12, 12] },
  };
  const GOS = ['intro', 'ready', 'run', 'right', 'steal', 'stealT', 'stealRight', 'stealNone', 'end', 'scores'];
  const st = { go: 'ready', turn: 1, first: true, long: true, conn: true };
  const other = t => t === 1 ? 2 : 1;
  const set = () => SETS[st.long ? 'long' : 'normal'];
  const tn = t => `<b class="tn t${t}">${set().names[t - 1]}</b>`;
  const mk = t => `<i class="mark t${t}"></i>`;

  function render() {
    const d = set(), go = st.go === 'scores' ? 'ready' : st.go, rn = st.first ? 1 : 4;
    const owner = st.turn, thief = other(st.turn);
    const stealing = ['steal', 'stealT', 'stealRight', 'stealNone'].includes(go);
    const decided = ['right', 'stealRight', 'stealNone'].includes(go);
    const part = go === 'intro' ? 'intro' : go === 'end' ? 'end' : 'q';
    document.querySelectorAll('[data-part]').forEach(s => s.hidden = s.dataset.part !== part);
    $('scores').hidden = st.go !== 'scores';

    // الرأس: الجولة، ومسار الأسئلة الستة بلون صاحب كل سؤال (الأول يبدأ في المثال).
    $('roundChip').innerHTML = num(`الجولة ${rn} من 4 · آخر حرفين`);
    const cur = part === 'intro' ? 0 : part === 'end' ? 7 : d.qn;
    const res = ['won1', 'none', 'won2', 'won1', 'won2', 'won1'];
    $('pips').innerHTML = [1, 2, 3, 4, 5, 6].map(i => {
      const t = i % 2 ? owner : thief;
      return `<i class="pip t${t}${i < cur ? ' ' + res[i - 1] : ''}${i === cur ? ' now' : ''}"></i>`;
    }).join('');

    // افتتاح الجولة
    $('introHead').innerHTML = num(`الجولة ${rn} · آخر حرفين`);
    $('introWho').innerHTML = `${mk(owner)} يبدأ ${tn(owner)} (اختير عشوائياً). الافتتاح معروض الآن على الجمهور.`;

    // السؤال والإجابة
    // الحرفان يُخزَّنان دون تطويل (content-format 4.2)، ويُضاف التطويل عند العرض.
    $('letter').textContent = 'ـ' + d.ending;
    $('prompt').textContent = d.q;
    $('meta').innerHTML = num(`${d.level} · السؤال ${d.qn} من 6`);
    $('answer').textContent = d.answer;
    $('alts').hidden = !d.alts.length;
    $('alts').textContent = 'ويُقبل أيضاً: ' + d.alts.join('، ');
    $('rule').textContent = `وتُقبل أي كلمة أخرى تنتهي بـ «ـ${d.ending}» وتنطبق على الوصف.`;

    // الدور والحالة
    const t = stealing ? thief : owner;
    const why = go === 'stealT' ? 'بعد انتهاء الوقت' : 'بعد الخطأ';
    $('who').innerHTML = stealing ? `${mk(thief)} سرقة: ${tn(thief)}` : `${mk(owner)} دور ${tn(owner)}`;
    $('state').innerHTML = {
      ready: 'لم يبدأ العدّاد', run: 'العدّاد يعدّ على الشاشة', right: 'انتهى السؤال',
      steal: `${why} · <span class="ltr">5</span> ثوانٍ`, stealT: `${why} · <span class="ltr">5</span> ثوانٍ`,
      stealRight: 'انتهى السؤال', stealNone: 'انتهى السؤال' }[go] || '';
    $('start').hidden = go !== 'ready';
    $('judge').hidden = decided;
    $('after').hidden = !decided;
    $('lost').hidden = st.conn; $('pips').hidden = !st.conn;
    $('yes').innerHTML = num(`صحيحة · +${d.pts}`);
    const win = go === 'right' ? owner : go === 'stealRight' ? thief : 0;
    $('done').innerHTML = win ? `صحيحة · <span class="ltr">+${d.pts}</span> لـ${tn(win)}` : 'لا نقاط في هذا السؤال.';
    $('next').innerHTML = d.qn === 6 ? 'إنهاء الجولة' : num(`السؤال التالي · ${d.qn + 1} من 6`);
    $('undo').disabled = go === 'ready' && d.qn === 1;

    // نهاية الجولة
    $('endHead').innerHTML = num(`انتهت الجولة ${rn} · آخر حرفين`);
    $('sum').innerHTML = [1, 2].map(k => `<span>${mk(k)} ${tn(k)}</span><span class="pts">+${d.round[k - 1]}</span><span>${num('الرصيد ' + (d.s[k - 1] + d.round[k - 1]))}</span>`).join('');
    $('endNext').innerHTML = st.first ? 'ابدأ الجولة <span class="ltr">2</span>' : 'إلى النتيجة النهائية';

    $('sn1').textContent = d.names[0]; $('sn2').textContent = d.names[1];
    $('sv1').textContent = d.s[0]; $('sv2').textContent = d.s[1];
    document.querySelectorAll('[data-go]').forEach(x => x.setAttribute('aria-pressed', x.dataset.go === st.go));
    $('turn').textContent = `صاحب الدور: ${st.turn === 1 ? 'الأول' : 'الثاني'}`;
    $('round').textContent = `الجولة: ${st.first ? 'الأولى' : 'الرابعة'}`;
  }

  // الفحص كما في presenter-start.html: لا نص أصغر من 1rem، ولا زر أقصر من 2rem، ولا أرقام هندية،
  // ولا نص يفيض، والحالة كلها تتسع للنافذة دون تمرير.
  function check() {
    const rem = parseFloat(getComputedStyle(document.documentElement).fontSize), problems = [];
    const vis = n => n.getClientRects().length && getComputedStyle(n).visibility !== 'hidden';
    for (const n of $('main').querySelectorAll('*')) {
      if (!vis(n)) continue;
      if ([...n.childNodes].some(c => c.nodeType === 3 && c.textContent.trim())) {
        if (parseFloat(getComputedStyle(n).fontSize) < rem - .01) problems.push(`نص أصغر من 32: «${n.textContent.trim().slice(0, 16)}»`);
        if (/[٠-٩۰-۹]/.test(n.textContent)) problems.push('أرقام هندية');
      }
      if (n.tagName === 'BUTTON' && n.getBoundingClientRect().height < 2 * rem - .5) problems.push(`زر أقصر من 64: «${n.textContent.trim()}»`);
      if (n.scrollWidth > n.clientWidth + 1 && getComputedStyle(n).overflow !== 'visible') problems.push(`يفيض: «${n.textContent.trim().slice(0, 16)}»`);
    }
    for (const n of $('main').querySelectorAll('.top, .row, .judge, .sum, .scores .line')) {
      if (!vis(n)) continue;
      const box = n.getBoundingClientRect();
      for (const c of n.querySelectorAll('*')) { if (!vis(c)) continue; const r = c.getBoundingClientRect(); if (r.left < box.left - 1 || r.right > box.right + 1) { problems.push(`يفيض: «${n.textContent.trim().slice(0, 16)}»`); break; } }
    }
    const tools = document.body.classList.contains('clean') ? 0 : 112;
    if ($('main').scrollHeight - tools > innerHeight - tools + 1) problems.push(`الحالة أطول من النافذة: ${Math.round(($('main').scrollHeight - tools) / rem * 32)} من ${Math.round((innerHeight - tools) / rem * 32)}`);
    return { ok: !problems.length, problems: [...new Set(problems)] };
  }

  window.checkAll = function () {
    const saved = { ...st }, fails = []; let n = 0;
    for (const go of GOS) for (const turn of [1, 2]) for (const first of [true, false]) for (const long of [false, true]) for (const conn of [true, false]) {
      Object.assign(st, { go, turn, first, long, conn }); render(); n++;
      const r = check(); if (!r.ok) fails.push(`${go}/${turn}/${first ? 'أولى' : 'لاحقة'}/${long ? 'طويل' : 'عادي'}/${conn ? 'متصلة' : 'منقطعة'}: ${r.problems.join('، ')}`);
    }
    Object.assign(st, saved); render();
    $('report').textContent = fails.length ? `✗ ${fails.length} من ${n}: ${fails[0]}` : `✓ ${n} من ${n} سليمة`;
    $('report').className = fails.length ? 'bad' : '';
    return { total: n, failed: fails.length, fails: fails.slice(0, 12) };
  };

  document.querySelectorAll('[data-go]').forEach(x => x.onclick = () => { st.go = x.dataset.go; render(); });
  $('turn').onclick = () => { st.turn = other(st.turn); render(); };
  $('round').onclick = () => { st.first = !st.first; render(); };
  $('long').onclick = e => { st.long = !st.long; e.target.setAttribute('aria-pressed', st.long); render(); };
  $('conn').onclick = e => { st.conn = !st.conn; e.target.setAttribute('aria-pressed', !st.conn); render(); };
  $('all').onclick = () => checkAll();
  $('openScores').onclick = () => { $('scores').hidden = !$('scores').hidden; };
  $('closeScores').onclick = () => { $('scores').hidden = true; };

  const q = new URLSearchParams(location.search);
  if (q.has('clean')) document.body.classList.add('clean');
  if (GOS.includes(q.get('go'))) st.go = q.get('go');
  if (q.get('turn') === '2') st.turn = 2;
  if (q.has('later')) st.first = false;
  if (q.has('short')) st.long = false;
  document.fonts.ready.then(render);
  render();
</script>
</body>
</html>
