<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحدي الكبير · نافذة الجمهور</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/stage.css">
<link rel="stylesheet" href="css/start.css">
<link rel="stylesheet" href="css/letter.css">
<link rel="stylesheet" href="css/auction.css">
<link rel="stylesheet" href="css/ranking.css">
<link rel="stylesheet" href="css/shared.css">
<style>
  /* اللعبة مغلقة أو بانتظار المقدّم: لا يبقى على الشاشة إلا الخلفية والبطاقة. */
  .locked .team, .locked .badge, .locked .box, .locked .ctl-near, .locked .ctl-corner { display: none; }
  /* أعلى اليسار، حيث لا شيء من الهيكل، ويختفي في ملء الشاشة وفي النافذة الواحدة. */
  #fs { position: fixed; top: 24px; left: 24px; font-size: 32px; }
  :fullscreen #fs, .embed #fs, .filled #fs, .idle #fs { display: none; }
</style>
</head>
<body>
<div class="screen">
  <div class="canvas locked pre" id="canvas">
    <!-- المسرح بطرفين بلوني الفريقين، والحدّ بينهما يكتسح لصاحب الدور (1.3، design/system.md 15.1–15.2) -->
    <div class="stagebg" id="stagebg"><div class="f f1"></div><div class="f f2"></div><div class="e" id="edge"></div>
      <div class="beam"></div><div class="beam w"></div><div class="beam"></div><div class="beam w"></div></div>
    <div class="particles" id="particles"></div>

    <!-- الشعار أعلى اليسار في كل شاشة (15.7) -->
    <div class="logo" data-hud="الشعار" aria-label="التحدي الكبير"><span class="l1">التحدي</span><span class="l2"><i></i><b>الكبير</b></span></div>

    <!-- لوحة الفريق بلا شكل: الاسم ثم الرقم الكبير ثم العدّاد لصاحب الدور، وإطار الوقت حولها (15.3 و15.5) -->
    <section class="team t1" id="p1" data-hud="لوحة الفريق الأول">
      <div class="shape"></div><svg class="ring" preserveAspectRatio="none"><polygon pathLength="100"/></svg>
      <div class="row" data-fit="لوحة الفريق الأول"><span class="name" id="n1">الفريق الأول</span><input class="name-in" id="i1" maxlength="18" autocomplete="off" placeholder="اكتب اسم الفريق الأول" aria-label="اسم الفريق الأول"><span class="score" id="s1"></span><span class="cnt" id="c1"></span></div>
    </section>

    <div class="badge mode" data-hud="شارة النمط"><i></i><span id="mode">اختبار العرض</span></div>
    <div class="badge plain off" id="b1" data-hud="الشارة الأولى"><i></i><span></span></div>
    <div class="badge plain off" id="b2" data-hud="الشارة الثانية"><i></i><span></span></div>
    <!-- الوقت بصيغته الكاملة للمقدّم والاختبار، والجمهور يرى ثوانيه في لوحة صاحب الدور (#c1 و#c2) -->
    <span id="timer" hidden>0:10</span>

    <div class="card-wrap" id="cardWrap" data-hud="البطاقة">
      <div class="plate"></div>
      <div class="card">
        <!-- السؤال، وتحته الإجابة النموذجية بعد الحكم الأخير وحده (الوثيقة 1.1، 7.1) -->
        <div class="scr q show" data-s="q"><div class="letter" id="letter"></div><div class="qcol"><p class="question" id="label" data-fit="السؤال">نافذة الجمهور · بانتظار المقدّم</p></div></div>
        <!-- المزاد (ش4، design/auction.md 2): الموضوع والعدّ، ثم المزايدة أو ما ذُكر. لا القائمة ولا طولها قبل الحكم -->
        <div class="scr auc" data-s="auc" id="auc">
          <div class="ahead">
            <p class="topic" id="topic" data-fit="الموضوع"></p>
            <p class="size" id="tsize" hidden></p>
            <p class="tally" id="tally" data-fit="العدّ" hidden><b class="n" id="tn"></b><span class="of">من <b class="ltr" id="tof"></b></span></p>
            <!-- بعد الحكم: «الموضوع التالي» هنا في النافذة الواحدة، لا في صف الشارات (design/auction.md 4) -->
            <div class="ctl" id="aucCtl"></div>
          </div>
          <div class="bids" id="bids"></div>
          <div class="items" id="items"></div>
        </div>
        <!-- الترتيب (ش5، design/ranking.md 2): العنوان، ثم اللوحة: 1–10 والفخاخ. لا اسم قبل أن يُكشف -->
        <div class="scr rnk" data-s="rnk" id="rnk">
          <div class="rhead">
            <p class="title" id="rtitle" data-fit="عنوان القائمة"></p>
            <p class="sub" id="rsub"></p>
          </div>
          <div class="board" id="board"></div>
        </div>
        <!-- الجولة (ش2): افتتاحها ونهايتها. والسؤال في القسم الأول نفسه -->
        <div class="scr intro" data-s="intro">
          <p class="rule" id="rule"></p>
          <div class="crow"><p class="head" id="starter" data-fit="سطر البدء"></p><div class="ctl"></div></div>
        </div>
        <div class="scr end" data-s="end">
          <div class="cols">
            <div class="col"><p class="who t1" data-fit="اسم الفريق الأول"><i></i><span id="e1"></span></p><p class="pts tn t1" id="r1"></p></div>
            <div class="col"><p class="who t2" data-fit="اسم الفريق الثاني"><i></i><span id="e2"></span></p><p class="pts tn t2" id="r2"></p></div>
          </div>
          <div class="crow"><div class="ctl"></div></div>
        </div>
        <!-- الانتظار، وفي الشاشة المشتركة: عدد الأنماط و«ابدأ القرعة» (design/shared.md 4) -->
        <div class="scr title" data-s="title">
          <p class="sub">المباراة تبدأ بعد قليل</p>
          <div class="crow setup"><p class="guide" id="guide" data-fit="سطر الإرشاد" hidden>اكتب اسمَي الفريقين في لوحتيهما، ثم اختر عدد الأنماط</p><div class="count" id="count"></div><p class="err" id="err" hidden></p><div class="ctl"></div></div>
        </div>
        <div class="scr draw" data-s="spin">
          <p class="ask">من يختار نمط الجولة الأولى؟</p>
        </div>
        <div class="scr draw" data-s="result">
          <p class="sub">الفائز بالقرعة</p>
          <p class="winner" id="winner" data-fit="اسم الفائز"></p>
          <div class="crow"><p class="sub">يختار نمط الجولة الأولى</p><div class="ctl"></div></div>
        </div>
        <div class="scr pick" data-s="pick">
          <div class="crow head-row"><p class="head" id="pickHead" data-fit="سطر الاختيار"></p><div class="ctl"></div></div>
          <div class="tiles" id="tiles"></div>
        </div>
        <div class="scr face" data-s="face">
          <div class="track" id="track"></div>
          <p class="err" id="faceErr" hidden></p>
          <div class="crow"><div class="ctl"></div></div>
        </div>
      </div>
    </div>

    <section class="team t2" id="p2" data-hud="لوحة الفريق الثاني">
      <div class="shape"></div><svg class="ring" preserveAspectRatio="none"><polygon pathLength="100"/></svg>
      <div class="row" data-fit="لوحة الفريق الثاني"><span class="name" id="n2">الفريق الثاني</span><input class="name-in" id="i2" maxlength="18" autocomplete="off" placeholder="اكتب اسم الفريق الثاني" aria-label="اسم الفريق الثاني"><span class="score" id="s2"></span><span class="cnt" id="c2"></span></div>
    </section>

    <!-- مربع الإعلان أسفل اليمين (15.4): الحكم والإجابة بعد الحكم الأخير · الفائز بالقرعة في المواجهة · «التالي» في نهاية الجولة -->
    <div class="box" id="box" data-hud="مربع الإعلان" hidden><i></i>
      <p class="chip" id="verdict" hidden><i></i><span id="vtext"></span></p>
      <p class="chip" id="faceChip" hidden><i></i><span>الفائز بالقرعة</span></p>
      <p class="line" id="reveal" data-fit="سطر الإجابة" hidden>الإجابة: <b id="answer"></b></p>
      <p class="line" id="told" data-fit="سطر ما ذُكر" hidden></p>
      <p class="line" id="say" data-fit="سطر الحكم" hidden></p>
      <p class="line" id="faceWin" data-fit="اسم الفائز" hidden></p>
      <p class="line" id="next" data-fit="سطر التالي" hidden></p>
    </div>

    <!-- أزرار الشاشة المشتركة، بجانب ما تتحكم فيه (design/shared.md 3.2). فارغة في نافذة الجمهور وحدها -->
    <div class="ctl-near" id="near" data-hud="أزرار العدّاد"></div>
    <div class="ctl-corner a" id="cornerA" data-hud="أزرار الزاوية العليا"></div>
    <div class="ctl-corner b" id="cornerB" data-hud="أزرار الزاوية السفلى"></div>
    <div class="ctl-corner c" id="cornerC" data-hud="أزرار الصف الثالث"></div>

    <div class="shine" id="shine"></div>
    <div class="danger"></div>
  </div>
</div>
<button id="fs">ملء الشاشة</button>

<script type="module">
  import './js/offline.js';
  import { createLink } from './js/sync.js';
  import { plan, chooser, picksDone, METHODS, other } from './js/match.js';
  import { PLANNED } from './js/modes/index.js';
  import { play as sound, setMuted } from './js/sound.js';

  const $ = id => document.getElementById(id);
  const canvas = $('canvas');
  const rect = el => el.getBoundingClientRect();
  const query = new URLSearchParams(location.search);
  const embed = query.has('embed');
  if (embed) document.body.classList.add('embed');
  const fit = () => document.documentElement.style.setProperty(
    '--scale', Math.min(innerWidth / 1920, innerHeight / 1080));
  addEventListener('resize', fit);
  fit();

  // الجسيمات: مواضع ثابتة البذرة كما في design/main.html.
  (function particles() {
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 22; i++) {
      const s = document.createElement('span');
      s.style.left = Math.round(rnd() * 1900) + 'px';
      s.style.top = Math.round(500 + rnd() * 600) + 'px';
      s.style.animationDuration = (14 + rnd() * 10).toFixed(1) + 's';
      s.style.animationDelay = (-rnd() * 20).toFixed(1) + 's';
      const k = 6 + Math.round(rnd() * 8); s.style.width = s.style.height = k + 'px';
      $('particles').appendChild(s);
    }
  })();

  const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  // الأرقام معزولة من اليسار، ومعها علامة + إن سبقتها، فلا تنقلب «+2» إلى «2+» (design/letter.md 2.2).
  // و«−2» (خصم الفخ) بعلامته كذلك، و«2024–2025» و«3:42» معزولان كاملين (design/ranking.html).
  const num = s => esc(s).replace(/([+−]?\d+(?:[:–]\d+)?)/g, '<span class="ltr">$1</span>');
  const setLocked = on => canvas.classList.toggle('locked', on);
  const setDanger = on => canvas.classList.toggle('meta-danger', on);
  const showScreen = name => document.querySelectorAll('.card .scr').forEach(s => s.classList.toggle('show', s.dataset.s === name));
  const setTurn = team => { $('p1').classList.toggle('on', team === 1); $('p2').classList.toggle('on', team === 2); };
  const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
  const bump = team => replay($('p' + team), 'won');
  // الرقم الكبير هو النتيجة (1.3، design/system.md 15.5)، ويصغر بثلاث خانات.
  const setScore = (k, v) => { const el = $('s' + k); el.textContent = v; el.classList.toggle('three', String(v).length >= 3); };
  // لحظة واحدة على الرقم الكبير في كل مرة: تُزال الثلاث قبل إضافة إحداها، فلا تغلب «lose» الباقية من لحظة سابقة «gain» بعدها.
  const moment = (team, cls) => { const g = $('s' + team); g.classList.remove('gain', 'lead', 'lose'); replay(g, cls); };

  // ===== المسرح بطرفين (1.3، design/system.md 15.1–15.2 و15.11) =====
  // الحدّ يكتسح لصاحب الدور: وقت العدّاد، ومع مؤشر القرعة، ويقف على الفائز بها. وفي غير ذلك يعود إلى المنتصف.
  let side = 0;
  const setSide = t => {
    if (t === side) return;
    side = t;
    canvas.classList.toggle('turn-1', t === 1); canvas.classList.toggle('turn-2', t === 2);
    if (still()) replay(canvas, 'swap'); else replay($('edge'), 'sweep');
  };
  // الحزم: حركة واحدة متصلة، وسرعتها بالحالة دون قفز: القراءة 1 · العدّاد 2.2 · آخر 3 ثوانٍ 3.5 · لحظة الحكم 6 لنصف ثانية.
  const beams = still() ? [] : [...document.querySelectorAll('.beam')].map((b, i) => {
    const a = b.animate([{ translate: '0 0' }, { translate: '2900px 0' }], { duration: [16000, 22000, 19000, 26000][i], iterations: Infinity });
    a.currentTime = [2000, 9000, 14000, 4000][i];
    return a;
  });
  let pace = 1, surging = 0;
  const speed = r => { if (r === pace) return; pace = r; if (!surging) beams.forEach(a => a.updatePlaybackRate(r)); };
  const surge = () => { clearTimeout(surging); beams.forEach(a => a.updatePlaybackRate(6)); surging = setTimeout(() => { surging = 0; beams.forEach(a => a.updatePlaybackRate(pace)); }, 500); };
  const setRunning = on => { canvas.classList.toggle('running', on); if (!on) speed(1); else if (pace === 1) speed(2.2); };

  // إطار الوقت يُرسم على قياس اللوحة الفعلي بانحرافها 14°، ويُعاد رسمه كلما تغيّر قياسها (الاسم، والرقم، والعدّاد).
  const fitRing = team => {
    const svg = team.querySelector('.ring'), w = team.offsetWidth, h = team.offsetHeight, o = Math.tan(14 * Math.PI / 180) * h / 2;
    if (!w) return;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.querySelector('polygon').setAttribute('points', `${o},0 ${w + o},0 ${w - o},${h} ${-o},${h}`);
  };
  // يُعاد حسابه إن تغيّر عرض لوحة الثاني (الاسم والرقم) أو طول سطر المربع.
  { const ro = new ResizeObserver(() => placeBox()); for (const id of ['p2', 'reveal', 'faceWin', 'next', 'say']) ro.observe($(id)); }
  const sized = new ResizeObserver(list => list.forEach(e => fitRing(e.target)));
  sized.observe($('p1')); sized.observe($('p2'));
  // ويتآكل مع العدّاد: يبدأ مما مضى من الوقت (بعد إعادة التحميل مثلاً)، وينتهي مع آخر ثانية.
  // بحركة من الكود لا بانتقال CSS: الانتقال لا يجري على إطار مخفي (لحظة انتقال الإجابة تخفي المؤشر 240ms)، فكان يقفز إلى آخره.
  let drainAnim = null;
  const drain = (team, left, total) => {
    drainAnim?.cancel(); drainAnim = null;
    if (!team) return;
    const from = 100 * Math.min(1, Math.max(0, 1 - left / total));
    drainAnim = $('p' + team).querySelector('polygon').animate([{ strokeDashoffset: from }, { strokeDashoffset: 100 }], { duration: Math.max(0, left * 1000), fill: 'forwards' });
  };
  // مربع الإعلان (15.4): الحكم والإجابة · الفائز بالقرعة · «التالي». ولا يظهر إن لم يكن فيه شيء.
  // told: سطر المزاد بعد الحكم «ذُكر 10 من 12» مكان الإجابة (القائمة كلها في البطاقة، design/auction.md 2).
  // say: سطر الترتيب في المربع «المركز 7» أو «لم تُكشف خانة» (الاسم في خانته، design/ranking.md 7.6).
  function announce({ verdict: v, answer, told, say, face, next } = {}) {
    $('verdict').hidden = !v;
    if (v) {
      $('verdict').className = `chip${v.team ? ' t' + v.team : ''}`;
      // الفريق الذي أخذ النقاط باسمه (الوثيقة 1.1، 7.1). وخصم الفخ «−2» بما خُصم فعلاً (design/ranking.md 7.7).
      $('vtext').innerHTML = v.team ? `${esc(name(v.team))} · ${num(v.points < 0 ? '−' + -v.points : v.points ? '+' + v.points : '0')}` : 'لا نقاط';
    }
    $('reveal').hidden = !answer; $('answer').textContent = answer ?? '';
    $('told').hidden = !told; $('told').innerHTML = told ? num(told) : '';
    $('say').hidden = !say; $('say').innerHTML = say ? num(say) : '';
    $('faceChip').hidden = $('faceWin').hidden = !face; $('faceWin').textContent = face ? name(face) : '';
    $('next').hidden = !next; $('next').innerHTML = next ? num(next) : '';
    $('box').hidden = !(v || answer || told || say || face || next);
    // «التالي» في نهاية الجولة نص أبيض على الطرف بلا مربع، فلا يتجاوز الأبيض سقفه (15.4 و15.12).
    // وحكم المزاد (سطره told) بلا مربع كذلك، فالقائمة القصيرة لا ترفع الأبيض فوق 35 (design/auction.md 1.5).
    $('box').classList.toggle('bare', (!!next && !v && !answer && !face && !say) || (!!told && !answer && !face));
    placeBox();
  }
  // الملاحظة 27 (15.4): المربع يضيق بقدر ما يبقى بعد لوحة الثاني. حافته اليمنى ثابتة على 1794، وعرضه الأصغر من 659
  // ومن 1794 − (نهاية امتداد اللوحة + 24 + 17)، والامتداد 17 = ارتفاع 136 × ظل 14° ÷ 2. وإن لم يتسع السطر انكسر سطرين وصعدت الشارة لساناً فوقه.
  function placeBox() {
    const box = $('box'), p2 = $('p2');
    if (box.hidden) return;
    const w = Math.min(659, 1794 - (p2.offsetLeft + p2.offsetWidth + 17 + 24 + 17));
    box.style.left = (1794 - w) + 'px'; box.style.width = w + 'px';
    box.classList.remove('wrap');
    const line = [...box.querySelectorAll('.line')].find(l => !l.hidden);
    box.classList.toggle('wrap', !!line && line.scrollWidth > box.clientWidth - 96);
  }

  // صف الشارات من اليمين بفراغ الأمان، محسوباً عند الطرف الأدنى المائل (design/start.html وdesign/letter.html):
  // شارة النمط (في الجولة)، ثم الأولى، ثم الثانية. ولا شارة للحزمة ولا للطريقة ولا للمستوى ولا «سرقة» (design/shared.md 1).
  function setBadges(a, b) {
    for (const [el, t] of [[$('b1'), a], [$('b2'), b]]) { el.classList.toggle('off', !t); el.querySelector('span').innerHTML = t ? num(t) : ''; }
    placeBadges();
  }
  function placeBadges() {
    const lean = Math.tan(14 * Math.PI / 180) * 64;
    let right = 104;
    for (const el of [document.querySelector('.badge.mode'), $('b1'), $('b2')]) {
      if (!el.getClientRects().length) continue;
      el.style.right = right + 'px';
      right += el.offsetWidth + 24 + lean;
    }
    placeNear();
  }
  // أول فتح للشاشة: تُحسب المواضع بعرض الخط البديل إن لم يكن الخط محمّلاً، فيُعاد حسابها بعد تحميله، وإلا تداخلت الشارات.
  document.fonts?.ready.then(placeBadges);
  document.fonts?.addEventListener('loadingdone', placeBadges);

  // ===== عرض حالة المباراة (ما يرسله المقدّم: الحالة، وأسماء الأنماط، وما يُعرض من الجولة) =====
  let view = null, shownPicks = -1, busy = false;
  const name = t => view.match.teams[t] || (t === 1 ? 'الفريق الأول' : 'الفريق الثاني');
  const tn = t => `<b class="tn t${t}">${esc(name(t))}</b>`;

  function render() {
    if (!view || busy) return;
    if (view.match.step === 'play' && view.play) return renderPlay(view.play);
    const { match: m, modes } = view;
    // نمط لم يُبنَ في مواجهة محفوظة من رابط المعاينة: اسمه العربي من قائمة الأنماط الأربعة، لا معرّفه الإنجليزي (ملاحظة المعاين 1).
    const modeName = id => modes.find(x => x.id === id)?.name ?? PLANNED.find(x => x.id === id)?.name ?? id;
    const total = METHODS[m.method].rounds;
    canvas.classList.add('pre');
    canvas.classList.remove('fresh');
    canvas.classList.toggle('short', m.method === 'short');
    $('n1').textContent = name(1); $('n2').textContent = name(2);
    // الرقمان من المواجهة، وقبلها بلا رقم (design/system.md 15.10).
    const showScores = m.step === 'face';
    setScore(1, showScores ? m.scores[1] : ''); setScore(2, showScores ? m.scores[2] : '');
    announce(m.step === 'face' ? { face: m.winner } : {});
    setRunning(false);
    let turn = 0;

    if (m.step === 'setup') {
      showScreen('title');
      setBadges();
    }
    if (m.step === 'draw') {
      setBadges('القرعة');
      if (m.winner) { $('winner').innerHTML = tn(m.winner); showScreen('result'); turn = m.winner; }
      else showScreen('spin');
    }
    if (m.step === 'pick') {
      showScreen('pick');
      const done = picksDone(m);
      if (done) {
        const auto = m.picks.find(p => p.by === 0);
        $('pickHead').innerHTML = auto ? `الجولة <span class="ltr">4</span> للنمط المتبقي: ${esc(modeName(auto.mode))}` : 'اكتمل اختيار الأنماط';
        setBadges('اختيار الأنماط');
      } else {
        turn = chooser(m);
        const k = m.picks.length;
        $('pickHead').innerHTML = `${tn(turn)} يختار نمط الجولة <span class="ltr">${k + 1}</span>`;
        setBadges('اختيار الأنماط', `الجولة ${k + 1} من ${total}`);
      }
      $('tiles').innerHTML = modes.map(mode => {
        const i = m.picks.findIndex(p => p.mode === mode.id), p = m.picks[i];
        const cls = p ? (p.by ? `by${p.by}` : 'auto') : (done ? 'left' : '');
        return `<div class="tile ${cls}" data-fit="خانة النمط" data-mode="${esc(mode.id)}"><i class="fill"></i><span class="mname">${esc(mode.name)}</span>` +
          (p ? `<span class="chip">${num('الجولة ' + (i + 1))}</span>` : '') + '</div>';
      }).join('');
      // اختيار جديد: الخانة تمتلئ بلون الفريق (القسم 6).
      const made = m.picks.filter(p => p.by);
      if (shownPicks >= 0 && m.picks.length > shownPicks && made.length && !still()) {
        const tile = $('tiles').querySelector(`[data-mode="${CSS.escape(made[made.length - 1].mode)}"]`);
        tile?.classList.add('flash');
      }
    }
    shownPicks = m.step === 'pick' ? m.picks.length : -1;
    if (m.step === 'face') {
      showScreen('face');
      setBadges('المواجهة');
      let n = 0;
      $('track').innerHTML = plan(m).map(s => s.kind === 'wheel'
        ? `<div class="seg wheel" style="--i:${n++}" data-fit="خانة العجلة"><span>عجلة</span><span>البونص</span></div>`
        : `<div class="seg ${s.by ? 'by' + s.by : ''}" style="--i:${n++}" data-fit="خانة الجولة"><span class="rn">${num('الجولة ' + s.n)}</span><span class="mname">${esc(modeName(s.mode))}</span></div>`).join('');
      turn = m.winner;
    }
    setTurn(turn);
    // القرعة تقف على الفائز: الحدّ يكتسح إلى طرفه، والخاسر على لسانه.
    setSide(m.step === 'draw' && m.winner ? m.winner : 0);
    renderCtl();
  }

  // مربع الحرف أو الحرفين. في «آخر حرفين» التطويل والحرفان في عنصرين للحركة وحدها، والوصل لا ينقطع (design/last-two.md 2.1).
  // ويُصغَّر الحرفان إن زاد عرضهما على 392 (456 دون الحشوة)، ولا يُصغَّران تحت 128. ولا يُعاد بناؤه إن لم يتغيّر، فلا تُعاد حركته.
  function setBox(a) {
    const el = $('letter'), key = (a.tatweel ? 'ـ' : '') + a.letter;
    el.classList.toggle('ending', !!a.tatweel);
    if (el.dataset.key === key) return;
    el.dataset.key = key;
    if (!a.tatweel) { el.textContent = a.letter; el.style.fontSize = ''; return; }
    // العنصران داخل عنصر واحد: لو كانا ابنين مباشرين للمربع (flex) لصار كل منهما كتلة مستقلة وانقطع الوصل.
    el.innerHTML = `<span class="end"><span class="tw">ـ</span><span class="lt">${esc(a.letter)}</span></span>`;
    fitBox();
    // يُعاد القياس بعد تحميل الخط إن لم يكن محمّلاً (عرض الخط البديل غير عرضه).
    document.fonts?.load(`800 152px "Noto Kufi Arabic"`, a.letter).then(fitBox, () => {});
    if (!still()) replay(el, 'in');
  }
  // يُقاس عرض الحرفين بعنصرهما لا بالمربع: ما يفيض من مربع يتوسط محتواه لا يدخل كله في scrollWidth.
  function fitBox() {
    const el = $('letter'), end = el.querySelector('.end');
    el.style.fontSize = '';
    if (!end) return;
    const inner = 456 - 64, w = end.offsetWidth;
    if (w > inner) el.style.fontSize = Math.max(128, Math.floor(152 * inner / w)) + 'px';
  }

  // ===== الجولة (design/letter.md 2 وdesign/shared.md 4): ما تعيده audience() من وحدة النمط، ولا إجابة فيه قبل الحكم الأخير =====
  function renderPlay(p) {
    const a = p.a, sc = p.scores;
    canvas.classList.remove('pre');
    canvas.classList.toggle('fresh', !!p.fresh);
    $('n1').textContent = name(1); $('n2').textContent = name(2);
    setScore(1, sc[1]); setScore(2, sc[2]);
    $('mode').textContent = p.modeName;

    if (a.screen === 'intro') {
      showScreen('intro');
      $('rule').textContent = a.rule;
      // ولا مفتتح في المزاد (design/auction.md 3.0): «ثلاثة مواضيع» وحدها.
      $('starter').innerHTML = a.turn ? `${esc(a.starter ?? 'يبدأ')} ${tn(a.turn)}` : esc(a.starter ?? '');
      setBadges(`الجولة ${p.n} من ${p.total}`);
    } else if (a.screen === 'end') {
      showScreen('end');
      $('e1').textContent = name(1); $('e2').textContent = name(2);
      // حصيلة الجولة بإشارتها: قد تنقص في الترتيب بفخ.
      const sign = n => (n < 0 ? '−' + -n : '+' + n);
      $('r1').textContent = sign(a.totals[1]); $('r2').textContent = sign(a.totals[2]);
      setBadges(`انتهت الجولة ${p.n}`);
    } else if (a.screen === 'topic') {
      showScreen('auc');
      renderAuction(a);
      setBadges(`الموضوع ${a.n} من ${a.count}`);
    } else if (a.screen === 'list') {
      showScreen('rnk');
      renderRanking(a);
      setBadges(`القائمة ${a.n} من ${a.count}`);
    } else {
      showScreen('q');
      setBox(a);
      $('label').textContent = a.question;
      setBadges(`السؤال ${a.n} من ${a.count}`);
    }

    // بعد الحكم الأخير: الحكم والإجابة في مربع الإعلان حتى السؤال التالي. و«التالي» فيه في نهاية الجولة.
    const asking = a.screen === 'ask' || a.screen === 'topic' || a.screen === 'list';
    const v = asking ? a.verdict : null;
    announce(a.screen === 'end' ? { next: p.next } : a.screen === 'list' ? rankBox(a) : { verdict: v, answer: a.answer, told: v && a.tally ? `ذُكر ${a.tally.n} من ${a.tally.of}` : undefined });
    syncTimer(p.timer, a);
    setTurn(a.turn);
    // الحدّ يكتسح لصاحب الدور من ظهور سؤاله، في القراءة ثم العدّاد بلا حركة بينهما، وللآخر فوراً إن انتقل إليه (المالك 20:39، design/system.md 15.2).
    // وبعد الحكم يقف على من أخذ النقاط، أو يعود إلى المنتصف إن لم يأخذ أحد. وفي غير شاشة السؤال في المنتصف.
    // والعدّاد يعمل: إطار الوقت حول لوحة صاحب الدور يتآكل، والثواني فيها، والحزم تخفت (.running وحده).
    const running = !!count && !count.test;
    setRunning(running);
    // وفي المزاد في المنتصف أثناء المزايدة (turn 0)، ثم للملتزم من «ابدأ» (design/auction.md 2، 3.0).
    // والترتيب يقرر حدّه بعد الحكم بنفسه (turn): في المنتصف بعد الفخ وإن كان للحكم صاحب (design/ranking.md 2).
    setSide(!asking ? 0 : v && a.screen !== 'list' ? v.team || 0 : a.turn);
    if (running && count.id !== drained) { drained = count.id; drain(a.turn, (count.endAt - Date.now()) / 1000, p.timer.seconds); }
    if (!running && drained) { drained = 0; drain(0); }
    renderCtl();
  }
  let drained = 0;

  // ===== المزاد (design/auction.md 2): الموضوع، ورقما الفريقين كلٌّ بلونه والأعلى أكبرهما (3.0)، ومن الالتزام العدّ =====
  function renderAuction(a) {
    $('topic').textContent = a.topic;
    // في المزايدة: «في القائمة 12» للقائمة حتى 20 وحدها (الوثيقة 5.5، design/auction.md 2.1).
    $('tsize').hidden = !a.size;
    $('tsize').innerHTML = a.size ? `في القائمة <span class="ltr">${a.size}</span>` : '';
    const bids = a.phase === 'bid' ? a.bids : [];
    $('bids').innerHTML = bids.map(b => `<span class="bid t${b.team}${b.top ? ' top' : ''}"><i></i><span>${num(b.n)}</span></span>`).join('');
    const t = a.tally;
    $('tally').hidden = !t;
    if (t) { $('tn').textContent = t.n; $('tof').textContent = t.of; $('tally').className = `tally t${t.team}`; }
    // ما ذُكر بلون من ذكره، والأحدث يظهر بحركته. وبعد الحكم القائمة كلها: ما ذُكر أولاً، ثم ما لم يُذكر بإطار (design/auction.md 2.3 و2.4).
    // وفي النافذة الواحدة يُعدّ دون أسماء، فلا عناصر قبل الحكم، وبعده القائمة كلها بإطار.
    const reveal = !!a.list;
    $('auc').classList.toggle('reveal', reveal);
    const it = (x, cls) => `<span class="it ${cls}"><i></i><span>${esc(x.name)}</span></span>`;
    const said = a.said ?? [];
    const fresh = !reveal && said.length > shownSaid;
    shownSaid = said.length;
    const items = said.map((x, i) => it(x, `t${x.team}${fresh && i === said.length - 1 ? ' new' : ''}`));
    if (reveal) items.push(...a.list.filter(x => !x.by).map(x => it(x, 'left')));
    $('items').innerHTML = items.join('');
    // بعد الحكم: القائمة القصيرة بشارات المزايدة الكبيرة إن اتسعت كلها في صفين، وإلا فبالحجم المعتاد (design/auction.md 7.6)
    $('auc').classList.toggle('big', reveal);
    if (reveal && !fitsAll($('items'))) $('auc').classList.remove('big');
    fitItems($('items'), reveal);
    if (fresh) replay($('tally'), 'bump');
  }
  let shownSaid = 0;

  // ===== الترتيب (design/ranking.md 2): العنوان وإشارته، واللوحة: 13 خانة بالترتيب، وgrid-auto-flow يضعها في أعمدتها =====
  // الخانة المنتظرة رتبتها وحدها · المكشوفة بلون من ذكرها واسمها · الفخ الذي لم يقع فيه أحد مخفي ولا يصل منه شيء (7.2 و7.4)
  // · وبعد نهاية القائمة ما لم يُذكر باسمه (.left)، و.reveal على القسم (المكشوفة بيضاء بإطار لونها، 1.1).
  const PEN = { 11: 3, 12: 2, 13: 1 };
  let shownFresh = '';
  // وقت القائمة (design/ranking.md 7.8): «بقي للقائمة» تحت الفخاخ، 5:00 قبل «ابدأ» ثم يجري حتى listEnds بساعة الجهاز، ويُخفى بعد النهاية.
  let listEnds = null;
  const listText = () => format(Math.max(0, Math.ceil((listEnds - Date.now()) / 1000)));
  setInterval(() => { const el = document.querySelector('.scr.rnk.show #rclock b'); if (el && listEnds && el.textContent !== listText()) el.textContent = listText(); }, 250);
  function renderRanking(a) {
    // العنوان على أول « · »: ما قبله سطر 64، وما بعده إشارة 32 بجانبه (التاريخ غالباً). وبلا « · » لا إشارة (design/ranking.md 7.3).
    const at = a.title.indexOf(' · ');
    $('rtitle').textContent = at < 0 ? a.title : a.title.slice(0, at);
    $('rsub').innerHTML = at < 0 ? '' : num(a.title.slice(at + 3));
    // الخانة التي كُشفت الآن تتحرك مرة واحدة: لا تُعاد حركتها بإعادة رسم الحالة نفسها.
    const key = `${a.n}/${a.fresh}/${a.slots.filter(x => x.team).length}`;
    const fresh = a.fresh && key !== shownFresh ? a.fresh : 0;
    shownFresh = key;
    $('board').innerHTML = a.slots.map(x => {
      if (!x.rank) return '<p class="sl trap"></p>';
      const cls = ['sl', x.trap && 'trap', x.team && 't' + x.team, !x.team && x.name && 'left', x.rank === fresh && 'new'].filter(Boolean).join(' ');
      return `<p class="${cls}" data-r="${x.rank}"><b>${x.trap ? '−' + PEN[x.rank] : x.rank}</b>${x.name ? `<span data-fit="خانة ${x.rank}">${esc(x.name)}</span>` : ''}</p>`;
    }).join('') + (a.listClock ? `<p class="clock" id="rclock"><span>بقي للقائمة</span><b>${a.listEnds ? '' : format(a.listSeconds)}</b></p>` : '');
    listEnds = a.listEnds ?? null;
    if (listEnds) $('rclock').querySelector('b').textContent = listText();
  }
  // مربع الإعلان في الترتيب: الحكم بالمربع («[الاسم] · +7» و«المركز 7»)، و«لا نقاط» و«لم تُكشف خانة».
  // ونهاية القائمة بلا مربع: «كُشف 7 من 10» (design/ranking.md 7.6).
  function rankBox(a) {
    if (a.phase === 'listend') return { next: `${a.timeup ? 'انتهى وقت القائمة · ' : ''}كُشف ${a.found} من ${a.of}` };
    // المقارنة بالنافذة الواحدة: بلا مربع، والخانات تُنقر (design/ranking.md 4).
    if (a.phase === 'mark') return { next: 'المقارنة بالتسجيل' };
    const v = a.verdict;
    if (!v) return {};
    return { verdict: v, say: !v.team ? 'لم تُكشف خانة' : v.rank > 10 ? `فخّ المركز ${v.rank}` : `المركز ${v.rank}` };
  }
  // ما ذُكر: أثناء العدّ يبقى الأحدث (يسقط الأقدم). وبعد الحكم يبقى كل ما ذُكر، ويسقط من غير المذكور آخره،
  // وفي آخر الصف «و N غيرها» (design/auction.md 7.2، fitItems في design/auction.html).
  const fitsAll = box => !box.lastElementChild || rect(box.lastElementChild).bottom <= rect(box).bottom + 1;
  function fitItems(box, reveal) {
    const all = [...box.children];
    const fits = () => !box.lastElementChild || rect(box.lastElementChild).bottom <= rect(box).bottom + 1;
    if (fits()) return;
    if (!reveal) { while (!fits() && box.firstElementChild) box.firstElementChild.remove(); return; }
    const more = document.createElement('span'); more.className = 'it more'; box.append(more);
    let hidden = 0;
    const lefts = all.filter(e => e.classList.contains('left'));
    while (!fits()) {
      const el = lefts.length ? lefts.pop() : all.filter(e => e.isConnected).pop();
      if (!el) break;
      el.remove(); hidden++;
      more.innerHTML = `<span>و <span class="ltr">${hidden}</span> غيرها</span>`;
    }
  }

  // ===== أزرار الشاشة المشتركة (design/shared.md 3): المقدّم يقرر ما يظهر (ctl)، وهنا موضعه =====
  // ctl: { card, near, a, b, c: أزرار (c الصف الثالث في الجولة) · count: خانتا العدد · names: اللوحتان حقلان · pick: الخانات تُنقر · scores · error }
  // والزر { cmd, label, kind: '' | 'alt' | 'no', off }. يصل من النافذة التي تحتوي هذه الشاشة وحدها، فلا يظهر في نافذة الجمهور.
  let ctl = null;
  const button = b => `<button class="cbtn${b.kind ? ' ' + b.kind : ''}${b.off ? ' off' : ''}" data-cmd="${esc(b.cmd)}">${b.html ?? num(b.label)}</button>`;
  const rows = list => (list ?? []).map(r => `<div class="ctl">${r.map(button).join('')}</div>`).join('');
  function renderCtl() {
    const c = embed && view ? ctl : null;
    canvas.classList.toggle('editing', !!c?.names);
    // أزرار البطاقة في الشاشة الظاهرة وحدها.
    document.querySelectorAll('.card .ctl').forEach(el => { el.innerHTML = el.closest('.scr').classList.contains('show') ? (c?.card ?? []).map(button).join('') : ''; });
    $('near').innerHTML = (c?.near ?? []).map(button).join('');
    $('cornerA').innerHTML = rows(c?.a);
    $('cornerB').innerHTML = rows(c?.b);
    $('cornerC').innerHTML = rows(c?.c);
    // النافذة الواحدة: صفّا أزرار الزاويتين مكان الشعار (1.3).
    canvas.classList.toggle('has-a', ['cornerA', 'cornerB', 'cornerC'].some(id => $(id).children.length));
    $('count').innerHTML = c?.count ? '<span class="lbl">عدد الأنماط</span>' + [['short', 2], ['full', 4]].map(([m, k]) =>
      `<button class="ctile${c.count.value === m ? ' sel' : ''}${k === 4 && !c.count.four ? ' off' : ''}" data-cmd="count:${m}"><span class="ltr">${k}</span></button>`).join('') : '';
    for (const id of ['err', 'faceErr']) { $(id).hidden = !c?.error; $(id).textContent = c?.error ?? ''; }
    document.querySelector('.scr.title .sub').hidden = !!c;
    $('guide').hidden = !c?.count;
    // المقارنة في الترتيب: كل خانة تُنقر فيدوّر صاحبها.
    $('rnk').classList.toggle('mark', !!c?.marks);
    $('board').querySelectorAll('.sl[data-r]').forEach(el => { if (c?.marks) el.dataset.cmd = 'act:mark:' + el.dataset.r; else delete el.dataset.cmd; });
    $('tiles').querySelectorAll('.tile').forEach(t => { if (c?.pick && !t.classList.contains('by1') && !t.classList.contains('by2') && !t.classList.contains('auto') && !t.classList.contains('left')) t.dataset.cmd = 'pick:' + t.dataset.mode; else delete t.dataset.cmd; });
    for (const k of [1, 2]) {
      if (c?.scores) $('s' + k).dataset.cmd = 'scores'; else delete $('s' + k).dataset.cmd;
      // الحقل الذي يُكتب فيه لا يُستبدل بما يعود من المقدّم، فلا يضيع حرف في الكتابة السريعة.
      const input = $('i' + k), value = view?.match.teams[k] ?? '';
      if (c?.names && input.value !== value && document.activeElement !== input) input.value = value;
    }
    placeNear();
  }
  // أزرار العدّاد والحكم في صف الشارات (1.3): تنتهي قبل أول شارة بـ 32، أي 24 بعد ميلها (ارتفاع 64 × ظل 14° ÷ 2 = 8).
  function placeNear() {
    const near = $('near'), badges = [...document.querySelectorAll('.badge')].filter(b => b.getClientRects().length);
    if (!near.children.length || !badges.length) return;
    // بحدود الشارة الفعلية لا offsetLeft: يُقرَّب كسر الميل فيصير الفراغ 23 (design/auction.md 7.5). والقياس على مقاس 1920.
    const c = rect(canvas), k = c.width / 1920 || 1;
    near.style.left = Math.floor(Math.min(...badges.map(b => (rect(b).left - c.left) / k)) - 32 - near.offsetWidth) + 'px';
  }
  const send = (cmd, data = {}) => parent.postMessage({ bc: 'cmd', cmd, ...data }, location.origin);
  if (embed) {
    addEventListener('message', e => {
      if (e.origin !== location.origin || e.source !== parent || e.data?.bc !== 'ctl') return;
      ctl = e.data.ctl;
      renderCtl();
    });
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-cmd]');
      if (!b || b.classList.contains('off') || !ctl) return;
      send(b.dataset.cmd);
    });
    // الاسمان يُكتبان في اللوحتين. Enter في الأول ينقل إلى الثاني، وفي الثاني = «ابدأ القرعة».
    for (const k of [1, 2]) {
      // الأرقام الهندية تصير إنجليزية في الحقل نفسه وهو يُكتب (القاعدة: أرقام إنجليزية في كل شاشة).
      $('i' + k).addEventListener('input', e => {
        const el = e.target, v = el.value.replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 0x0660).replace(/[\u06F0-\u06F9]/g, d => d.charCodeAt(0) - 0x06F0);
        if (v !== el.value) { const at = el.selectionStart; el.value = v; el.setSelectionRange(at, at); }
        send('teams', { a: $('i1').value, b: $('i2').value });
      });
      $('i' + k).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); k === 1 ? $('i2').focus() : send('draw'); } });
    }
    parent.postMessage({ bc: 'need-ctl' }, location.origin);
  }

  // ===== لحظات الحركة (design/start.md وdesign/letter.md، القسم 6). الحالة محسومة قبلها، والحركة عرض فقط =====
  let timers = [];
  const later = (ms, f) => timers.push(setTimeout(f, ms));
  const DRAW_STEPS = [90, 90, 100, 110, 120, 140, 160, 190, 230, 280, 340, 420];
  function animate(name) {
    timers.forEach(clearTimeout); timers = []; busy = false;
    canvas.classList.remove('enter', 'anim', 'drawing'); void canvas.offsetWidth;
    if (!view || still()) return render();
    canvas.classList.add('anim');
    const winner = view.match.winner;
    if (name === 'draw' && winner) {
      render(); showScreen('spin'); busy = true; canvas.classList.add('drawing');
      // يتنقل المؤشر 12 مرة ويتباطأ، فيقف على الفائز في آخر خطوة. والحدّ يتأرجح معه، وإطار الوقت يتنقل معه (1.3).
      let t = DRAW_STEPS.length % 2 === 0 ? other(winner) : winner, at = 0;
      DRAW_STEPS.forEach(ms => { at += ms; const who = t; later(at, () => { setTurn(who); setSide(who); }); t = other(t); });
      later(at + 420, () => { busy = false; canvas.classList.remove('drawing'); render(); bump(winner); });
    }
    if (name === 'face' && view.match.step === 'face') {
      render(); canvas.classList.add('enter'); setTurn(0); busy = true;
      // بعد آخر خانة: تُرفع الحركة قبل العرض، فلا تبدأ خانات المسار من جديد.
      later(1000 + $('track').children.length * 120 + 200, () => { busy = false; canvas.classList.remove('enter'); render(); bump(winner); });
    }
  }

  // لحظات الجولة: تصل مع الحالة الجديدة بعد كل فعل. prev: الحالة قبلها (للرصيد قبل الزيادة).
  let shownKey = '';
  function roundMoments(moments, prev) {
    const p = view.play, a = p.a;
    const key = `${p.n}/${a.screen}/${a.n ?? ''}`;
    const changed = key !== shownKey;
    shownKey = key;
    for (const m of moments) if (m.name === 'right') sound('right'); else if (m.name === 'trap' || ((m.name === 'steal' || m.name === 'fail') && m.reason === 'wrong')) sound('wrong');
    if (still() || (!moments.length && !changed)) return;
    canvas.classList.remove('anim'); void canvas.offsetWidth; canvas.classList.add('anim');
    for (const m of moments) {
      if (m.name === 'right' && prev) {
        // صحيحة: مربع الإعلان يُمسح من اليمين، والحزم تندفع، وبعد 250ms يزيد الرقم الكبير وتنبض لوحة الكاسب.
        const w = m.team, to = p.scores[w];
        setScore(w, prev.scores[w]); surge();
        // جهة الكاسب تومض: الحدّ عنده غالباً من قبل، فلا تكفي ومضة الوصول.
        replay($('stagebg').querySelector('.f' + w), 'blink');
        later(250, () => { setScore(w, to); bump(w); moment(w, 'gain'); });
      }
      // المزاد، لم يفِ الملتزم (design/auction.md 2.5، 2.0): البطاقة تهتز، ثم يكتسح الحدّ إلى الخصم ويزيد رقمه بنقطتيه.
      if (m.name === 'fail' && prev) {
        const w = m.team, to = p.scores[w];
        setScore(w, prev.scores[w]); replay($('cardWrap'), 'shake'); setTurn(0);
        later(240, () => { replay($('shine'), 'go'); setTurn(w); setScore(w, to); bump(w); moment(w, 'gain'); });
      }
      // الترتيب، فخ (design/ranking.md 2.5): البطاقة تهتز والحدّ في المنتصف، ثم ينقص رقم من وقع فيه بما خُصم ويخفت.
      if (m.name === 'trap' && prev) {
        const w = m.team, to = p.scores[w];
        setScore(w, prev.scores[w]); replay($('cardWrap'), 'shake'); setTurn(0);
        later(480, () => { setScore(w, to); moment(w, 'lose'); });
      }
      if (m.name === 'lead') later(700, () => { moment(m.team, 'lead'); moment(other(m.team), 'lose'); });
      if (m.name === 'steal') {
        // انتقال الإجابة (السرقة): البطاقة تهتز إن كانت خاطئة، ثم لمعة، والمؤشر يقفز إلى الخصم. لا شارة ولا كلمة «سرقة». العدّاد لا ينتظر الحركة.
        const go = () => { replay($('shine'), 'go'); bump(m.team); setTurn(m.team); };
        // وفي المزاد تهتز أيضاً حين انتهى وقت الملتزم (shake، design/auction.md 2.5).
        if (m.reason === 'wrong' || m.shake) { replay($('cardWrap'), 'shake'); setTurn(0); later(240, go); } else go();
      }
    }
    // نهاية الجولة: رقم المتقدّم الكبير ينبض، ويخفت رقم الآخر، ولا يتحرك شيء إن تعادلا.
    if (changed && a.screen === 'end' && a.totals) {
      const s = p.scores, lead = s[1] > s[2] ? 1 : s[2] > s[1] ? 2 : 0;
      if (lead) { moment(lead, 'lead'); moment(other(lead), 'lose'); }
    }
  }

  // ===== العدّاد: نافذة الجمهور هي التي تعدّ الثواني بنفسها بعد أمر «ابدأ» =====
  // count: { id, endAt } لعدّاد الجولة (endAt بساعة الجهاز نفسه، فيعود صحيحاً بعد إعادة التحميل)، أو { test } لعدّاد ش0 التجريبي.
  let count = null, ticker = 0, lastText = '', lastLeft = -1, expired = 0;
  const format = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const show = seconds => {
    const text = format(seconds);
    $('timer').textContent = text;
    // الجمهور يرى الثواني وحدها في لوحة صاحب الدور (1.3)، وفي عدّاد ش0 التجريبي في البطاقة.
    $('c1').textContent = $('c2').textContent = String(seconds);
    if (count?.test) $('label').textContent = `العدّاد يعمل · ${text}`;
    if (text !== lastText) { lastText = text; link.send('tick', { text }); }
  };
  // يقف العدّاد: إطار الوقت يثبت حيث بلغ، والحزم تعود إلى سرعة القراءة.
  const stop = () => {
    clearInterval(ticker); ticker = 0; count = null; lastLeft = -1; setDanger(false); setRunning(false);
    drainAnim?.pause();
  };
  const run = () => {
    const left = Math.max(0, Math.ceil((count.endAt - Date.now()) / 1000));
    show(left);
    setDanger(left > 0 && left <= 3);
    if (!count.test) speed(left > 0 && left <= 3 ? 3.5 : 2.2);
    if (left !== lastLeft && left > 0 && left <= 3) sound('tick');
    lastLeft = left;
    if (left > 0) return;
    const done = count;
    stop();
    if (done.test) $('label').textContent = 'انتهى الوقت';
    else { expired = done.id; link.send('timeout', { id: done.id }); }
  };
  const begin = c => { stop(); count = c; run(); if (count) ticker = setInterval(run, 100); };
  function syncTimer(t, a) {
    if (t && t.id !== count?.id && t.id !== expired) return begin({ id: t.id, endAt: t.at + t.seconds * 1000 });
    if (!t && count && !count.test) stop();
    if (!count) show(a?.clock ?? 0);
  }

  const waiting = () => { stop(); setLocked(true); canvas.classList.add('pre'); setTurn(0); setSide(0); showScreen('q'); $('letter').textContent = ''; delete $('letter').dataset.key; $('letter').classList.remove('ending'); $('label').textContent = 'نافذة الجمهور · بانتظار المقدّم'; };
  const ready = () => {
    if (count) stop();
    setLocked(false); show(10);
    if (view) render();
    else { canvas.classList.add('pre'); showScreen('q'); $('label').textContent = 'نافذة الجمهور · متصلة'; }
  };

  // ?check: صفحة فحص ثابتة، لا تتبع المقدّم وإن كان مفتوحاً.
  const checking = query.has('check');
  const link = createLink('audience', (type, data) => {
    if (checking) return;
    if (type === 'view') {
      const prev = view?.play;
      view = data;
      setMuted(data.muted);
      if (count?.test) return;
      // في الجولة: كل حالة جديدة تقطع ما بقي من حركة سابقة (المواجهة مثلاً)، فتظهر فوراً.
      if (data.play && data.match.step === 'play') { timers.forEach(clearTimeout); timers = []; busy = false; canvas.classList.remove('enter'); }
      setLocked(false); render();
      if (data.play && data.match.step === 'play') roundMoments(data.moments ?? [], prev);
    }
    if (type === 'anim') { if (data.view) view = data.view; if (!count?.test) { setLocked(false); animate(data.name); } }
    if (type === 'start') {
      setLocked(false); ctl = null; renderCtl();
      canvas.classList.remove('pre', 'fresh'); setTurn(0); setSide(0); showScreen('q'); setBadges(); announce();
      $('label').textContent = 'العدّاد يعمل';
      begin({ test: true, endAt: Date.now() + data.seconds * 1000 });
    }
    // أُغلقت اللعبة لتغيّر الرقم السري: لا يبقى على شاشة الجمهور شيء من اللعب.
    if (type === 'lock') { view = null; waiting(); }
    if (type === 'unlock' || type === 'reset') ready();
  });
  link.onStatus(on => {
    if (checking) return;
    if (!count && on) ready();
    if (!count && !on) waiting();
    // اتصلت (أو عادت بعد إعادة تحميل): تطلب حالة المباراة، ولو كانت نافذة جمهور أخرى متصلة قبلها.
    if (on) { link.send('tick', { text: $('timer').textContent }); link.send('need-view'); }
  });

  $('fs').onclick = () => document.documentElement.requestFullscreen?.();
  // يختفي الزر إن ملأت النافذة الشاشة بأي طريقة (زر Mac الأخضر مثلاً)، أو بعد 3 ثوانٍ من سكون الفأرة،
  // ويعود مع حركتها (ملاحظة المعاين 3 في ش1 و2 في ش2).
  const filled = () => document.body.classList.toggle('filled', innerWidth >= screen.width - 1 && innerHeight >= screen.height - 1);
  let idle = 0;
  const wakeMouse = () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 3000); };
  addEventListener('resize', filled);
  addEventListener('pointermove', wakeMouse);
  filled(); wakeMouse();

  // ?check في الرابط: فحص التداخل كما في design/main.html. ويعرض الهيكل كاملاً دون انتظار المقدّم.
  if (checking) {
    const { checkLayout } = await import('./js/layout-check.js');
    const layer = document.createElement('div');
    layer.className = 'check-layer';
    layer.innerHTML = '<div class="safe"></div>';
    canvas.appendChild(layer);
    setLocked(false);
    canvas.classList.remove('pre');
    await document.fonts.ready;
    window.__check = checkLayout(canvas, layer);
  }

  // للاختبار: فحص التداخل على الشاشة الحالية (js/stage-check.js، من design/check.js).
  window.__stageCheck = async () => {
    const { layoutCheck } = await import('./js/stage-check.js');
    await document.fonts.ready;
    // يُفحص ما يستقر على الشاشة لا لحظة عابرة: تنتظر الحركات القصيرة (نبضة اللوحة 450ms مثلاً، وهي تكبّرها 6%).
    // وحركات المكوّنات وحدها: المسرح خارج الفحص، والحزم بلا نهاية، وتآكل إطار الوقت بطول العدّاد.
    await Promise.all(canvas.getAnimations({ subtree: true })
      .filter(a => a.effect?.getComputedTiming().iterations !== Infinity && a.effect?.target?.closest?.('[data-hud]') && a.effect.target.tagName !== 'polygon')
      .map(a => a.finished.catch(() => {})));
    return layoutCheck({ canvas, layer: null, lines: [{ el: $('label'), max: 3 }], grid: true });
  };
</script>
</body>
</html>
