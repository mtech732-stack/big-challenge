<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحدي الكبير · نافذة الجمهور</title>
<link rel="icon" href="design/logo/icon-48.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/stage.css">
<link rel="stylesheet" href="css/start.css">
<link rel="stylesheet" href="css/letter.css">
<link rel="stylesheet" href="css/auction.css">
<link rel="stylesheet" href="css/ranking.css">
<link rel="stylesheet" href="css/wheel.css">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/final.css">
<link rel="stylesheet" href="css/hero.css">
<link rel="stylesheet" href="css/qr.css">
<style>
  /* اللعبة مغلقة أو بانتظار المقدّم: لا يبقى على الشاشة إلا الخلفية والبطاقة. */
  .locked .team, .locked .badge, .locked .box, .locked .ctl-near, .locked .ctl-corner { display: none; }
  /* أعلى اليسار، حيث لا شيء من الهيكل، ويختفي في ملء الشاشة وفي النافذة الواحدة. */
  #fs { position: fixed; top: 24px; left: 24px; font-size: 32px; }
  :fullscreen #fs, .embed #fs, .filled #fs, .idle #fs { display: none; }
  /* النهاية بنافذتين: لا صف أزرار في البطاقة، فلا يُحسب ارتفاعه (72) ويبقى المحتوى في وسطها (design/final.html: الصف مخفي بلا نافذة واحدة) */
  .scr.fin .crow:has(.ctl:empty), .scr.win .crow:has(.ctl:empty) { display: none; }
</style>
</head>
<body>
<div class="screen">
  <div class="canvas locked pre" id="canvas">
    <!-- المسرح بطرفين بلوني الفريقين، والحدّ بينهما يكتسح لصاحب الدور (1.3، design/system.md 15.1–15.2) -->
    <div class="stagebg" id="stagebg"><div class="f f1"></div><div class="f f2"></div><div class="e" id="edge"></div>
      <div class="beam"></div><div class="beam w"></div><div class="beam"></div><div class="beam w"></div></div>
    <div class="particles" id="particles"></div>
    <!-- القصاصات عند إعلان الفائز (ش7، design/final.md 4.2): تحت الشعار واللوحات والبطاقة، ولا تدخل فحص التداخل -->
    <div class="confetti" id="confetti"></div>

    <!-- شاشات البطل (design/logo/الدمج.md 1.2 و3 و4): الانتظار والبداية واختيار النمط، والشعار فيها كبير بلا ترويسة ولا بطاقة.
         الهالة والأشعّة خلفه في البداية والاختيار. والحالة في canvas.dataset.hero: wait · start · pick -->
    <div class="hero" id="hero">
      <div class="halo"></div><div class="rays"></div>
      <div class="hlogo" data-hud="الشعار الكبير" data-edge><img src="design/logo/logo.svg" alt="التحدي الكبير"></div>
      <p class="cap" id="heroCap" data-hud="سطر الانتظار"></p>
      <div class="start-go ctl" id="startGo" data-hud="زر البدء"></div>
      <div class="start-side" id="startSide"><p class="err" id="err" data-hud="سطر الخطأ" hidden></p><div class="count" id="count" data-hud="عدد الأنماط"></div></div>
      <div class="turnp" id="turnp" data-hud="مؤشر الدور" data-free><b><span id="turnName"></span></b><p id="turnLine"></p></div>
      <div class="mcards" id="mcards"></div>
      <div class="pick-ctl ctl" id="pickCtl" data-hud="أزرار الاختيار"></div>
    </div>

    <!-- الشعار المعتمد أعلى اليسار، «الترويسة» (design/logo/الدمج.md 1). وأثناء الجولة بنافذة واحدة الأيقونة مكانه (1.3 ب) -->
    <div class="logo" data-hud="الشعار" aria-label="التحدي الكبير"><img class="full" src="design/logo/logo.svg" width="323" height="328" alt=""><img class="icon" src="design/logo/icon.svg" width="62" height="64" alt=""></div>

    <!-- لوحة الفريق بلا شكل: الاسم ثم الرقم الكبير ثم العدّاد لصاحب الدور، وإطار الوقت حولها (15.3 و15.5) -->
    <section class="team t1" id="p1" data-hud="لوحة الفريق الأول">
      <div class="shape"></div><svg class="ring" preserveAspectRatio="none"><polygon pathLength="100"/></svg>
      <div class="row" data-fit="لوحة الفريق الأول"><span class="name" id="n1">الفريق الأول</span><input class="name-in" id="i1" maxlength="18" autocomplete="off" placeholder="اكتب اسم الفريق الأول" aria-label="اسم الفريق الأول"><span class="score" id="s1"></span><span class="cnt" id="c1"></span></div>
    </section>

    <div class="badge mode" data-hud="شارة النمط"><i></i><span id="mode">اختبار العرض</span><img class="art" alt="" data-overhang hidden></div>
    <div class="badge plain off" id="b1" data-hud="الشارة الأولى"><i></i><span></span></div>
    <div class="badge plain off" id="b2" data-hud="الشارة الثانية"><i></i><span></span></div>
    <!-- الوقت بصيغته الكاملة للمقدّم والاختبار، والجمهور يرى ثوانيه في لوحة صاحب الدور (#c1 و#c2) -->
    <span id="timer" hidden>0:10</span>

    <div class="card-wrap" id="cardWrap" data-hud="البطاقة">
      <div class="plate"></div>
      <div class="card">
        <!-- السؤال، وتحته الإجابة النموذجية بعد الحكم الأخير وحده (الوثيقة 1.1، 7.1) -->
        <div class="scr q show" data-s="q"><div class="letter" id="letter"></div><div class="qcol"><p class="question" id="label" data-fit="السؤال">نافذة الجمهور · بانتظار المقدّم</p></div></div>
        <!-- المزاد (ش4، design/auction.md 2): الموضوع والعدّ، ثم المزايدة أو ما ذُكر. لا القائمة ولا طولها قبل الحكم -->
        <div class="scr auc" data-s="auc" id="auc">
          <div class="ahead">
            <p class="topic" id="topic" data-fit="الموضوع"></p>
            <p class="tally" id="tally" data-fit="العدّ" hidden><b class="n" id="tn"></b><span class="of">من <b class="ltr" id="tof"></b></span></p>
            <!-- بعد الحكم: «الموضوع التالي» هنا في النافذة الواحدة، لا في صف الشارات (design/auction.md 4) -->
            <div class="ctl" id="aucCtl"></div>
          </div>
          <div class="bids" id="bids"></div>
          <div class="items" id="items"></div>
        </div>
        <!-- الترتيب (ش5، design/ranking.md 2): العنوان، ثم اللوحة: 1–10 والفخاخ. لا اسم قبل أن يُكشف -->
        <div class="scr rnk" data-s="rnk" id="rnk">
          <div class="rhead">
            <p class="title" id="rtitle" data-fit="عنوان القائمة"></p>
            <p class="sub" id="rsub"></p>
            <!-- «أخفِ الباركود» ما دام الباركود ظاهراً (design/s8.md 2.1) -->
            <div class="ctl" id="rnkCtl"></div>
          </div>
          <div class="board" id="board"></div>
        </div>
        <!-- شريط البونص (ش6، design/wheel.md 2): من يديرها، ثم الخانات العشر. وبعد الوقوف الخانة في شاشة السؤال نفسها (مربعها بلون من أدارها) -->
        <div class="scr whl" data-s="whl" id="whl">
          <p class="whead" id="whead" data-fit="سطر من يدير العجلة"></p>
          <div class="band" id="band"></div>
        </div>
        <!-- الجولة (ش2): افتتاحها ونهايتها. والسؤال في القسم الأول نفسه -->
        <div class="scr intro" data-s="intro">
          <p class="rule" id="rule"></p>
          <div class="crow"><p class="head" id="starter" data-fit="سطر البدء"></p><div class="ctl"></div></div>
        </div>
        <div class="scr end" data-s="end">
          <div class="cols">
            <div class="col"><p class="who t1" data-fit="اسم الفريق الأول"><i></i><span id="e1"></span></p><p class="pts tn t1" id="r1"></p></div>
            <div class="col"><p class="who t2" data-fit="اسم الفريق الثاني"><i></i><span id="e2"></span></p><p class="pts tn t2" id="r2"></p></div>
          </div>
          <div class="crow"><div class="ctl"></div></div>
        </div>
        <!-- الانتظار، وفي الشاشة المشتركة: عدد الأنماط و«ابدأ القرعة» (design/shared.md 4) -->
        <div class="scr title" data-s="title">
          <p class="sub">المباراة تبدأ بعد قليل</p>
          <div class="crow setup"><p class="guide" id="guide" data-fit="سطر الإرشاد" hidden>اكتب اسمَي الفريقين في لوحتيهما، ثم اختر عدد الأنماط</p><div class="ctl"></div></div>
        </div>
        <div class="scr draw" data-s="spin">
          <p class="ask">من يختار نمط الجولة الأولى؟</p>
        </div>
        <div class="scr draw" data-s="result">
          <p class="sub">الفائز بالقرعة</p>
          <p class="winner" id="winner" data-fit="اسم الفائز"></p>
          <div class="crow"><p class="sub">يختار نمط الجولة الأولى</p><div class="ctl"></div></div>
        </div>
        <div class="scr pick" data-s="pick">
          <div class="crow head-row"><p class="head" id="pickHead" data-fit="سطر الاختيار"></p><div class="ctl"></div></div>
          <div class="tiles" id="tiles"></div>
        </div>
        <!-- النهاية (ش7، design/final.md 2): النتيجة النهائية بمسار المباراة وما كسبه كل فريق في كل عنصر، ثم الفائز -->
        <div class="scr fin" data-s="fin">
          <p class="head" data-fit="عنوان النتيجة">النتيجة النهائية</p>
          <div class="track" id="finTrack"></div>
          <div class="crow"><div class="ctl"></div></div>
        </div>
        <div class="scr win" data-s="win">
          <p class="sub" id="winSub">الفائز بالمباراة</p>
          <p class="champ" id="champ" data-fit="اسم الفائز"></p>
          <div class="crow"><div class="ctl"></div></div>
        </div>
        <div class="scr face" data-s="face">
          <div class="track" id="track"></div>
          <p class="err" id="faceErr" hidden></p>
          <div class="crow"><div class="ctl"></div></div>
        </div>
      </div>
    </div>

    <section class="team t2" id="p2" data-hud="لوحة الفريق الثاني">
      <div class="shape"></div><svg class="ring" preserveAspectRatio="none"><polygon pathLength="100"/></svg>
      <div class="row" data-fit="لوحة الفريق الثاني"><span class="name" id="n2">الفريق الثاني</span><input class="name-in" id="i2" maxlength="18" autocomplete="off" placeholder="اكتب اسم الفريق الثاني" aria-label="اسم الفريق الثاني"><span class="score" id="s2"></span><span class="cnt" id="c2"></span></div>
    </section>

    <!-- باركود الإجابات يمين البطاقة (design/s8.md 2): أبيض مستقيم 520×520 وخلفه صفيحة مائلة 6° -->
    <div class="qrbox" id="qrbox" data-hud="الباركود"><div class="plate"></div><div class="sheet"><canvas aria-label="باركود الإجابات"></canvas></div></div>
    <!-- مربع الإعلان أسفل اليمين (15.4): الحكم والإجابة بعد الحكم الأخير · من يبدأ الإجابة في المواجهة · «التالي» في نهاية الجولة -->
    <div class="box" id="box" data-hud="مربع الإعلان" hidden><i></i>
      <p class="chip" id="verdict" hidden><i></i><span id="vtext"></span></p>
      <p class="chip" id="faceChip" hidden><i></i><span>يبدأ الإجابة</span></p>
      <p class="line" id="reveal" data-fit="سطر الإجابة" hidden>الإجابة: <b id="answer"></b></p>
      <p class="line" id="told" data-fit="سطر ما ذُكر" hidden></p>
      <p class="line" id="say" data-fit="سطر الحكم" hidden></p>
      <p class="line" id="faceWin" data-fit="اسم الفائز" hidden></p>
      <p class="line" id="next" data-fit="سطر التالي" hidden></p>
    </div>

    <!-- أزرار الشاشة المشتركة، بجانب ما تتحكم فيه (design/shared.md 3.2). فارغة في نافذة الجمهور وحدها -->
    <div class="ctl-near" id="near" data-hud="أزرار العدّاد"></div>
    <div class="ctl-ans" id="ansCtl" data-hud="زر الكشف"></div>
    <div class="ctl-corner a" id="cornerA" data-hud="أزرار الزاوية العليا"></div>
    <div class="ctl-corner b" id="cornerB" data-hud="أزرار الزاوية السفلى"></div>
    <div class="ctl-corner c" id="cornerC" data-hud="أزرار الصف الثالث"></div>
    <!-- لوحة «⋯» (design/s8b.md): ما ليس في الزاوية من أزرار -->
    <div class="ctl-more" id="moreMenu" data-hud="لوحة المزيد" hidden></div>

    <div class="shine" id="shine"></div>
    <div class="danger"></div>
  </div>
</div>
<button id="fs">ملء الشاشة</button>

<script type="module">
  import './js/offline.js';
  import { createLink } from './js/frame-link.js';
  import { plan, chooser, picksDone, starter, METHODS, other, gains, leaderOf } from './js/match.js';
  import { rectOf } from './js/stage-check.js';
  import { PLANNED } from './js/modes/index.js';
  import { play as sound, setMuted } from './js/sound.js';
  import { spinSteps } from './js/wheel.js';
  import { drawQR } from './js/qr.js';

  const $ = id => document.getElementById(id);
  const canvas = $('canvas');
  const rect = el => el.getBoundingClientRect();
  const query = new URLSearchParams(location.search);
  const embed = query.has('embed');
  if (embed) document.body.classList.add('embed');
  const fit = () => document.documentElement.style.setProperty(
    '--scale', Math.min(innerWidth / 1920, innerHeight / 1080));
  addEventListener('resize', fit);
  fit();

  // الجسيمات: مواضع ثابتة البذرة كما في design/main.html.
  (function particles() {
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 22; i++) {
      const s = document.createElement('span');
      s.style.left = Math.round(rnd() * 1900) + 'px';
      s.style.top = Math.round(500 + rnd() * 600) + 'px';
      s.style.animationDuration = (14 + rnd() * 10).toFixed(1) + 's';
      s.style.animationDelay = (-rnd() * 20).toFixed(1) + 's';
      const k = 6 + Math.round(rnd() * 8); s.style.width = s.style.height = k + 'px';
      $('particles').appendChild(s);
    }
  })();

  const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  // الأرقام معزولة من اليسار، ومعها علامة + إن سبقتها، فلا تنقلب «+2» إلى «2+» (design/letter.md 2.2).
  // و«−2» (خصم الفخ) بعلامته كذلك، و«2024–2025» و«3:42» معزولان كاملين (design/ranking.html).
  const num = s => esc(s).replace(/([+−]?\d+(?:[:–]\d+)?)/g, '<span class="ltr">$1</span>');
  const setLocked = on => canvas.classList.toggle('locked', on);
  const setDanger = on => canvas.classList.toggle('meta-danger', on);
  // شاشة البطل: '' (لا شيء) أو wait أو start أو pick، وسطر الانتظار تحت الشعار.
  const setHero = (kind, cap = '') => { if (kind) canvas.dataset.hero = kind; else delete canvas.dataset.hero; $('heroCap').textContent = cap; };
  const showScreen = name => document.querySelectorAll('.card .scr').forEach(s => s.classList.toggle('show', s.dataset.s === name));
  const setTurn = team => { $('p1').classList.toggle('on', team === 1); $('p2').classList.toggle('on', team === 2); };
  const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
  const bump = team => replay($('p' + team), 'won');
  // الرقم الكبير هو النتيجة (1.3، design/system.md 15.5)، ويصغر بثلاث خانات.
  const setScore = (k, v) => { const el = $('s' + k); el.textContent = v; el.classList.toggle('three', String(v).length >= 3); };
  // لحظة واحدة على الرقم الكبير في كل مرة: تُزال الثلاث قبل إضافة إحداها، فلا تغلب «lose» الباقية من لحظة سابقة «gain» بعدها.
  const moment = (team, cls) => { const g = $('s' + team); g.classList.remove('gain', 'lead', 'lose'); replay(g, cls); };

  // ===== المسرح بطرفين (1.3، design/system.md 15.1–15.2 و15.11) =====
  // الحدّ يكتسح لصاحب الدور: وقت العدّاد، ومع مؤشر القرعة، ويقف على الفائز بها. وفي غير ذلك يعود إلى المنتصف.
  let side = 0;
  const setSide = t => {
    if (t === side) return;
    side = t;
    canvas.classList.toggle('turn-1', t === 1); canvas.classList.toggle('turn-2', t === 2);
    if (still()) replay(canvas, 'swap'); else replay($('edge'), 'sweep');
  };
  // الحزم: حركة واحدة متصلة، وسرعتها بالحالة دون قفز: القراءة 1 · العدّاد 2.2 · آخر 3 ثوانٍ 3.5 · لحظة الحكم 6 لنصف ثانية.
  const beams = still() ? [] : [...document.querySelectorAll('.beam')].map((b, i) => {
    const a = b.animate([{ translate: '0 0' }, { translate: '2900px 0' }], { duration: [16000, 22000, 19000, 26000][i], iterations: Infinity });
    a.currentTime = [2000, 9000, 14000, 4000][i];
    return a;
  });
  let pace = 1, surging = 0;
  const speed = r => { if (r === pace) return; pace = r; if (!surging) beams.forEach(a => a.updatePlaybackRate(r)); };
  const surge = () => { clearTimeout(surging); beams.forEach(a => a.updatePlaybackRate(6)); surging = setTimeout(() => { surging = 0; beams.forEach(a => a.updatePlaybackRate(pace)); }, 500); };
  const setRunning = on => { canvas.classList.toggle('running', on); if (!on) speed(1); else if (pace === 1) speed(2.2); };

  // إطار الوقت يُرسم على قياس اللوحة الفعلي بانحرافها 14°، ويُعاد رسمه كلما تغيّر قياسها (الاسم، والرقم، والعدّاد).
  const fitRing = team => {
    const svg = team.querySelector('.ring'), w = team.offsetWidth, h = team.offsetHeight, o = Math.tan(14 * Math.PI / 180) * h / 2;
    if (!w) return;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.querySelector('polygon').setAttribute('points', `${o},0 ${w + o},0 ${w - o},${h} ${-o},${h}`);
  };
  // يُعاد حسابه إن تغيّر عرض لوحة الثاني (الاسم والرقم) أو طول سطر المربع.
  { const ro = new ResizeObserver(() => placeBox()); for (const id of ['p2', 'reveal', 'faceWin', 'next', 'say']) ro.observe($(id)); }
  const sized = new ResizeObserver(list => list.forEach(e => fitRing(e.target)));
  sized.observe($('p1')); sized.observe($('p2'));
  // ويتآكل مع العدّاد: يبدأ مما مضى من الوقت (بعد إعادة التحميل مثلاً)، وينتهي مع آخر ثانية.
  // بحركة من الكود لا بانتقال CSS: الانتقال لا يجري على إطار مخفي (لحظة انتقال الإجابة تخفي المؤشر 240ms)، فكان يقفز إلى آخره.
  let drainAnim = null;
  const drain = (team, left, total) => {
    drainAnim?.cancel(); drainAnim = null;
    if (!team) return;
    const from = 100 * Math.min(1, Math.max(0, 1 - left / total));
    drainAnim = $('p' + team).querySelector('polygon').animate([{ strokeDashoffset: from }, { strokeDashoffset: 100 }], { duration: Math.max(0, left * 1000), fill: 'forwards' });
  };
  // الإطار الثابت للعدّاد الظاهر بلا عدّ: share ما بقي منه (0 فارغ). والموقوف متقطع حتى طوله الباقي ثم فراغ (s8b.css 1.2).
  const holdRing = (team, share) => {
    for (const k of [1, 2]) { const poly = $('p' + k).querySelector('polygon'); poly.style.strokeDashoffset = ''; }
    canvas.style.removeProperty('--dash');
    if (!team) return;
    const L = 100 * share, d = [];
    for (let x = 0; x + 1.6 <= L; x += 2.8) d.push(1.6, 1.2);
    $('p' + team).querySelector('polygon').style.strokeDashoffset = L ? 0 : 100;
    if (L) canvas.style.setProperty('--dash', [...d, 0, 200].join(' '));
  };
  // مربع الإعلان (15.4): الحكم والإجابة · الفائز بالقرعة · «التالي». ولا يظهر إن لم يكن فيه شيء.
  // told: سطر المزاد بعد الحكم «ذُكر 10 من 12» مكان الإجابة (القائمة كلها في البطاقة، design/auction.md 2).
  // say: سطر الترتيب في المربع «المركز 7» أو «لم تُكشف خانة» (الاسم في خانته، design/ranking.md 7.6).
  // bare: حكم العجلة بلا مربع، الشارة والسطر على الطرف (design/wheel.md 2.5).
  // سطر المربع مقاطع بين « · » لا تنكسر (الملاحظة 39، design/system.md 15.4): إن لم يتسع السطر انكسر عند « · » وحدها،
  // والفاصل في آخر المقطع الذي قبلها، فلا ينقسم اسم نمط ولا اسم فريق.
  const segs = s => String(s).split(' · ').map((t, i, a) => `<span class="nb">${num(t)}${i < a.length - 1 ? ' ·' : ''}</span>`).join(' ');
  function announce({ verdict: v, answer, told, say, face, next, bare } = {}) {
    $('verdict').hidden = !v;
    if (v) {
      $('verdict').className = `chip${v.team ? ' t' + v.team : ''}`;
      // الفريق الذي أخذ النقاط باسمه (الوثيقة 1.1، 7.1). وخصم الفخ «−2» بما خُصم فعلاً (design/ranking.md 7.7).
      $('vtext').innerHTML = v.label ? `${esc(name(v.who))} · ${esc(v.label)}`
        : v.team ? `${esc(name(v.team))} · ${num(v.points < 0 ? '−' + -v.points : v.points ? '+' + v.points : '0')}` : esc(v.none ?? 'لا نقاط');
    }
    $('reveal').hidden = !answer; $('answer').textContent = answer ?? '';
    $('told').hidden = !told; $('told').innerHTML = told ? segs(told) : '';
    $('say').hidden = !say; $('say').innerHTML = say ? segs(say) : '';
    $('faceChip').hidden = $('faceWin').hidden = !face; $('faceWin').textContent = face ? name(face) : '';
    // وسطران صريحان («\n») لنهاية القائمة بانقضاء وقتها (الملاحظة 36، design/ranking.css 5): لا « · » معلّقة.
    $('next').hidden = !next; $('next').innerHTML = next ? next.split('\n').map(segs).join('<br>') : '';
    $('box').classList.toggle('two', !!next?.includes('\n'));
    // بعد كشف الإجابة وقبل الاختيار: الإجابة وحدها في وسط المربع (design/s8b.md 4).
    $('box').classList.toggle('ans', !!answer && !v && !told && !say && !face && !next);
    $('box').hidden = !(v || answer || told || say || face || next);
    // «التالي» في نهاية الجولة نص أبيض على الطرف بلا مربع، فلا يتجاوز الأبيض سقفه (15.4 و15.12).
    // وحكم المزاد (سطره told) بلا مربع كذلك، فالقائمة القصيرة لا ترفع الأبيض فوق 35 (design/auction.md 1.5).
    $('box').classList.toggle('bare', !!bare || (!!next && !v && !answer && !face && !say) || (!!told && !answer && !face));
    placeBox();
  }
  // الملاحظة 27 (15.4): المربع يضيق بقدر ما يبقى بعد لوحة الثاني. حافته اليمنى ثابتة على 1794، وعرضه الأصغر من 659
  // ومن 1794 − (نهاية امتداد اللوحة + 24 + 17)، والامتداد 17 = ارتفاع 136 × ظل 14° ÷ 2. وإن لم يتسع السطر انكسر سطرين وصعدت الشارة لساناً فوقه.
  function placeBox() {
    const box = $('box'), p2 = $('p2');
    if (box.hidden) return;
    let w = Math.min(659, 1794 - (p2.offsetLeft + p2.offsetWidth + 17 + 24 + 17));
    const at = w => { box.style.left = (1794 - w) + 'px'; box.style.width = w + 'px'; };
    at(w);
    box.classList.remove('wrap');
    const line = [...box.querySelectorAll('.line')].find(l => !l.hidden);
    // عرض النص نفسه (Range مقسوماً على المقياس) لا scrollWidth: مع المقاطع (.nb) في سطر من اليمين لا يُحسب ما فاض يساراً (الملاحظة 39)
    let tw = 0;
    if (line) { const r = document.createRange(); r.selectNodeContents(line); tw = r.getBoundingClientRect().width / (canvas.getBoundingClientRect().width / 1920); }
    // الإجابة القصيرة بعد الكشف (ش8-أ/56، design/s8b.md 7.3): على الأعمدة 9–12 (1281–1794، بعرض 513) إن اتسع لها سطرها، فينقص الأبيض.
    if (box.classList.contains('ans') && line && tw <= 513 - 96 && w > 513) at(w = 513);
    box.classList.toggle('wrap', !box.classList.contains('two') && tw > box.clientWidth - 96);
  }

  // صف الشارات من اليمين بفراغ الأمان، محسوباً عند الطرف الأدنى المائل (design/start.html وdesign/letter.html):
  // شارة النمط (في الجولة)، ثم الأولى، ثم الثانية. ولا شارة للحزمة ولا للطريقة ولا للمستوى ولا «سرقة» (design/shared.md 1).
  // شارات الأنماط الأربع المرسومة مكان الشارة الصفراء (design/logo/الدمج.md 2.2): الصندوق امتداد أصفرها المرسوم [right, top, width, height]،
  // والصورة داخله بإزاحة سالبة لظلّها وهامشها [left, top, width, height]. وما سواها (الشريط، والجولة الفاصلة، والنهاية) الشارة النصية.
  const ART = {
    // الملاحظة 43 (#250): مواضع تُبقي ظلّ الرسم نفسه داخل الهامش الآمن وعلى 24 مما حوله.
    letter: ['letter', [116, 259, 463, 117], [-4, -7, 490, 136]],
    'last-two': ['last-two', [101, 253, 530, 125], [-65, -47, 600, 186]],
    auction: ['auction', [114, 252, 382, 125], [-1, -44, 390, 176]],
    ranking: ['ranking', [123, 225, 257, 149], [-6, -6, 281, 169]],
  };
  function setArt(id) {
    const el = document.querySelector('.badge.mode'), img = el.querySelector('.art'), art = ART[id];
    el.classList.toggle('drawn', !!art);
    el.toggleAttribute('data-free', !!art);
    img.hidden = !art;
    if (!art) { el.style.top = el.style.width = el.style.height = el.style.transform = ''; return; }
    const [file, [right, top, w, h], [x, y, iw, ih]] = art;
    if (img.dataset.file !== file) { img.dataset.file = file; img.onload = placeBadges; img.src = `design/logo/modes/${file}.svg`; }
    Object.assign(el.style, { right: right + 'px', top: top + 'px', width: w + 'px', height: h + 'px' });
    Object.assign(img.style, { left: x + 'px', top: y + 'px', width: iw + 'px', height: ih + 'px' });
    el.setAttribute('aria-label', $('mode').textContent);
  }
  function setBadges(a, b) {
    for (const [el, t] of [[$('b1'), a], [$('b2'), b]]) { el.classList.toggle('off', !t); el.querySelector('span').innerHTML = t ? num(t) : ''; }
    placeBadges();
  }
  function placeBadges() {
    const lean = Math.tan(14 * Math.PI / 180) * 64;
    // العرض بكسره (getBoundingClientRect على مقاس 1920) لا offsetWidth المقرَّب إلى عدد صحيح، ثم إلى الأعلى، فلا ينقص الفراغ عن 24 كسراً (تدقيق ش6).
    const k = rect(canvas).width / 1920 || 1;
    let right = 104;
    for (const el of [document.querySelector('.badge.mode'), $('b1'), $('b2')]) {
      if (!el.getClientRects().length) continue;
      // الشارة المرسومة: موضعها من جدولها، وصندوقها امتدادها الفعلي بعد الميل، فلا يُضاف له الميل (design/logo/الدمج.md 2.2).
      const drawn = el.classList.contains('drawn');
      // بنافذة واحدة أثناء الجولة تصغر الشارة المرسومة 0.68 (قرار المصمّم)، وأكثر إن لزم كي يبدأ صندوقها من 1508 فأبعد:
      // فتبقى أزرار العدّاد والحكم (حتى ثلاثة) بعد صف الزاوية الثالث (127–543) بفراغ 24: الحرف المعيّن 0.639 وآخر حرفين 0.587 (الدمج.md 6.10).
      if (drawn) {
        const w = parseFloat(el.style.width), r0 = parseFloat(el.style.right);
        el.style.transform = canvas.classList.contains('has-a') ? `scale(${Math.min(.68, (1920 - r0 - 1508) / w)})` : '';
      }
      if (drawn) right = parseFloat(el.style.right);
      else el.style.right = right + 'px';
      // والشارة النصية بعدها تمتد بميلها نصف lean إلى يمينها، فيُضاف لها ذلك النصف كي يبقى الفراغ 24 بعد الميل.
      // والمرسومة تُقاس من أبعد حدود رسمها يساراً (ظلّها بعد التصغير قد يتجاوز صندوقها بكسر)، كما يقيسها الفحص، فيبقى الفراغ 24 تامة.
      if (drawn) {
        const img = el.querySelector('.art'), ink = rectOf(img), c = rect(canvas);
        right = Math.ceil(1920 - (Math.min(rect(el).left, ink?.left ?? Infinity) - c.left) / k + 24 + lean / 2);
      } else right += Math.ceil(rect(el).width / k + 24 + lean);
    }
    placeNear();
  }
  // أول فتح للشاشة: تُحسب المواضع بعرض الخط البديل إن لم يكن الخط محمّلاً، فيُعاد حسابها بعد تحميله، وإلا تداخلت الشارات.
  document.fonts?.ready.then(placeBadges);
  document.fonts?.addEventListener('loadingdone', placeBadges);

  // ===== عرض حالة المباراة (ما يرسله المقدّم: الحالة، وأسماء الأنماط، وما يُعرض من الجولة) =====
  let view = null, shownPicks = -1, busy = false;
  const name = t => view.match.teams[t] || (t === 1 ? 'الفريق الأول' : 'الفريق الثاني');
  const tn = t => `<b class="tn t${t}">${esc(name(t))}</b>`;

  function render() {
    if (!view || busy) return;
    if (view.match.step === 'play' && view.play) return renderPlay(view.play);
    canvas.classList.remove('qr');
    if (view.match.step === 'final') return renderFinal(view);
    const { match: m, modes } = view;
    // نمط لم يُبنَ في مواجهة محفوظة من رابط المعاينة: اسمه العربي من قائمة الأنماط الأربعة، لا معرّفه الإنجليزي (ملاحظة المعاين 1).
    const modeName = id => modes.find(x => x.id === id)?.name ?? PLANNED.find(x => x.id === id)?.name ?? id;
    const total = METHODS[m.method].rounds;
    canvas.classList.add('pre');
    canvas.classList.remove('fresh');
    canvas.classList.toggle('short', m.method === 'short');
    $('n1').textContent = name(1); $('n2').textContent = name(2);
    // الرقمان من المواجهة، وقبلها بلا رقم (design/system.md 15.10).
    const showScores = m.step === 'face';
    setScore(1, showScores ? m.scores[1] : ''); setScore(2, showScores ? m.scores[2] : '');
    announce(m.step === 'face' ? { face: m.winner } : {});
    setRunning(false);
    let turn = 0;

    // البداية (design/logo/الدمج.md 3): الشعار 620 بالهالة والأشعّة مكان البطاقة، ولوحتا الاسمين في مكانيهما.
    // واختيار النمط (4): بطاقات د1 ومؤشر الدور. وما سواهما الترويسة.
    setHero(m.step === 'setup' ? 'start' : m.step === 'pick' ? 'pick' : '');
    if (m.step === 'setup') {
      showScreen('title');
      setBadges();
    }
    if (m.step === 'draw') {
      setBadges('القرعة');
      if (m.winner) { $('winner').innerHTML = tn(m.winner); showScreen('result'); turn = m.winner; }
      else showScreen('spin');
    }
    if (m.step === 'pick') {
      showScreen('pick');
      const done = picksDone(m);
      // قبل القرعة (design/s8b.md 3.2): البطاقات بلا نقر ولا مؤشر دور، و«قرعة البداية» وحده.
      if (!m.winner) {
        $('pickHead').innerHTML = '';
        setBadges('اختيار الأنماط');
      } else if (done) {
        const auto = m.picks.find(p => p.by === 0);
        $('pickHead').innerHTML = auto ? `الجولة <span class="ltr">4</span> للنمط المتبقي: ${esc(modeName(auto.mode))}` : 'اكتمل اختيار الأنماط';
        setBadges('اختيار الأنماط');
      } else {
        turn = chooser(m);
        const k = m.picks.length;
        $('pickHead').innerHTML = `${tn(turn)} يختار نمط الجولة <span class="ltr">${k + 1}</span>`;
        setBadges('اختيار الأنماط', `الجولة ${k + 1} من ${total}`);
      }
      pickCards(m, modes, done ? 0 : turn);
      // بعد اكتمال الاختيار: مؤشر الدور للفائز بسطر «يبدأ الإجابة» (design/s8b.md 3.2).
      if (done) startsLine(m.winner);
      $('tiles').innerHTML = modes.map(mode => {
        const i = m.picks.findIndex(p => p.mode === mode.id), p = m.picks[i];
        const cls = p ? (p.by ? `by${p.by}` : 'auto') : (done ? 'left' : '');
        return `<div class="tile ${cls}" data-fit="خانة النمط" data-mode="${esc(mode.id)}"><i class="fill"></i><span class="mname">${esc(mode.name)}</span>` +
          (p ? `<span class="chip">${num('الجولة ' + (i + 1))}</span>` : '') + '</div>';
      }).join('');
      // اختيار جديد: الخانة تمتلئ بلون الفريق (القسم 6).
      const made = m.picks.filter(p => p.by);
      if (shownPicks >= 0 && m.picks.length > shownPicks && made.length && !still()) {
        const tile = $('tiles').querySelector(`[data-mode="${CSS.escape(made[made.length - 1].mode)}"]`);
        tile?.classList.add('flash');
      }
    }
    shownPicks = m.step === 'pick' ? m.picks.length : -1;
    if (m.step === 'face') {
      showScreen('face');
      setBadges('المواجهة');
      let n = 0;
      $('track').innerHTML = plan(m).map(s => s.kind === 'wheel'
        ? `<div class="seg wheel" style="--i:${n++}" data-fit="خانة العجلة"><span>شريط</span><span>البونص</span></div>`
        : `<div class="seg ${s.first ? 'by' + s.first : ''}" style="--i:${n++}" data-fit="خانة الجولة"><span class="rn">${num('الجولة ' + s.n)}</span><span class="mname">${esc(modeName(s.mode))}</span></div>`).join('');
      turn = m.winner;
    }
    setTurn(turn);
    // القرعة تقف على الفائز: الحدّ يكتسح إلى طرفه، والخاسر على لسانه.
    setSide(m.step === 'draw' && m.winner ? m.winner : 0);
    renderCtl();
  }

  // ===== اختيار النمط د1 (design/logo/الدمج.md 4): بطاقة لكل نمط كالزر، تنضغط وتمتلئ بلون من اختارها ويُختم عليها رقم جولتها =====
  // على الشبكة 1.2 من اليمين بترتيب الأنماط، والشارة في صندوق 318×200 بحدود رسمها الفعلية (INK بوحدة ارتفاع الملف).
  const CARDS = {
    letter: { svg: 'letter-stack', line: 'كلمة تبدأ بالحرف', pat: 'p-letter', ink: { l: .0133, t: .01, cw: 1.6225, ch: .94 } },
    'last-two': { svg: 'last-two-stack', line: 'كلمة تنتهي بالحرفين', pat: 'p-last', ink: { l: .0335, t: .1925, cw: 1.5225, ch: .75 } },
    auction: { svg: 'auction', line: 'زايِد على عدد الإجابات', pat: 'p-auction', ink: { l: .0022, t: .185, cw: 2.2125, ch: .81 } },
    ranking: { svg: 'ranking', line: 'اذكر الأبعد في القائمة', pat: 'p-rank', ink: { l: .021, t: .0325, cw: 1.5975, ch: .9325 } },
  };
  function cardBadge({ svg, ink: m }) {
    const H = Math.min(200, 318 / (m.cw / m.ch)), ih = H / m.ch, w = m.cw * ih;
    return `<span class="bdg" style="width:${w}px;height:${H}px"><img src="design/logo/modes/${svg}.svg" alt="" style="left:${-m.l * ih}px;top:${-m.t * ih}px;height:${ih}px"${svg === 'ranking' ? ' class="edge"' : ''}></span>`;
  }
  let cardsKey = '';
  // مؤشر الدور للفائز بسطر «يبدأ الإجابة»: تحت لوحة الأول، وفوق لوحة الثاني (فيُقرأ «يبدأ الإجابة [الاسم]»).
  function startsLine(team) {
    $('turnp').hidden = !team;
    $('turnp').className = 'turnp t' + team;
    $('turnName').textContent = team ? name(team) : '';
    $('turnLine').textContent = team ? 'يبدأ الإجابة' : '';
  }
  function pickCards(m, modes, turn) {
    const k = m.picks.length;
    // مؤشر الدور: لوحة صاحب الدور بلونه في جهته، و«يختار نمط الجولة N» تحتها للأول وفوقها للثاني (4.4). ولا مؤشر بعد اكتمال الاختيار.
    $('turnp').hidden = !turn;
    $('turnp').className = 'turnp t' + turn;
    $('turnName').textContent = turn ? name(turn) : '';
    $('turnLine').innerHTML = turn ? num(`يختار نمط الجولة ${k + 1}`) : '';
    const list = modes.filter(x => CARDS[x.id]);
    const html = list.map((mode, i) => {
      const c = CARDS[mode.id], at = m.picks.findIndex(p => p.mode === mode.id), p = m.picks[at];
      // والختم بلون من يبدأ الإجابة في الجولة (design/s8b.md 3.3): المختار في 1–3، والباقية للخاسر في القرعة (st).
      const state = p ? (p.by ? `picked tm${p.by}` : `picked st${starter(m, at + 1)}`) : !m.winner ? 'wait' : (picksDone(m) ? 'left' : 'avail');
      return `<div class="mc ${c.pat} ${state}" data-mode="${esc(mode.id)}" style="left:${96 + (3 - i) * 438}px">`
        + `<div class="face"><div class="in"><div class="ct" data-hud="بطاقة ${esc(mode.name)}" data-free aria-label="${esc(mode.name)}">${cardBadge(c)}<p class="line">${c.line}</p></div></div>`
        + (p ? `<div class="key done"><span>${num('الجولة ' + (at + 1))}</span></div>` : `<div class="key"><span><b class="ltr">${i + 1}</b>اختر</span></div>`) + '</div>'
        + (p ? `<i class="stamp ltr">${at + 1}</i><p class="by" data-hud="سطر من اختار" data-free data-name="${p.by ? esc(name(p.by)) : ''}">${p.by ? 'اختيار ' + esc(name(p.by)) : 'النمط المتبقي'}</p>` : '') + '</div>';
    }).join('');
    if (html !== cardsKey) { cardsKey = html; $('mcards').innerHTML = html; }
    // «اختيار {الفريق}» باسم طويل تحت بطاقة طرفية يُزاح إلى داخل الهامش الآمن (96–1824).
    const c = rect(canvas), s = c.width / 1920 || 1;
    $('mcards').querySelectorAll('.by').forEach(el => {
      el.style.transform = ''; el.classList.remove('tight'); if (el.dataset.name) el.textContent = 'اختيار ' + el.dataset.name;
      const range = document.createRange(); range.selectNodeContents(el);
      // أعرض من بطاقته بفراغ 24 (414 − 24): بخط 32 بدل 36، فإن بقي أعرض فالاسم وحده (البطاقة بلون فريقه)، فلا يمسّ سطر البطاقة المجاورة.
      if (range.getBoundingClientRect().width / s > 390) el.classList.add('tight');
      if (range.getBoundingClientRect().width / s > 390 && el.dataset.name) { el.textContent = el.dataset.name; range.selectNodeContents(el); }
      const r = range.getBoundingClientRect(), x1 = (r.left - c.left) / s, x2 = (r.right - c.left) / s;
      const shift = Math.max(0, 96 - x1) - Math.max(0, x2 - 1824);
      if (shift) el.style.transform = `translateX(calc(-50% + ${shift}px))`;
    });
  }

  // ===== النهاية (ش7، design/final.md 2): النتيجة النهائية ثم الفائز =====
  // الشارة «انتهت المباراة» ولا ثانية. والنتيجة بالحدّ في المنتصف و«التالي» نصاً بلا مربع، والفائز يكتسح إليه الحدّ ويبقى.
  const signed = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v);
  let finKey = '';
  function renderFinal({ match: m, modes }) {
    const modeName = id => modes.find(x => x.id === id)?.name ?? PLANNED.find(x => x.id === id)?.name ?? id;
    if (count && !count.test) stop();
    canvas.classList.remove('pre', 'fresh');
    setHero('');
    $('n1').textContent = name(1); $('n2').textContent = name(2);
    setScore(1, m.scores[1]); setScore(2, m.scores[2]);
    $('mode').textContent = 'انتهت المباراة';
    setArt();
    setBadges();
    setRunning(false);
    setTurn(0);
    const win = m.final?.phase === 'win';
    if (win) {
      showScreen('win');
      $('winSub').textContent = m.final.tb ? 'الفائز بالجولة الفاصلة' : 'الفائز بالمباراة';
      $('champ').className = 'champ t' + m.final.winner;
      $('champ').textContent = name(m.final.winner);
      announce({});
    } else {
      showScreen('fin');
      // المسار بترتيب المباراة من اليمين: خانة لكل جولة باسم نمطها، ولكل شريط «الشريط»، وفيها ما كسبه كل فريق بإشارته.
      // ولا يُعاد بناؤه إن لم يتغيّر، فلا تُعاد حركة دخول خاناته.
      // والجولة الفاصلة خانة ضيقة كالشريط باسم «الفاصلة» في آخره.
      const html = gains(m).map((s, i) => `<div class="seg${s.kind === 'round' ? '' : ' wheel'}" style="--i:${i}" data-fit="${s.kind === 'wheel' ? 'خانة الشريط' : s.kind === 'tiebreak' ? 'خانة الفاصلة' : 'خانة الجولة'}">` +
        `<span class="mname">${s.kind === 'wheel' ? 'الشريط' : s.kind === 'tiebreak' ? 'الفاصلة' : esc(modeName(s.mode))}</span>` +
        `<span class="gains"><b class="g1">${signed(s.g[1])}</b><b class="g2">${signed(s.g[2])}</b></span></div>`).join('');
      if (finKey !== html) { finKey = html; $('finTrack').innerHTML = html; }
      announce({ next: leaderOf(m.scores) ? 'التالي: إعلان الفائز' : 'التالي: الجولة الفاصلة' });
    }
    setSide(win ? m.final.winner : 0);
    renderCtl();
  }
  // القصاصات (design/final.md 4.2): 140 شظية مائلة بالأبيض والأبيض 70% ولون فاتح من لون الفائز، تسقط مرة واحدة ثم تُزال.
  let confettiTimer = 0;
  function confetti(winner) {
    const layer = $('confetti');
    clearTimeout(confettiTimer);
    layer.innerHTML = '';
    const colors = ['#FFFFFF', 'rgba(255,255,255,.7)', `var(--tint-${winner})`];
    for (let i = 0; i < 140; i++) {
      const s = document.createElement('span');
      s.style.setProperty('--x', Math.round(Math.random() * 1920) + 'px');
      s.style.setProperty('--d', (Math.random() * 1.2).toFixed(2) + 's');
      s.style.setProperty('--t', (2.6 + Math.random() * 1.6).toFixed(2) + 's');
      s.style.setProperty('--w', (10 + Math.round(Math.random() * 8)) + 'px');
      s.style.setProperty('--sway', Math.round((Math.random() - .5) * 160) + 'px');
      s.style.setProperty('--c', colors[i % 3]);
      layer.append(s);
    }
    confettiTimer = setTimeout(() => { layer.innerHTML = ''; }, 6000);
  }

  // مربع الحرف أو الحرفين. في «آخر حرفين» التطويل والحرفان في عنصرين للحركة وحدها، والوصل لا ينقطع (design/last-two.md 2.1).
  // ويُصغَّر الحرفان إن زاد عرضهما على 392 (456 دون الحشوة)، ولا يُصغَّران تحت 128. ولا يُعاد بناؤه إن لم يتغيّر، فلا تُعاد حركته.
  function setBox(a) {
    const el = $('letter'), key = (a.tatweel ? 'ـ' : '') + a.letter;
    el.classList.remove('slot', 't1', 't2');
    el.classList.toggle('ending', !!a.tatweel);
    if (el.dataset.key === key) return;
    el.dataset.key = key;
    if (!a.tatweel) { el.textContent = a.letter; el.style.fontSize = ''; return; }
    // العنصران داخل عنصر واحد: لو كانا ابنين مباشرين للمربع (flex) لصار كل منهما كتلة مستقلة وانقطع الوصل.
    el.innerHTML = `<span class="end"><span class="tw">ـ</span><span class="lt">${esc(a.letter)}</span></span>`;
    fitBox();
    // يُعاد القياس بعد تحميل الخط إن لم يكن محمّلاً (عرض الخط البديل غير عرضه).
    document.fonts?.load(`800 152px "Noto Kufi Arabic"`, a.letter).then(fitBox, () => {});
    if (!still()) replay(el, 'in');
  }
  // يُقاس عرض الحرفين بعنصرهما لا بالمربع: ما يفيض من مربع يتوسط محتواه لا يدخل كله في scrollWidth.
  function fitBox() {
    const el = $('letter'), end = el.querySelector('.end');
    el.style.fontSize = '';
    if (!end) return;
    const inner = 456 - 64, w = end.offsetWidth;
    if (w > inner) el.style.fontSize = Math.max(128, Math.floor(152 * inner / w)) + 'px';
  }

  // ===== الجولة (design/letter.md 2 وdesign/shared.md 4): ما تعيده audience() من وحدة النمط، ولا إجابة فيه قبل الحكم الأخير =====
  function renderPlay(p) {
    const a = p.a, sc = p.scores;
    canvas.classList.remove('pre');
    setHero('');
    canvas.classList.toggle('fresh', !!p.fresh);
    $('n1').textContent = name(1); $('n2').textContent = name(2);
    setScore(1, sc[1]); setScore(2, sc[2]);
    $('mode').textContent = p.modeName;
    setArt(p.modeId);

    if (a.screen === 'intro') {
      showScreen('intro');
      $('rule').textContent = a.rule;
      // سطر ثانٍ للقاعدة في الجولة الفاصلة وحدها (design/final.md 2.3)، ولا يوجد في غيرها.
      $('ruleSub')?.remove();
      if (a.sub) $('rule').insertAdjacentHTML('afterend', `<p class="sub" id="ruleSub">${num(a.sub)}</p>`);
      // ولا مفتتح في المزاد (design/auction.md 3.0): «ثلاثة مواضيع» وحدها.
      $('starter').innerHTML = a.turn ? `${esc(a.starter ?? 'يبدأ')} ${tn(a.turn)}` : esc(a.starter ?? '');
      // والجولة الفاصلة: شارة «تعادل» تعلن سببها (design/final.md 2).
      setBadges(a.tiebreak ? 'تعادل' : `الجولة ${p.n} من ${p.total}`);
    } else if (a.screen === 'end') {
      showScreen('end');
      $('e1').textContent = name(1); $('e2').textContent = name(2);
      // حصيلة الجولة بإشارتها: قد تنقص في الترتيب بفخ. وفي العجلة ما تغيّر في رصيد كل فريق فيها (design/wheel.md 2).
      const sign = n => (n < 0 ? '−' + -n : '+' + n);
      $('r1').textContent = sign(a.totals[1]); $('r2').textContent = sign(a.totals[2]);
      setBadges(p.wheel ? 'انتهى الشريط' : `انتهت الجولة ${p.n}`);
    } else if (a.screen === 'wheel') {
      showScreen('whl');
      renderWheel(a);
      setBadges(`الدورة ${a.n} من ${a.count}`);
    } else if (a.screen === 'slot') {
      // بعد الوقوف: شاشة السؤال نفسها، ومربعها الخانة بلون من أدارها لا بالأصفر (design/wheel.md 2.3).
      showScreen('q');
      const el = $('letter');
      el.className = `letter slot t${a.by}`;
      el.innerHTML = `<span>${esc(a.slot.word)}</span><b>${num(a.slot.n)}</b>`;
      el.style.fontSize = '';
      delete el.dataset.key;
      $('label').textContent = a.text;
      setBadges(`الدورة ${a.n} من ${a.count}`);
    } else if (a.screen === 'topic') {
      showScreen('auc');
      renderAuction(a);
      setBadges(`الموضوع ${a.n} من ${a.count}`);
    } else if (a.screen === 'list') {
      showScreen('rnk');
      renderRanking(a);
      setBadges(`القائمة ${a.n} من ${a.count}`);
    } else {
      showScreen('q');
      setBox(a);
      $('label').textContent = a.question;
      setBadges(a.tiebreak ? `المحاولة ${a.attempt}` : `السؤال ${a.n} من ${a.count}`);
    }

    // بعد الحكم الأخير: الحكم والإجابة في مربع الإعلان حتى السؤال التالي. و«التالي» فيه في نهاية الجولة.
    const asking = a.screen === 'ask' || a.screen === 'topic' || a.screen === 'list' || a.screen === 'wheel' || a.screen === 'slot';
    const v = asking ? a.verdict : null;
    announce(a.screen === 'end' ? { next: p.next } : a.screen === 'list' ? rankBox(a) : a.screen === 'wheel' ? {}
      // العجلة: الحكم بلا مربع (design/wheel.md 2 و2.5)، والتحدي بلا وقت (design/s8.md 4).
      // و«خصم» (الأخذ من الخصم): السطر «[الخصم] · −3» بما أُخذ فعلاً، والصفر بلا إشارة (ملاحظة المعاين 38).
      : a.screen === 'slot' ? (v ? { verdict: v, say: v.from ? `${name(v.from)} · ${v.taken ? '−' + v.taken : '0'}` : v.say, bare: true } : {})
      // والجولة الفاصلة: الحكم بلا مربع «[الاسم] · أصاب» و«الإجابة: …» (design/final.md 2.5).
      // وبعد الكشف وقبل الاختيار الإجابة وحدها في المربع (design/s8b.md 2).
      : a.tiebreak ? { verdict: v, answer: a.answer, bare: !!v }
      : { verdict: v, answer: a.answer, told: v && a.tally ? `ذُكر ${a.tally.n} من ${a.tally.of}` : undefined });
    syncTimer(p.timer, a);
    showQR(p.qr);
    setTurn(a.turn);
    // الحدّ يكتسح لصاحب الدور من ظهور سؤاله، في القراءة ثم العدّاد بلا حركة بينهما، وللآخر فوراً إن انتقل إليه (المالك 20:39، design/system.md 15.2).
    // وبعد الحكم يقف على من أخذ النقاط، أو يعود إلى المنتصف إن لم يأخذ أحد. وفي غير شاشة السؤال في المنتصف.
    // والعدّاد يعمل: إطار الوقت حول لوحة صاحب الدور يتآكل، والثواني فيها، والحزم تخفت (.running وحده).
    const running = !!count && !count.test;
    // والعدّاد الظاهر بلا عدّ (design/s8b.md 1.1): الموقوف يثبت رقمه وطول إطاره متقطعاً، ومن انتهى وقته إطاره فارغ ورقمه 0.
    // والعدّ قبل الوقت (lead) بالأبيض: الرقم والإطار.
    const hold = !running && a.screen === 'ask' && !!a.hold;
    setRunning(running || hold);
    canvas.classList.toggle('lead', (running || hold) && !!a.lead);
    canvas.classList.toggle('paused', hold && !!a.paused);
    // وفي المزاد في المنتصف أثناء المزايدة (turn 0)، ثم للملتزم من «ابدأ» (design/auction.md 2، 3.0).
    // والترتيب يقرر حدّه بعد الحكم بنفسه (turn): في المنتصف بعد الفخ وإن كان للحكم صاحب (design/ranking.md 2).
    // والعجلة تقرره بنفسها كذلك: «خصم» في المنتصف وإن كان للشارة صاحب (design/wheel.md 2).
    setSide(!asking ? 0 : v && a.screen !== 'list' && a.screen !== 'slot' ? v.team || 0 : a.turn);
    if (running && count.id !== drained) { drained = count.id; drain(a.turn, (count.endAt - Date.now()) / 1000, a.total ?? p.timer.seconds); }
    if (!running && drained) { drained = 0; drain(0); }
    holdRing(hold ? a.turn : 0, a.paused ? a.clock / a.total : 0);
    renderCtl();
  }
  let drained = 0;

  // ===== شريط البونص (design/wheel.md 2): «يُطلق الشريط: [الاسم]»، ثم الخانات العشر بنوعها ونقاطها، لا بنصوصها =====
  // الخانة مائلة ونصها قائم: الكلمة ثم الرقم. والحظ بإطار متقطع. والمؤشر خانة واحدة بلون من يديرها (.t1 أو .t2).
  function renderWheel(a) {
    $('whead').textContent = 'يُطلق الشريط: ' + name(a.by);
    const key = a.slots.map(x => x.kind + x.word + x.n).join('|');
    if ($('band').dataset.key !== key) {
      $('band').dataset.key = key;
      $('band').innerHTML = a.slots.map((x, i) => `<p class="ws${x.kind === 'luck' ? ' luck' : ''}" data-fit="خانة ${i + 1}"><span>${esc(x.word)}</span><b>${num(x.n)}</b></p>`).join('');
    }
    if (a.spin) spinBand(a.spin, a.by);
    else { spinAt = 0; clearTimeout(spinTimer); light(-1, 0, false); }
  }
  // المؤشر على الخانة i بلون من يديرها، و.stop عند الوقوف (لحظة انفعالية: الإطار ينبض ثلاثاً والخانة تكبر، wheel.css 5).
  const light = (i, by, stop) => [...$('band').children].forEach((c, k) => {
    c.classList.toggle('t1', k === i && by === 1); c.classList.toggle('t2', k === i && by === 2); c.classList.toggle('stop', k === i && stop);
  });
  // الدوران (design/wheel.md 2.4): المؤشر ينتقل خانةً خانة من اليمين، ثلاث دورات ثم إلى خانة الوقوف، وكل خطوة أبطأ من التي قبلها،
  // ونقرة صوت مع كل خطوة. يبدأ من «at» بساعة الجهاز، فيكمل من حيث بلغ إن أُعيد تحميل الشاشة، ويقف فوراً إن انقضى وقته.
  // وتقليل الحركة: المؤشر على خانة الوقوف مباشرة بلا دوران.
  let spinAt = 0, spinTimer = 0;
  function spinBand({ stop, at }, by) {
    if (spinAt === at) return;
    spinAt = at; clearTimeout(spinTimer);
    const steps = spinSteps(stop);
    let i = 0, t = at;
    while (i < steps.length && t + steps[i] <= Date.now()) t += steps[i++];
    const landed = i >= steps.length;
    if (landed || still()) return light(stop, by, true);
    const step = () => {
      if (i >= steps.length) {
        light(stop, by, true);
        canvas.classList.remove('anim'); void canvas.offsetWidth; canvas.classList.add('anim');
        surge(); sound('stop');
        return;
      }
      light(i % 10, by, false);
      sound('spin');
      const wait = t + steps[i] - Date.now();
      t += steps[i++];
      spinTimer = setTimeout(step, Math.max(0, wait));
    };
    step();
  }

  // ===== المزاد (design/auction.md 2): الموضوع، ورقما الفريقين كلٌّ بلونه والأعلى أكبرهما (3.0)، ومن الالتزام العدّ =====
  // باركود الإجابات (design/s8.md 2): الوعاء يمين البطاقة والبطاقة تضيق، ومربع الإعلان لا يظهر معه.
  // يُرسم من جديد حين يتغير النص وحده. والصفحة تحفظ آخر ما رُسم للفحص (dataset.bytes و.unit).
  let qrText = null;
  // وإن زاد النص عمّا يسعه الرمز (قائمة كبيرة جداً) لم يُرسم، وبقيت البطاقة كاملة دونه، فلا تتعطل اللعبة (design/auction.md 7.10 لم يُقرّ بعد).
  let qrFailed = null;
  function showQR(text) {
    if (text && text !== qrText && text !== qrFailed) {
      try {
        const info = drawQR($('qrbox').querySelector('canvas'), text);
        Object.assign($('qrbox').dataset, { bytes: info.bytes, unit: info.unit, modules: info.modules });
        qrText = text;
      } catch { qrFailed = text; }
    }
    canvas.classList.toggle('qr', !!text && text !== qrFailed);
  }
  function renderAuction(a) {
    // لا عدد للقائمة على الشاشة أبداً (design/auction.md 4.0).
    $('topic').textContent = a.topic;
    const bids = a.phase === 'bid' ? a.bids : [];
    $('bids').innerHTML = bids.map(b => `<span class="bid t${b.team}${b.top ? ' top' : ''}"><i></i><span>${num(b.n)}</span></span>`).join('');
    const t = a.tally;
    $('tally').hidden = !t;
    if (t) { $('tn').textContent = t.n; $('tof').textContent = t.of; $('tally').className = `tally t${t.team}`; }
    // ما ذُكر بلون من ذكره، والأحدث يظهر بحركته. وبعد الحكم يبقى ما قيل وحده، لا القائمة (design/auction.md 4.0).
    // وما احتُسب دون اسم («صحيحة · +1») لا شارة له، ويدخل بعد الحكم «و N غيرها» (4.1). وفي النافذة الواحدة لا أسماء، فتبقى البطاقة على الموضوع.
    const reveal = !!a.reveal;
    $('auc').classList.toggle('reveal', reveal);
    const it = (x, cls) => `<span class="it ${cls}"><i></i><span>${esc(x.name)}</span></span>`;
    const said = a.said ?? [];
    const counted = t?.n ?? 0, fresh = !reveal && counted > shownSaid;
    const named = fresh && said.length > shownNamed;
    shownSaid = counted; shownNamed = said.length;
    $('items').innerHTML = said.map((x, i) => it(x, `t${x.team}${named && i === said.length - 1 ? ' new' : ''}`)).join('');
    // بعد الحكم: القائمة القصيرة بشارات المزايدة الكبيرة إن اتسعت كلها في صفين، وإلا فبالحجم المعتاد (design/auction.md 7.6)
    $('auc').classList.toggle('big', reveal);
    if (reveal && !fitsAll($('items'))) $('auc').classList.remove('big');
    fitItems($('items'), reveal, reveal ? a.plain ?? 0 : 0);
    if (fresh) replay($('tally'), 'bump');
  }
  let shownSaid = 0, shownNamed = 0;

  // ===== الترتيب (design/ranking.md 2): العنوان وإشارته، واللوحة: 13 خانة بالترتيب، وgrid-auto-flow يضعها في أعمدتها =====
  // الخانة المنتظرة رتبتها وحدها · المكشوفة بلون من ذكرها واسمها · الفخاخ ظاهرة الأرقام بلا اسم، والمكشوف منها رقمه خصمه «−13» (design/s8.md 3.1)
  // · وبعد نهاية القائمة ما لم يُذكر باسمه (.left)، و.reveal على القسم (المكشوفة بيضاء بإطار لونها، 1.1).
  let shownFresh = '';
  // وقت القائمة (design/ranking.md 7.8): «بقي للقائمة» تحت الفخاخ، 5:00 قبل «ابدأ» ثم يجري حتى listEnds بساعة الجهاز، ويُخفى بعد النهاية.
  let listEnds = null;
  const listText = () => format(Math.max(0, Math.ceil((listEnds - Date.now()) / 1000)));
  setInterval(() => { const el = document.querySelector('.scr.rnk.show #rclock b'); if (el && listEnds && el.textContent !== listText()) el.textContent = listText(); }, 250);
  function renderRanking(a) {
    // العنوان على أول « · »: ما قبله سطر 64، وما بعده إشارة 32 بجانبه (التاريخ غالباً). وبلا « · » لا إشارة (design/ranking.md 7.3).
    const at = a.title.indexOf(' · ');
    $('rtitle').textContent = at < 0 ? a.title : a.title.slice(0, at);
    $('rsub').innerHTML = at < 0 ? '' : num(a.title.slice(at + 3));
    // الخانة التي كُشفت الآن تتحرك مرة واحدة: لا تُعاد حركتها بإعادة رسم الحالة نفسها.
    const key = `${a.n}/${a.fresh}/${a.slots.filter(x => x.team).length}`;
    const fresh = a.fresh && key !== shownFresh ? a.fresh : 0;
    shownFresh = key;
    $('board').innerHTML = a.slots.map(x => {
      const cls = ['sl', x.trap && 'trap', x.team && 't' + x.team, !x.team && x.name && 'left', x.rank === fresh && 'new'].filter(Boolean).join(' ');
      return `<p class="${cls}" data-r="${x.rank}"><b>${x.trap && x.team ? '−' + x.rank : x.rank}</b>${x.name ? `<span data-fit="خانة ${x.rank}">${esc(x.name)}</span>` : ''}</p>`;
    }).join('') + (a.listClock ? `<p class="clock" id="rclock"><span>بقي للقائمة</span><b>${a.listEnds ? '' : format(a.listSeconds)}</b></p>` : '');
    listEnds = a.listEnds ?? null;
    if (listEnds) $('rclock').querySelector('b').textContent = listText();
  }
  // مربع الإعلان في الترتيب: الحكم بالمربع («[الاسم] · +7» و«المركز 7»)، و«لا نقاط» و«لم تُكشف خانة».
  // ونهاية القائمة بلا مربع: «كُشف 7 من 10» (design/ranking.md 7.6).
  function rankBox(a) {
    if (a.phase === 'listend') return { next: `${a.timeup ? 'انتهى وقت القائمة\n' : ''}كُشف ${a.found} من ${a.of}` };
    // والإصابة لحظتها بالمربع وحدها، ثم يُخفى حين يبدأ الدور التالي. و«خطأ» بلا مربع: «لا نقاط» و«لم تُكشف خانة» (design/s8.md 3.2).
    const v = a.verdict;
    if (!v) return {};
    return { verdict: v, say: !v.team ? 'لم تُكشف خانة' : v.rank > 10 ? `فخّ المركز ${v.rank}` : `المركز ${v.rank}`, bare: !v.team };
  }
  // ما ذُكر: أثناء العدّ يبقى الأحدث (يسقط الأقدم). وبعد الحكم يبقى أوله، وفي آخره «و N غيرها» مع ما احتُسب دون اسم
  // (design/auction.md 4.0 و4.1، fitItems في design/auction.html).
  const fitsAll = box => !box.lastElementChild || rect(box.lastElementChild).bottom <= rect(box).bottom + 1;
  // plain (4.1): ما احتُسب بالزر دون اسم، فيدخل «و N غيرها» من أوله. وإن لم يكن لشيء اسم فالبطاقة على الموضوع وحده.
  function fitItems(box, reveal, plain = 0) {
    const all = [...box.children];
    if (!all.length) return;
    const fits = () => !box.lastElementChild || rect(box.lastElementChild).bottom <= rect(box).bottom + 1;
    if (fits() && !plain) return;
    if (!reveal) { while (!fits() && box.firstElementChild) box.firstElementChild.remove(); return; }
    const more = document.createElement('span'); more.className = 'it more'; box.append(more);
    let hidden = plain;
    const say = () => { more.innerHTML = `<span>و <span class="ltr">${hidden}</span> غيرها</span>`; };
    say();
    while (!fits() && all.length) { all.pop().remove(); hidden++; say(); }
  }

  // ===== أزرار الشاشة المشتركة (design/shared.md 3): المقدّم يقرر ما يظهر (ctl)، وهنا موضعه =====
  // ctl: { card, near, ans («كشف الإجابة» أسفل اليمين، design/s8b.md 1.3), a, b, c: أزرار (c الصف الثالث في الجولة) · count: خانتا العدد · names: اللوحتان حقلان · pick: الخانات تُنقر · scores · error }
  // والزر { cmd, label, kind: '' | 'alt' | 'no', off }. يصل من النافذة التي تحتوي هذه الشاشة وحدها، فلا يظهر في نافذة الجمهور.
  let ctl = null, moreOpen = false;
  // الأيقونات (design/s8b.md 7.1، design/s8b-corner.js): 36 في مربع 64، والاسم يظهر عند المرور (data-tip) ولقارئ الشاشة. و«⋯» نقاط .opt المبنية.
  const ICON = {
    'تراجع': '<path d="M14 10 6 18l8 8"/><path d="M6 18h16a8 8 0 0 1 0 16h-6"/>',
    'الصوت': '<path d="M5 14h6l8-7v22l-8-7H5z"/><path d="M25 12a9 9 0 0 1 0 12"/><path d="M29 8a14 14 0 0 1 0 20"/>',
    'مكتوم': '<path d="M5 14h6l8-7v22l-8-7H5z"/><path d="m24 13 8 10M32 13l-8 10"/>',
    'ملء الشاشة': '<path d="M5 13V5h8M23 5h8v8M31 23v8h-8M13 31H5v-8"/>',
    'الباركود': '<rect x="5" y="5" width="10" height="10"/><rect x="21" y="5" width="10" height="10"/><rect x="5" y="21" width="10" height="10"/><path d="M21 21h4v4h-4zM29 29h2M25 29v2M29 21v4"/>',
    'الرصيد': '<path d="M8 30V18M18 30V8M28 30V14"/>',
    'مباراة جديدة': '<path d="M18 7v22M7 18h22"/>',
  };
  let showTip = () => {}, pointer = null;
  const iconic = b => b.icon || b.cmd === 'more';
  const button = b => `<button class="cbtn${b.kind ? ' ' + b.kind : ''}${iconic(b) ? ' ico' : ''}${b.cmd === 'more' && moreOpen ? ' open' : ''}${b.off ? ' off' : ''}" data-cmd="${esc(b.cmd)}"`
    + (iconic(b) ? ` aria-label="${esc(b.label)}" data-tip="${esc(b.label)}">${b.icon ? `<svg viewBox="0 0 36 36" aria-hidden="true">${ICON[b.label] ?? ''}</svg>` : ''}` : `>${b.html ?? num(b.label)}`) + '</button>';
  const rows = list => (list ?? []).map(r => `<div class="ctl">${r.map(button).join('')}</div>`).join('');
  // الأزرار لا تُستبدل إن لم يتغير ما فيها: ضغطة تقع بين نزول الإصبع ورفعه على زر استُبدل لا تصل (ش8-أ/54، عدّ المزاد السريع).
  const drawn = new WeakMap();
  const put = (el, html) => { if (drawn.get(el) !== html) { drawn.set(el, html); el.innerHTML = html; } };
  function renderCtl() {
    const c = embed && view ? ctl : null;
    if (!c?.more) moreOpen = false;
    $('ctlTip')?.remove();
    canvas.classList.toggle('editing', !!c?.names);
    // أزرار البطاقة في الشاشة الظاهرة وحدها.
    // وفي شاشتي البداية والاختيار لا بطاقة: زر «ابدأ» تحت الشعار، وأزرار الاختيار تحت البطاقات (design/logo/الدمج.md 3 و4.1).
    const hero = canvas.dataset.hero, inCard = hero !== 'start' && hero !== 'pick';
    document.querySelectorAll('.card .ctl').forEach(el => put(el, inCard && el.closest('.scr').classList.contains('show') ? (c?.card ?? []).map(button).join('') : ''));
    $('startGo').innerHTML = hero === 'start' ? (c?.card ?? []).map(button).join('') : '';
    $('pickCtl').innerHTML = hero === 'pick' ? (c?.card ?? []).map(button).join('') : '';
    put($('near'), (c?.near ?? []).map(button).join(''));
    put($('ansCtl'), (c?.ans ?? []).map(button).join(''));
    put($('cornerA'), rows(c?.a));
    put($('cornerB'), rows(c?.b));
    put($('cornerC'), rows(c?.c));
    // لوحة «⋯» (design/s8b.md 7.1): حالتها في هذه الشاشة وحدها. سطر الأيقونات، ثم فاصل، ثم «مباراة جديدة» وحدها.
    const fresh = (c?.more ?? []).filter(b => b.cmd === 'new'), rest = (c?.more ?? []).filter(b => b.cmd !== 'new');
    $('moreMenu').innerHTML = moreOpen ? `<div class="ctl">${rest.map(button).join('')}</div>` + (fresh.length ? `<hr><div class="ctl">${fresh.map(button).join('')}</div>` : '') : '';
    $('moreMenu').hidden = !moreOpen;
    canvas.classList.toggle('more-open', moreOpen);
    // النافذة الواحدة: صفّا أزرار الزاويتين مكان الشعار (1.3).
    canvas.classList.toggle('has-a', ['cornerA', 'cornerB', 'cornerC'].some(id => $(id).children.length));
    placeBadges();   // الشارة المرسومة تصغر بنافذة واحدة (has-a)، فيتغير موضع ما بعدها
    $('count').innerHTML = c?.count ? '<span class="lbl">عدد الأنماط</span>' + [['short', 2], ['full', 4]].map(([m, k]) =>
      `<button class="ctile${c.count.value === m ? ' sel' : ''}${k === 4 && !c.count.four ? ' off' : ''}" data-cmd="count:${m}"><span class="ltr">${k}</span></button>`).join('') : '';
    for (const id of ['err', 'faceErr']) { $(id).hidden = !c?.error; $(id).textContent = c?.error ?? ''; }
    document.querySelector('.scr.title .sub').hidden = !!c;
    $('guide').hidden = !c?.count;
    // التحكيم المباشر في الترتيب (design/s8.md 3.2): في الإجابة رقم كل خانة لم تنكشف زرٌّ يحكم بها.
    $('rnk').classList.toggle('judge', !!c?.judge);
    $('board').querySelectorAll('.sl[data-r]').forEach(el => { if (c?.judge && !el.classList.contains('t1') && !el.classList.contains('t2')) el.dataset.cmd = 'act:item:' + el.dataset.r; else delete el.dataset.cmd; });
    $('mcards').querySelectorAll('.mc').forEach(t => { if (c?.pick && t.classList.contains('avail')) t.dataset.cmd = 'pick:' + t.dataset.mode; else delete t.dataset.cmd; });
    $('tiles').querySelectorAll('.tile').forEach(t => { if (c?.pick && !t.classList.contains('by1') && !t.classList.contains('by2') && !t.classList.contains('auto') && !t.classList.contains('left')) t.dataset.cmd = 'pick:' + t.dataset.mode; else delete t.dataset.cmd; });
    for (const k of [1, 2]) {
      if (c?.scores) $('s' + k).dataset.cmd = 'scores'; else delete $('s' + k).dataset.cmd;
      // الحقل الذي يُكتب فيه لا يُستبدل بما يعود من المقدّم، فلا يضيع حرف في الكتابة السريعة.
      const input = $('i' + k), value = view?.match.teams[k] ?? '';
      if (c?.names && input.value !== value && document.activeElement !== input) input.value = value;
    }
    placeNear();
    if (pointer) showTip(document.elementFromPoint(pointer.x, pointer.y));
  }
  // أزرار العدّاد والحكم في صف الشارات (1.3): تنتهي قبل أول شارة بـ 32، أي 24 بعد ميلها (ارتفاع 64 × ظل 14° ÷ 2 = 8).
  function placeNear() {
    const near = $('near'), badges = [...document.querySelectorAll('.badge')].filter(b => b.getClientRects().length);
    if (!near.children.length || !badges.length) return;
    // بحدود الشارة الفعلية لا offsetLeft: يُقرَّب كسر الميل فيصير الفراغ 23 (design/auction.md 7.5). والقياس على مقاس 1920.
    const c = rect(canvas), k = c.width / 1920 || 1;
    near.style.left = Math.floor(Math.min(...badges.map(b => (rect(b).left - c.left) / k)) - 32 - rect(near).width / k) + 'px';
  }
  const send = (cmd, data = {}) => parent.postMessage({ bc: 'cmd', cmd, ...data }, location.origin);
  if (embed) {
    addEventListener('message', e => {
      if (e.origin !== location.origin || e.source !== parent || e.data?.bc !== 'ctl') return;
      ctl = e.data.ctl;
      renderCtl();
    });
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-cmd]');
      // لوحة «⋯» تُفتح وتُغلق هنا، وتُغلق باختيار زر فيها أو بنقرة خارجها (design/s8b.md 7.1).
      if (b?.dataset.cmd === 'more') { moreOpen = !moreOpen; renderCtl(); return; }
      if (moreOpen && (!e.target.closest('#moreMenu') || b)) { moreOpen = false; renderCtl(); }
      if (!b || b.classList.contains('off') || !ctl) return;
      send(b.dataset.cmd);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && moreOpen) { moreOpen = false; renderCtl(); } });
    // الاسم عند المرور (design/s8b.md 7.1–7.2): في الزاوية عنصر مستقل تحت الأيقونة بـ 24 (data-hud)، وفي لوحة «⋯» ابنٌ لها
    // بجانب الأيقونة بـ 16 داخل سطرها، بلا data-hud، فيقيسه check.js مع اللوحة.
    // وإعادة رسم الأزرار (بدء العدّاد، أو انتهاء التعطيل بعد النقر) تمحو الاسم والفأرة ثابتة، فيُعاد لما تحتها (ملاحظة المعاين بعد v62).
    showTip = el => {
      const b = el?.closest('.cbtn.ico[data-tip]'), old = $('ctlTip');
      if (old && old.dataset.for === b?.dataset.cmd) return;
      old?.remove();
      const pan = b?.closest('#moreMenu');
      if (!b || (moreOpen && !pan)) return;
      const tip = document.createElement('div'); tip.id = 'ctlTip'; tip.className = 'ctl-tip'; tip.dataset.for = b.dataset.cmd; tip.textContent = b.dataset.tip;
      if (pan) { pan.append(tip); tip.style.top = b.offsetTop + 'px'; tip.style.left = Math.max(0, b.offsetLeft - 16 - tip.offsetWidth) + 'px'; }
      else {
        const c = rect(canvas), k = c.width / 1920 || 1, r = rect(b);
        tip.dataset.hud = 'اسم الزر'; canvas.append(tip);
        tip.style.left = (r.left - c.left) / k + 'px'; tip.style.top = (r.bottom - c.top) / k + 24 + 'px';
      }
    };
    document.addEventListener('mouseover', e => showTip(e.target));
    document.addEventListener('mousemove', e => { pointer = { x: e.clientX, y: e.clientY }; });
    document.documentElement.addEventListener('mouseleave', () => { pointer = null; });
    // الاسمان يُكتبان في اللوحتين. Enter في الأول ينقل إلى الثاني، وفي الثاني = «ابدأ القرعة».
    for (const k of [1, 2]) {
      // الأرقام الهندية تصير إنجليزية في الحقل نفسه وهو يُكتب (القاعدة: أرقام إنجليزية في كل شاشة).
      $('i' + k).addEventListener('input', e => {
        const el = e.target, v = el.value.replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 0x0660).replace(/[\u06F0-\u06F9]/g, d => d.charCodeAt(0) - 0x06F0);
        if (v !== el.value) { const at = el.selectionStart; el.value = v; el.setSelectionRange(at, at); }
        send('teams', { a: $('i1').value, b: $('i2').value });
      });
      $('i' + k).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); k === 1 ? $('i2').focus() : send('draw'); } });
    }
    parent.postMessage({ bc: 'need-ctl' }, location.origin);
  }

  // ===== لحظات الحركة (design/start.md وdesign/letter.md، القسم 6). الحالة محسومة قبلها، والحركة عرض فقط =====
  let timers = [];
  const later = (ms, f) => timers.push(setTimeout(f, ms));
  const DRAW_STEPS = [90, 90, 100, 110, 120, 140, 160, 190, 230, 280, 340, 420];
  function animate(name) {
    timers.forEach(clearTimeout); timers = []; busy = false;
    canvas.classList.remove('enter', 'anim', 'drawing'); void canvas.offsetWidth;
    // مؤثر الفوز مع وصول الحدّ إلى الفائز، وفي تقليل الحركة فوراً (لا قصاصات ولا لمعة، design/final.md 4.2).
    const won = name === 'win' && view?.match.step === 'final' && view.match.final?.phase === 'win' ? view.match.final.winner : 0;
    if (won && still()) sound('win');
    if (!view || still()) return render();
    canvas.classList.add('anim');
    const winner = view.match.winner;
    if (name === 'draw' && winner) {
      // في صفحة الاختيار (design/s8b.md 3.2): مؤشر الدور يتنقل بين جهتي الفريقين والبطاقات تنتظر، ثم يقف على الفائز.
      render(); busy = true; canvas.classList.add('drawing');
      // يتنقل المؤشر 12 مرة ويتباطأ، فيقف على الفائز في آخر خطوة. والحدّ يتأرجح معه.
      let t = DRAW_STEPS.length % 2 === 0 ? other(winner) : winner, at = 0;
      const wait = () => { cardsKey = ''; $('mcards').querySelectorAll('.mc.avail').forEach(c => { c.classList.remove('avail'); c.classList.add('wait'); }); };
      wait();
      DRAW_STEPS.forEach(ms => { at += ms; const who = t; later(at, () => { startsLine(who); $('turnLine').textContent = ''; wait(); setSide(who); }); t = other(t); });
      later(at + 420, () => { busy = false; canvas.classList.remove('drawing'); render(); bump(winner); });
    }
    // النتيجة النهائية: خانات المسار تدخل واحدة بعد الأخرى ثم رقماها (.anim .fin في css/final.css).
    if (name === 'fin') { finKey = ''; render(); }
    // إعلان الفائز (الذروة): الحدّ يكتسح إليه ويبقى، والحزم تندفع. وعند وصوله (760ms): القصاصات، ونبض رقمه، ومؤثر الفوز.
    // والاسم يدخل بلمعته من CSS (.anim .scr.win .champ).
    if (won) {
      render(); surge();
      later(760, () => { confetti(won); moment(won, 'lead'); sound('win'); });
    }
    if (name === 'face' && view.match.step === 'face') {
      render(); canvas.classList.add('enter'); setTurn(0); busy = true;
      // بعد آخر خانة: تُرفع الحركة قبل العرض، فلا تبدأ خانات المسار من جديد.
      later(1000 + $('track').children.length * 120 + 200, () => { busy = false; canvas.classList.remove('enter'); render(); bump(winner); });
    }
  }

  // لحظات الجولة: تصل مع الحالة الجديدة بعد كل فعل. prev: الحالة قبلها (للرصيد قبل الزيادة).
  let shownKey = '';
  function roundMoments(moments, prev) {
    const p = view.play, a = p.a;
    const key = `${p.n}/${a.screen}/${a.n ?? ''}`;
    const changed = key !== shownKey;
    shownKey = key;
    // شاشة الخانة باقية بعد الحكم: لا يدخل مربعها من جديد مع حركة الحكم (chipin، wheel.css 5).
    const settle = () => { if (!changed && a.screen === 'slot') $('letter').getAnimations().forEach(x => x.finish()); };
    for (const m of moments) if (m.name === 'right' || m.name === 'hit') sound('right'); else if (m.name === 'miss') sound('wrong'); else if (m.name === 'trap' || ((m.name === 'steal' || m.name === 'fail') && m.reason === 'wrong')) sound('wrong');
    if (still() || (!moments.length && !changed)) return;
    canvas.classList.remove('anim'); void canvas.offsetWidth; canvas.classList.add('anim');
    settle();
    for (const m of moments) {
      if (m.name === 'right' && prev) {
        // صحيحة: مربع الإعلان يُمسح من اليمين، والحزم تندفع، وبعد 250ms يزيد الرقم الكبير وتنبض لوحة الكاسب.
        const w = m.team, to = p.scores[w];
        setScore(w, prev.scores[w]); surge();
        // جهة الكاسب تومض: الحدّ عنده غالباً من قبل، فلا تكفي ومضة الوصول.
        replay($('stagebg').querySelector('.f' + w), 'blink');
        later(250, () => { setScore(w, to); bump(w); moment(w, 'gain'); });
      }
      // المزاد، لم يفِ الملتزم (design/auction.md 2.5، 2.0): البطاقة تهتز، ثم يكتسح الحدّ إلى الخصم ويزيد رقمه بنقطتيه.
      if (m.name === 'fail' && prev) {
        const w = m.team, to = p.scores[w];
        setScore(w, prev.scores[w]); replay($('cardWrap'), 'shake'); setTurn(0);
        later(240, () => { replay($('shine'), 'go'); setTurn(w); setScore(w, to); bump(w); moment(w, 'gain'); });
      }
      // الترتيب، فخ (design/ranking.md 2.5): البطاقة تهتز والحدّ في المنتصف، ثم ينقص رقم من وقع فيه بما خُصم ويخفت.
      if (m.name === 'trap' && prev) {
        const w = m.team, to = p.scores[w];
        setScore(w, prev.scores[w]); replay($('cardWrap'), 'shake'); setTurn(0);
        later(480, () => { setScore(w, to); moment(w, 'lose'); });
      }
      // «خصم» (الأخذ من الخصم) في الشريط: رقم من أُخذ منه ينقص ويخفت مع زيادة رقم من أدارها (design/wheel.md 2.4).
      if (m.name === 'taken' && prev) {
        const w = m.team, to = p.scores[w];
        setScore(w, prev.scores[w]);
        later(250, () => { setScore(w, to); moment(w, 'lose'); });
      }
      // الجولة الفاصلة: «أصاب» تومض جهته والحزم تندفع، ولوحته تنبض. و«لم يُصب» تهتز البطاقة والحدّ إلى المنتصف (design/final.md 4.3).
      if (m.name === 'hit') { surge(); replay($('stagebg').querySelector('.f' + m.team), 'blink'); bump(m.team); }
      if (m.name === 'miss') replay($('cardWrap'), 'shake');
      if (m.name === 'lead') later(700, () => { moment(m.team, 'lead'); moment(other(m.team), 'lose'); });
      if (m.name === 'steal') {
        // انتقال الإجابة (السرقة): البطاقة تهتز إن كانت خاطئة، ثم لمعة، والمؤشر يقفز إلى الخصم. لا شارة ولا كلمة «سرقة». العدّاد لا ينتظر الحركة.
        const go = () => { replay($('shine'), 'go'); bump(m.team); setTurn(m.team); };
        // وفي المزاد تهتز أيضاً حين انتهى وقت الملتزم (shake، design/auction.md 2.5).
        if (m.reason === 'wrong' || m.shake) { replay($('cardWrap'), 'shake'); setTurn(0); later(240, go); } else go();
      }
    }
    // نهاية الجولة: رقم المتقدّم الكبير ينبض، ويخفت رقم الآخر، ولا يتحرك شيء إن تعادلا.
    if (changed && a.screen === 'end' && a.totals) {
      const s = p.scores, lead = s[1] > s[2] ? 1 : s[2] > s[1] ? 2 : 0;
      if (lead) { moment(lead, 'lead'); moment(other(lead), 'lose'); }
    }
  }

  // ===== العدّاد: نافذة الجمهور هي التي تعدّ الثواني بنفسها بعد أمر «ابدأ» =====
  // count: { id, endAt } لعدّاد الجولة (endAt بساعة الجهاز نفسه، فيعود صحيحاً بعد إعادة التحميل)، أو { test } لعدّاد ش0 التجريبي.
  // mmss: الثواني في اللوحة «1:42» لا «102» (تحدي العجلة دقيقتان، design/wheel.md 7.4)، في <span class="ltr">.
  let count = null, ticker = 0, lastText = '', lastLeft = -1, expired = 0, mmss = false;
  const format = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const show = seconds => {
    const text = format(seconds);
    $('timer').textContent = text;
    // الجمهور يرى الثواني وحدها في لوحة صاحب الدور (1.3)، وفي عدّاد ش0 التجريبي في البطاقة.
    if (mmss) $('c1').innerHTML = $('c2').innerHTML = `<span class="ltr">${text}</span>`;
    else $('c1').textContent = $('c2').textContent = String(seconds);
    if (count?.test) $('label').textContent = `العدّاد يعمل · ${text}`;
    if (text !== lastText) { lastText = text; link.send('tick', { text }); }
  };
  // يقف العدّاد: إطار الوقت يثبت حيث بلغ، والحزم تعود إلى سرعة القراءة.
  const stop = () => {
    clearInterval(ticker); ticker = 0; count = null; lastLeft = -1; setDanger(false); setRunning(false);
    drainAnim?.pause();
  };
  const run = () => {
    const left = Math.max(0, Math.ceil((count.endAt - Date.now()) / 1000));
    show(left);
    // والنبض وصوت الثواني لوقت الإجابة وحده، لا للعدّ قبل الوقت (design/s8b.md 1.1).
    const last3 = left > 0 && left <= 3 && !count.lead;
    setDanger(last3);
    if (!count.test) speed(last3 ? 3.5 : 2.2);
    if (left !== lastLeft && last3) sound('tick');
    lastLeft = left;
    if (left > 0) return;
    const done = count;
    stop();
    if (done.test) $('label').textContent = 'انتهى الوقت';
    else { expired = done.id; link.send('timeout', { id: done.id }); }
  };
  const begin = c => { stop(); count = c; run(); if (count) ticker = setInterval(run, 100); };
  function syncTimer(t, a) {
    mmss = !!a?.mmss;
    if (t && t.id !== count?.id && t.id !== expired) return begin({ id: t.id, endAt: t.at + t.seconds * 1000, lead: !!t.lead });
    if (!t && count && !count.test) stop();
    if (!count) show(a?.clock ?? 0);
  }

  const waiting = () => { stop(); canvas.classList.remove('qr'); setLocked(true); setHero('wait', 'بانتظار المقدّم'); canvas.classList.add('pre'); setTurn(0); setSide(0); showScreen('q'); $('letter').textContent = ''; delete $('letter').dataset.key; $('letter').classList.remove('ending'); $('label').textContent = 'نافذة الجمهور · بانتظار المقدّم'; };
  const ready = () => {
    if (count) stop();
    setLocked(false); show(10);
    if (view) render();
    else { canvas.classList.add('pre'); setHero('wait', 'بانتظار المقدّم'); showScreen('q'); $('label').textContent = 'نافذة الجمهور · متصلة'; }
  };

  // ?check: صفحة فحص ثابتة، لا تتبع المقدّم وإن كان مفتوحاً.
  const checking = query.has('check');
  const link = createLink('audience', (type, data) => {
    if (checking) return;
    if (type === 'view') {
      const prev = view?.play;
      view = data;
      setMuted(data.muted);
      if (count?.test) return;
      // في الجولة: كل حالة جديدة تقطع ما بقي من حركة سابقة (المواجهة مثلاً)، فتظهر فوراً.
      if (data.play && data.match.step === 'play') { timers.forEach(clearTimeout); timers = []; busy = false; canvas.classList.remove('enter'); }
      setLocked(false); render();
      if (data.play && data.match.step === 'play') roundMoments(data.moments ?? [], prev);
    }
    if (type === 'anim') { if (data.view) view = data.view; if (!count?.test) { setLocked(false); animate(data.name); } }
    // أُغلقت اللعبة لتغيّر الرقم السري: لا يبقى على شاشة الجمهور شيء من اللعب.
    if (type === 'lock') { view = null; waiting(); }
    if (type === 'unlock') ready();
  });
  link.onStatus(on => {
    if (checking) return;
    if (!count && on) ready();
    if (!count && !on) waiting();
    // اتصلت بالصفحة التي تضمّها (أو عادت بعد إعادة تحميل): تطلب حالة المباراة.
    if (on) { link.send('tick', { text: $('timer').textContent }); link.send('need-view'); }
  });

  $('fs').onclick = () => document.documentElement.requestFullscreen?.();
  // يختفي الزر إن ملأت النافذة الشاشة بأي طريقة (زر Mac الأخضر مثلاً)، أو بعد 3 ثوانٍ من سكون الفأرة،
  // ويعود مع حركتها (ملاحظة المعاين 3 في ش1 و2 في ش2).
  const filled = () => document.body.classList.toggle('filled', innerWidth >= screen.width - 1 && innerHeight >= screen.height - 1);
  let idle = 0;
  const wakeMouse = () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 3000); };
  addEventListener('resize', filled);
  addEventListener('pointermove', wakeMouse);
  filled(); wakeMouse();

  // ?check في الرابط: فحص التداخل كما في design/main.html. ويعرض الهيكل كاملاً دون انتظار المقدّم.
  if (checking) {
    const { checkLayout } = await import('./js/layout-check.js');
    const layer = document.createElement('div');
    layer.className = 'check-layer';
    layer.innerHTML = '<div class="safe"></div>';
    canvas.appendChild(layer);
    setLocked(false);
    canvas.classList.remove('pre');
    await document.fonts.ready;
    window.__check = checkLayout(canvas, layer);
  }

  // للاختبار: فحص التداخل على الشاشة الحالية (js/stage-check.js، من design/check.js).
  window.__stageCheck = async () => {
    const { layoutCheck } = await import('./js/stage-check.js');
    await document.fonts.ready;
    // يُفحص ما يستقر على الشاشة لا لحظة عابرة: تنتظر الحركات القصيرة (نبضة اللوحة 450ms مثلاً، وهي تكبّرها 6%).
    // وحركات المكوّنات وحدها: المسرح خارج الفحص، والحزم بلا نهاية، وتآكل إطار الوقت بطول العدّاد.
    await Promise.all(canvas.getAnimations({ subtree: true })
      .filter(a => a.effect?.getComputedTiming().iterations !== Infinity && a.effect?.target?.closest?.('[data-hud]') && a.effect.target.tagName !== 'polygon')
      .map(a => a.finished.catch(() => {})));
    return layoutCheck({ canvas, layer: null, lines: [{ el: $('label'), max: 3 }], grid: true });
  };
</script>
</body>
</html>
