<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>تجربة المساعد الصوتي</title>
<link rel="stylesheet" href="../css/tokens.css">
<style>
  /* صفحة تجربة داخلية للمقدّم (ت3)، لا شاشة جمهور. الأصفر للإبراز وحده، والأرقام إنجليزية. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow-x: hidden; }
  /* التطبيق يمنع تمرير الصفحة (scrollEnabled: false)، فالجسم نفسه يُمرَّر. */
  html { overflow: hidden; }
  body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  body {
    background: var(--stage-3); color: var(--on-stage); font-family: var(--font);
    font-size: 16px; -webkit-user-select: none; user-select: none;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 16px max(16px, env(safe-area-inset-left));
  }
  button, select { font: inherit; color: inherit; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bar h1 { font-size: 16px; margin: 0 0 0 auto; }
  .chip { background: var(--stage-2); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .chip.bad { background: var(--team-1); }
  .col select { width: 100%; }
  select, .btn { background: var(--stage-2); border: 0; border-radius: 8px; padding: 8px 12px; }
  .btn:active { filter: brightness(1.25); }
  .grid { display: grid; grid-template-columns: 190px minmax(0, 1fr) 200px; gap: 12px; margin-top: 12px; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; height: auto; } }
  .col { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  #mic {
    width: 100%; aspect-ratio: 1; max-height: 96px; max-width: 96px; margin: 0 auto; display: block; border-radius: 50%; border: 0;
    background: var(--stage-1); font-size: 22px; font-weight: 700;
  }
  #mic.on { background: var(--team-1); }
  #live { min-height: 2.6em; font-size: 15px; opacity: .85; text-align: center; }
  .card { background: var(--card); color: var(--ink); border-radius: 12px; padding: 14px; }
  #pick { font-size: 26px; font-weight: 800; min-height: 1.4em; }
  #pick .hl { background: var(--hl); padding: 0 8px; border-radius: 6px; }
  #why { font-size: 13px; opacity: .75; min-height: 1.3em; }
  #heard { font-size: 15px; margin-top: 6px; min-height: 1.3em; }
  #top { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  #top button { background: #E8EDFB; color: var(--ink); border: 0; border-radius: 8px; padding: 6px 10px; font-size: 14px; }
  .judge { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .judge button { border: 0; border-radius: 10px; padding: 10px; font-size: 17px; font-weight: 700; }
  #ok { background: #1F9D55; }
  #no { background: var(--team-1); }
  .judge button:disabled { opacity: .35; }
  #list { overflow: auto; font-size: 13px; background: var(--stage-2); border-radius: 10px; padding: 8px 10px; max-height: 260px; columns: 2; column-gap: 12px; }
  #list div { break-inside: avoid; padding: 2px 0; }
  #list .done { opacity: .45; text-decoration: line-through; }
  .run #list div { cursor: pointer; }
  .run #list .done { opacity: 1; text-decoration: none; background: var(--hl); color: var(--ink); border-radius: 6px; padding: 2px 6px; }
  #top button.man { outline: 2px dashed var(--ink); }
  #top button.extra { background: var(--hl); }
  #heard .w { border-radius: 4px; padding: 0 2px; }
  .run #heard .w { cursor: pointer; }
  #heard .w.sel { background: var(--hl); }
  #addx { margin-top: 8px; background: var(--ink); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font-size: 15px; }
    #stats { font-size: 13px; line-height: 1.6; }
  #stats b { font-size: 22px; }
  #log { overflow: auto; max-height: 72px; font-size: 12px; background: var(--stage-2); border-radius: 10px; padding: 6px 8px; }
  #log div { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
  #type { display: none; gap: 6px; }
  #type input { flex: 1; min-width: 0; font: inherit; border-radius: 8px; border: 0; padding: 8px; }
  .nofix #type { display: flex; }
  bdi { unicode-bidi: isolate; }
</style>
</head>
<body>
  <div class="bar">
    <h1>تجربة المساعد الصوتي</h1>
    <span class="chip" id="perm">…</span>
    <select id="engine" aria-label="المحرّك"><option value="old">المحرّك القديم</option></select>
    <select id="locale" aria-label="اللغة"></select>
    <button class="btn" id="dl" hidden>نزّل النموذج العربي</button>
    <button class="btn" id="offline" aria-pressed="true">دون إنترنت: نعم</button>
    <button class="btn" id="mode" aria-pressed="false">ضغطة لكل إجابة</button>
    <button class="btn" id="back">عودة إلى اللعبة</button>
  </div>

  <div class="grid">
    <div class="col">
      <select id="topic" aria-label="الموضوع"></select>
      <div id="list"></div>
    </div>

    <div class="col">
      <div class="card">
        <div id="pick">اختر موضوعاً ثم اضغط «اسمع»</div>
        <div id="why"></div>
        <div id="heard"></div>
        <button id="addx" hidden></button>
        <div id="top"></div>
      </div>
      <div class="judge">
        <button id="ok" disabled>✓ الاقتراح صحيح</button>
        <button id="no" disabled>✗ الاقتراح خطأ</button>
      </div>
      <div id="type"><input id="typed" placeholder="اكتب ما قيل (للتجربة دون هاتف)"><button class="btn" id="typedGo">طابق</button></div>
    </div>

    <div class="col">
      <button id="mic">اسمع</button>
      <div id="live"></div>
      <div id="stats"></div>
      <div id="log"></div>
      <div class="bar"><button class="btn" id="copy">نسخ النتائج</button><button class="btn" id="clear">مسح</button></div>
    </div>
  </div>

  <script type="module" src="voice.js"></script>
</body>
</html>
